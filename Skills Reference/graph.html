<!DOCTYPE html>
<html lang="en">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0F172A;--surface:#1E293B;--border:#334155;
  --text:#F1F5F9;--muted:#94A3B8;--accent:#3B82F6;
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* header */
header{display:flex;align-items:center;gap:.8rem;padding:.55rem 1.1rem;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.back-btn{display:inline-flex;align-items:center;gap:.3rem;color:var(--muted);font-size:.75rem;font-weight:600;text-decoration:none;letter-spacing:.04em;border:1px solid var(--border);border-radius:999px;padding:.3rem .8rem;transition:color .15s,border-color .15s}
.back-btn:hover{color:var(--text);border-color:var(--muted)}
h1{font-size:.9rem;font-weight:700;letter-spacing:.03em;margin-right:auto}
#search{padding:.35rem .8rem;background:var(--bg);border:1px solid var(--border);border-radius:999px;color:var(--text);font-size:.8rem;width:190px;outline:none;transition:border-color .15s}
#search:focus{border-color:var(--accent)}
#search::placeholder{color:var(--muted)}
.hbtn{padding:.3rem .8rem;background:transparent;border:1px solid var(--border);border-radius:999px;color:var(--muted);font-size:.74rem;font-weight:600;cursor:pointer;letter-spacing:.04em;transition:all .15s}
.hbtn:hover{color:var(--text);border-color:var(--muted)}
.hbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
#stats{font-size:.74rem;color:var(--muted)}

/* legend */
#legend{display:flex;gap:.4rem;flex-wrap:wrap;padding:.4rem 1.1rem;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
.leg{display:inline-flex;align-items:center;gap:.28rem;font-size:.67rem;color:var(--muted);cursor:pointer;padding:.13rem .38rem;border-radius:4px;transition:background .1s;user-select:none}
.leg:hover{background:var(--border);color:var(--text)}
.leg.off{opacity:.25}
.leg-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* layout */
.main{flex:1;display:flex;overflow:hidden;position:relative}
#canvas{flex:1;overflow:hidden;position:relative}
svg{display:block;width:100%;height:100%}

/* graph elements */
.link{stroke:#94A3B8;stroke-opacity:.45;stroke-width:1.4;fill:none}
.link.hi{stroke-opacity:.9;stroke-width:2.2}
.link.dim{stroke-opacity:.04}
.node-circle{stroke:#0F172A;stroke-width:1.5;cursor:pointer}
.node-circle.hi{stroke:#fff;stroke-width:2.5}
.node-circle.dim{opacity:.12}

.ref-node circle { stroke-dasharray: 3 2; opacity: 0; pointer-events: none; }
.ref-node.refs-on circle { opacity: 1; pointer-events: all; }
.ref-edge { stroke: #F59E0B !important; stroke-opacity: 0.35 !important;
  stroke-width: 1 !important; stroke-dasharray: 4 3; }
.ref-edge.refs-on { stroke-opacity: 0.5 !important; }
.ref-edge:not(.refs-on) { display: none; }
.node-label{font-size:9px;fill:#E2E8F0;pointer-events:none;text-anchor:middle;
  paint-order:stroke;stroke:#0F172A;stroke-width:3px;stroke-linejoin:round;opacity:0}
.node-label.vis{opacity:1}

/* tooltip */
#tt{position:fixed;pointer-events:none;z-index:30;background:var(--surface);
  border:1px solid var(--border);border-radius:8px;padding:.55rem .85rem;
  max-width:230px;box-shadow:0 4px 20px rgba(0,0,0,.6);font-size:.77rem;
  line-height:1.4;display:none}
.tt-name{font-weight:700;color:var(--text);margin-bottom:.18rem}
.tt-cat{font-size:.67rem;font-weight:700;margin-bottom:.28rem;letter-spacing:.04em}
.tt-tag{color:var(--muted)}

/* panel */
#panel{width:0;flex-shrink:0;background:var(--surface);border-left:1px solid var(--border);
  overflow:hidden;transition:width .2s ease;display:flex;flex-direction:column;position:relative}
#panel.open{width:270px;overflow-y:auto}
.pi{padding:1.1rem}
.pc{position:sticky;top:.6rem;float:right;background:var(--border);border:none;border-radius:50%;
  width:24px;height:24px;cursor:pointer;color:var(--muted);font-size:.85rem;
  display:inline-flex;align-items:center;justify-content:center;transition:background .15s}
.pc:hover{background:var(--accent);color:#fff}
.p-bar{height:4px;border-radius:2px;margin-bottom:.9rem}
.p-cat{font-size:.65rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:.25rem}
.p-name{font-size:1.05rem;font-weight:800;margin-bottom:.35rem}
.p-tag{font-size:.78rem;color:var(--muted);margin-bottom:.9rem;line-height:1.4}
.p-sec{font-size:.64rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:.9rem 0 .35rem}
.conn-list{list-style:none;display:flex;flex-direction:column;gap:.25rem}
.conn-item{font-size:.76rem;padding:.3rem .55rem;border-radius:5px;border:1px solid var(--border);
  cursor:pointer;display:flex;align-items:center;gap:.45rem;transition:background .1s}
.conn-item:hover{background:var(--border)}
.c-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.c-arr{font-size:.7rem;color:var(--muted);margin-left:auto}
.deck-link{display:inline-flex;align-items:center;gap:.3rem;margin-top:1rem;
  font-size:.71rem;color:var(--accent);text-decoration:none;
  border:1px solid var(--accent);border-radius:5px;padding:.3rem .65rem;transition:background .15s}
.deck-link:hover{background:var(--accent);color:#fff}
</style>
</head>

const CAT_COLORS = {"General Thinking": "#3B82F6", "Systems": "#0D9488", "Economics": "#16A34A", "Physics & Chemistry": "#EA580C", "Psychology": "#9333EA", "Startups": "#DC2626", "Business": "#475569", "Mathematics": "#4F46E5", "Network Effects": "#CA8A04", "Learning": "#059669", "Art": "#DB2777", "Pre-built Chains": "#B45309", "Sources": "#F59E0B"};

// ── Pre-compute degree ────────────────────────────────────────────────────────
const deg = {};
GRAPH.nodes.forEach(n => deg[n.id] = 0);
GRAPH.links.forEach(l => { deg[l.source] = (deg[l.source]||0)+1; deg[l.target] = (deg[l.target]||0)+1; });
const maxDeg = Math.max(1, ...Object.values(deg));
const nr = id => id >= 1000 ? 4 : 5 + (deg[id]||0) / maxDeg * 13;

// ── State ─────────────────────────────────────────────────────────────────────
let showLbls = false, selNode = null, searchQ = '', showRefs = false;
const activeCats = new Set(Object.keys(CAT_COLORS));

// ── SVG / zoom ────────────────────────────────────────────────────────────────
const svg   = d3.select('#svg');
const W     = () => document.getElementById('canvas').clientWidth  || 800;
const H     = () => document.getElementById('canvas').clientHeight || 600;
const zoomG = svg.append('g');
const lG    = zoomG.append('g');   // links layer
const nG    = zoomG.append('g');   // nodes layer

const zoom = d3.zoom().scaleExtent([.05, 10])
  .on('zoom', e => zoomG.attr('transform', e.transform));
svg.call(zoom).on('dblclick.zoom', null);

function fitView(dur) {
  svg.transition().duration(dur||0)
    .call(zoom.transform,
      d3.zoomIdentity.translate(W()/2, H()/2).scale(0.82));
}

// ── Simulation ────────────────────────────────────────────────────────────────
const nodes = GRAPH.nodes.map(d => ({...d}));
const links = GRAPH.links.map(d => ({...d}));

const sim = d3.forceSimulation(nodes)
  .force('link',    d3.forceLink(links).id(d => d.id).distance(60).strength(0.3))
  .force('charge',  d3.forceManyBody().strength(d => -180 - nr(d.id)*10))
  .force('center',  d3.forceCenter(0, 0))
  .force('collide', d3.forceCollide().radius(d => nr(d.id) + 4))
  .alphaDecay(0.03);

// ── Draw links ────────────────────────────────────────────────────────────────
const linkSel = lG.selectAll('line').data(links).join('line')
  .attr('class', d => 'link' + (d.refEdge ? ' ref-edge' : ''));

// ── Draw nodes ────────────────────────────────────────────────────────────────
const nodeG = nG.selectAll('g').data(nodes).join('g').attr('class', d => d.type==='reference'?'ref-node':'')
  .call(d3.drag()
    .on('start', (e,d) => { if(!e.active) sim.alphaTarget(.3).restart(); d.fx=d.x; d.fy=d.y; })
    .on('drag',  (e,d) => { d.fx=e.x; d.fy=e.y; })
    .on('end',   (e,d) => { if(!e.active) sim.alphaTarget(0); d.fx=null; d.fy=null; }));

const circles = nodeG.append('circle').attr('class','node-circle')
  .attr('r', d => nr(d.id)).attr('fill', d => d.color)
  .on('mouseenter', showTT).on('mousemove', moveTT).on('mouseleave', hideTT)
  .on('click', (e,d) => { e.stopPropagation(); pickNode(d); });

const labels = nodeG.append('text').attr('class','node-label')
  .text(d => d.name.length > 17 ? d.name.slice(0,16)+'…' : d.name)
  .attr('dy', d => nr(d.id) + 11);

// ── Tick ──────────────────────────────────────────────────────────────────────
sim.on('tick', () => {
  linkSel
    .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
    .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
  nodeG.attr('transform', d => `translate(${d.x},${d.y})`);
});

sim.on('end', () => fitView(600));
// Also fit once early so the graph is immediately visible during simulation
setTimeout(() => fitView(400), 300);

// ── Legend ────────────────────────────────────────────────────────────────────
const legEl = document.getElementById('legend');
Object.entries(CAT_COLORS).forEach(([cat, col]) => {
  const el = document.createElement('div');
  el.className = 'leg'; el.dataset.cat = cat;
  el.innerHTML = `<span class="leg-dot" style="background:${col}"></span>${cat}`;
  el.addEventListener('click', () => {
    if(activeCats.has(cat) && activeCats.size > 1) activeCats.delete(cat);
    else activeCats.add(cat);
    el.classList.toggle('off', !activeCats.has(cat));
    applyVis();
  });
  legEl.appendChild(el);
});

// ── Visibility ────────────────────────────────────────────────────────────────
function applyVis() {
  const q = searchQ.toLowerCase();
  const hits = new Set();
  if(q) nodes.forEach(n => { if(n.name.toLowerCase().includes(q)||n.tagline.toLowerCase().includes(q)) hits.add(n.id); });
  const connSet = selNode ? getConnSet(selNode) : null;

  // Toggle ref-node/ref-edge visibility via class (CSS handles display)
  document.querySelectorAll('.ref-node').forEach(el => el.classList.toggle('refs-on', showRefs));
  document.querySelectorAll('.ref-edge').forEach(el => el.classList.toggle('refs-on', showRefs));

  circles
    .classed('hi',  d => selNode ? (d.id===selNode.id || connSet.has(d.id)) : (q && hits.has(d.id)))
    .classed('dim', d => {
      if(d.type==='reference') return !showRefs || (selNode && !connSet.has(d.id) && selNode.id!==d.id);
      if(!activeCats.has(d.category)) return true;
      if(q && !hits.has(d.id)) return true;
      if(selNode && d.id!==selNode.id && !connSet.has(d.id)) return true;
      return false;
    });
  labels.classed('vis', d => {
    if(d.type==='reference') return showRefs && showLbls && (!selNode||connSet?.has(d.id)||d.id===selNode.id);
    return showLbls && activeCats.has(d.category) && (!q||hits.has(d.id)) && (!selNode||d.id===selNode.id||connSet?.has(d.id));
  });
  linkSel
    .classed('hi',  d => selNode && ((d.source.id??d.source)===selNode.id||(d.target.id??d.target)===selNode.id))
    .classed('dim', d => {
      const s = d.source.id??d.source, t = d.target.id??d.target;
      if(d.refEdge) return !showRefs || (selNode && s!==selNode.id && t!==selNode.id);
      if(!activeCats.has(nodes.find(n=>n.id===s)?.category)) return true;
      if(!activeCats.has(nodes.find(n=>n.id===t)?.category)) return true;
      if(q && !hits.has(s) && !hits.has(t)) return true;
      if(selNode && s!==selNode.id && t!==selNode.id) return true;
      return false;
    });
}

// ── Search ────────────────────────────────────────────────────────────────────
document.getElementById('search').addEventListener('input', e => { searchQ=e.target.value; applyVis(); });

// ── Labels ────────────────────────────────────────────────────────────────────
document.getElementById('lblbtn').addEventListener('click', function(){
  showLbls = !showLbls; this.classList.toggle('on',showLbls); applyVis();
});

// ── Reset ─────────────────────────────────────────────────────────────────────
document.getElementById('resetbtn').addEventListener('click', () => fitView(500));

// ── Tooltip ───────────────────────────────────────────────────────────────────
const ttEl = document.getElementById('tt');
function showTT(e,d) {
  document.getElementById('tt-name').textContent = d.name;
  const tc = document.getElementById('tt-cat');
  tc.style.color = d.color; tc.textContent = d.category;
  document.getElementById('tt-tag').textContent = d.tagline||'';
  ttEl.style.display='block'; moveTT(e);
}
function moveTT(e) {
  let x=e.clientX+14, y=e.clientY-10;
  if(x+ttEl.offsetWidth>window.innerWidth) x=e.clientX-ttEl.offsetWidth-14;
  if(y+ttEl.offsetHeight>window.innerHeight) y=e.clientY-ttEl.offsetHeight;
  ttEl.style.left=x+'px'; ttEl.style.top=y+'px';
}
function hideTT() { ttEl.style.display='none'; }

// ── Panel ─────────────────────────────────────────────────────────────────────
const nodeById = {};
nodes.forEach(n => nodeById[n.id]=n);

function getConnSet(d) {
  const s = new Set();
  links.forEach(l => {
    const src=l.source.id??l.source, tgt=l.target.id??l.target;
    if(src===d.id) s.add(tgt);
    if(tgt===d.id) s.add(src);
  });
  return s;
}

function pickNode(d) {
  selNode = d;
  const panel = document.getElementById('panel');
  document.getElementById('pbar').style.background = d.color;
  const pc = document.getElementById('pcat');
  pc.style.color = d.color; pc.textContent = d.category;
  document.getElementById('pname').textContent = d.type==='reference' ? (d.fullTitle||d.name) : d.name;
  document.getElementById('ptag').textContent  = d.type==='reference' ? (d.authorYear||'') : (d.tagline||'');
  document.getElementById('dlink').href = 'index.html';

  const connSet = getConnSet(d);
  const list = document.getElementById('clist');
  list.innerHTML='';

  const out = [], inc = [];
  links.forEach(l => {
    const src=l.source.id??l.source, tgt=l.target.id??l.target;
    if(src===d.id && nodeById[tgt]) out.push({n:nodeById[tgt],dir:'→'});
    else if(tgt===d.id && nodeById[src]) inc.push({n:nodeById[src],dir:'←'});
  });
  const merged = new Map();
  out.forEach(x => merged.set(x.n.id, {...x}));
  inc.forEach(x => { if(merged.has(x.n.id)) merged.get(x.n.id).dir='⇄'; else merged.set(x.n.id,{...x}); });

  if(!merged.size) {
    list.innerHTML='<li style="color:var(--muted);font-size:.76rem;padding:.25rem 0">No connections</li>';
  } else {
    [...merged.values()].sort((a,b)=>a.n.name.localeCompare(b.n.name)).forEach(({n,dir}) => {
      const li=document.createElement('li'); li.className='conn-item';
      li.innerHTML=`<span class="c-dot" style="background:${n.color}"></span><span style="flex:1">${n.name}</span><span class="c-arr">${dir}</span>`;
      li.addEventListener('click', ()=>pickNode(n));
      list.appendChild(li);
    });
  }

  panel.classList.add('open');
  applyVis();
}

document.getElementById('pclose').addEventListener('click', () => {
  selNode=null;
  document.getElementById('panel').classList.remove('open');
  applyVis();
});
svg.on('click', () => {
  if(selNode){ selNode=null; document.getElementById('panel').classList.remove('open'); applyVis(); }
});

// ── Sources toggle pill ────────────────────────────────────────────────────────
(function(){
  const legEl = document.getElementById('legend');
  const el = document.createElement('div');
  el.className = 'leg'; el.id = 'src-leg';
  el.innerHTML = '<span class="leg-dot" style="background:#F59E0B;border-radius:2px;width:8px;height:8px"></span>Sources';
  el.style.borderLeft = '1px solid #334155';
  el.style.marginLeft = '.4rem';
  el.style.paddingLeft = '.8rem';
  el.addEventListener('click', () => {
    showRefs = !showRefs;
    el.classList.toggle('on', showRefs);
    applyVis();
  });
  legEl.appendChild(el);
})();

</script>
