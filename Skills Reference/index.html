What is the replacement cost? What is the liquidation value in the downside scenario? Build your value estimate independently before exposing it to the asking price.</p></div><div class=\"ms-section\"><h3>Step 2 — Circle of Competence: Do I understand this business well enough to underwrite it?</h3><p>What is my genuine edge in evaluating this investment? If the answer is &quot;general business judgment and the information in the deck,&quot; that is not a circle of competence for a specific investment. Identify specifically what you know that would allow you to evaluate this accurately.</p></div><div class=\"ms-section\"><h3>Step 3 — Probabilistic Thinking: What is the distribution of outcomes?</h3><p>Build an explicit scenario analysis: base case (most likely), bull case (things go well), bear case (adverse but plausible), and catastrophic case (worst credible scenario). Assign probabilities and expected values to each. The expected value of the investment is the probability-weighted average of these scenarios.</p></div><div class=\"ms-section\"><h3>Step 4 — Second-order Effects: What happens after this investment is made?</h3><p>If this investment is successful, who else enters the market? What does success do to the competitive landscape, the regulatory environment, and the unit economics? Trace the second-order effects on the investment thesis.</p></div><div class=\"ms-section\"><h3>Step 5 — Margin of Safety: Is there a sufficient gap between price and value?</h3><p>Even if the value estimate is correct, the investment only generates adequate returns if the price provides sufficient discount. The gap between price and intrinsic value is the margin of safety — the protection against estimation error and adverse outcomes.</p></div><div class=\"ms-section\"><h3>Step 6 — Sunk Cost check: Am I making this decision freshly?</h3><p>If you have previously invested in this opportunity (prior investment, time spent, emotional commitment), run an explicit sunk cost check: &quot;If I were encountering this investment for the first time today, would I invest?&quot; If the answer is no, the sunk cost is contaminating the decision.</p></div><div class=\"ms-section\"><h3>Step 7 — Inversion: What would make this investment fail?</h3><p>List the specific conditions that would produce a catastrophic return. Are these conditions identifiable in advance? Are there monitoring signals? What is your exit condition if these conditions begin to manifest?</p></div><div class=\"ms-section\"><h3>Step 8 — Incentives: Are the principals aligned with my interests?</h3><p>Management/founder incentives, fund structure incentives, and board incentives all shape whether the people responsible for this investment are optimizing for the same outcome you are. Misaligned incentives produce systematic underperformance relative to potential.</p></div><div class=\"ms-section\"><h3>References</h3><p>Investment decision frameworks draw on Benjamin Graham's value investing framework and Charlie Munger's multi-model approach. No single originator; synthesizes multiple concepts in this collection.</p><ul><li><em>The Intelligent Investor</em> — Benjamin Graham (1949)</li><li><em>Poor Charlie's Almanack</em> — Charlie Munger, ed. Peter Kaufman (2005)</li></ul></div>","file":"12-Pre-built-Chains/investment-decision.md","searchText":"investment decision investment decision "},{"id":100,"name":"Life Decision","tagline":"Life Decision","category":"Pre-built Chains","color":"#B45309","preview":"","modal":"<div class=\"ms-section\"><h3>Step 1 — First Principles: What do you actually value?</h3><p>Before weighing options, articulate your values — not the values you think you should have, not the values your culture endorses, but the conditions under which you have been most alive, most engaged, and most satisfied. These are your first principles for the decision. The options that maximize your stated values (not your assumed values) are the ones worth exploring.</p></div><div class=\"ms-section\"><h3>Step 2 — Inversion: What would make you regret this choice?</h3><p>Bezos's regret minimization framework: project yourself to 80 years old and imagine looking back at this decision. Which option is more likely to produce the statement &quot;I wish I had...&quot;? Most people regret inaction more than action, and over-caution more than bold risk.</p></div><div class=\"ms-section\"><h3>Step 3 — Thought Experiment: What would your ideal version of this look like?</h3><p>Remove practical constraints for a moment and describe the ideal version of the path you're considering. This reveals what you actually want, separated from what you believe is available. Then ask: how far can I close the gap between ideal and achievable?</p></div><div class=\"ms-section\"><h3>Step 4 — Second-order Effects: What does each option make possible and what does it foreclose?</h3><p>Major life decisions are not just outcomes; they are platforms. What future options does each choice keep open? What does each close off? The option that maintains the most optionality in the right direction is generally preferable at high levels of uncertainty.</p></div><div class=\"ms-section\"><h3>Step 5 — Circle of Competence: Am I the right person to make this decision alone?</h3><p>For decisions that significantly affect others, or that involve domains where your judgment is less reliable (your own blind spots are hardest to see in personal decisions), seek input from people who know you well and will tell you the truth. Not people who will be supportive; people who will be honest.</p></div><div class=\"ms-section\"><h3>Step 6 — Sunk Cost: Am I staying on this path because it makes forward sense?</h3><p>Explicitly separate what you have invested in the current path from what the current path offers going forward. The history is not a reason to continue; only the forward value is.</p></div><div class=\"ms-section\"><h3>Step 7 — Probabilistic Thinking: What are the realistic scenarios, not the tail scenarios?</h3><p>Life decisions are often dominated by fear of the worst tail scenario or hope for the best. Ask: what is the base-rate outcome for people who make this choice? What does the realistic middle scenario look like, not the best or worst?</p></div><div class=\"ms-section\"><h3>Step 8 — Margin of Safety: Can you reverse this decision?</h3><p>Reversible decisions (moving cities, taking a new job) deserve less analysis and faster action than irreversible ones (having children, selling an asset that cannot be repurchased). For truly irreversible decisions, the margin of safety principle argues for proportionally more deliberation, more consultation, and more explicit modeling of the downside scenarios.</p>\n<br>\n<p><em>End of Skills Framework</em></p>\n<br>\n<p><strong>Version:</strong> 1.1 | <strong>Last updated:</strong> May 2026<br>\n<strong>Skills covered:</strong> 101 across 12 categories</p></div><div class=\"ms-section\"><h3>References</h3><p>Life decision frameworks synthesize Clayton Christensen's application of business strategy to personal choices, Jeff Bezos's regret minimization, and Kahneman's work on decision quality.</p><ul><li><em>How Will You Measure Your Life?</em> — Clayton M. Christensen, James Allworth & Karen Dillon (2012)</li><li><em>Thinking in Bets</em> — Annie Duke (2018)</li></ul></div>","file":"12-Pre-built-Chains/life-decision.md","searchText":"life decision life decision "},{"id":95,"name":"Market Entry","tagline":"Market Entry","category":"Pre-built Chains","color":"#B45309","preview":"","modal":"<div class=\"ms-section\"><h3>Step 1 — First Principles: What is this market actually?</h3><p>Define the market by the job-to-be-done, not by the incumbents. Who has this need? How are they currently getting it satisfied? What is the size of the unmet portion? Avoid working from competitor analysis — define the market from the customer's perspective first.</p></div><div class=\"ms-section\"><h3>Step 2 — Circle of Competence: Do we have genuine advantage here?</h3><p>What do we know about this market, customer, or product category that others don't? What capabilities do we bring that are genuinely superior for this market? Be honest about the gap between familiarity with a market and genuine advantage in it.</p></div><div class=\"ms-section\"><h3>Step 3 — Monopoly vs. Competition: What kind of market is this?</h3><p>Is this a competitive market where margins are thin and you need a specific differentiation strategy to survive? Is there a segment where a monopoly position is achievable through differentiation? Map the competitive landscape with specificity about where the white space is.</p></div><div class=\"ms-section\"><h3>Step 4 — Second-order Effects: What happens after we enter?</h3><p>Trace the competitive response: who will respond, how, on what timeline, and with what resources? How does our entry change the market dynamics? Are there regulatory, partner, or channel responses that will affect the viability of the entry strategy?</p></div><div class=\"ms-section\"><h3>Step 5 — Customer Development: Have we spoken to enough customers to validate the entry assumptions?</h3><p>What are the five most dangerous assumptions underlying the entry business case? Have they been tested with real customers? What is the minimum evidence required to proceed with confidence?</p></div><div class=\"ms-section\"><h3>Step 6 — Assumption Mapping: Rank and test the critical assumptions.</h3><p>Map all entry assumptions on importance vs. certainty. The high-importance, low-certainty quadrant defines the tests required before committing significant capital to the entry.</p></div><div class=\"ms-section\"><h3>Step 7 — Margin of Safety: What does the stress scenario look like?</h3><p>Model the entry under worst-credible conditions: customer acquisition takes three times as long, competitor response is faster and better-resourced, the first major customer churns. Is the entry still viable? If not, what changes would make it so?</p></div><div class=\"ms-section\"><h3>Step 8 — MVP: What is the minimum entry that generates valid learning?</h3><p>Design the entry as a structured experiment. What is the cheapest way to test the entry thesis before deploying full capital? A pilot geography, a lighthouse customer, a partnership — whatever generates maximum learning at minimum commitment.</p></div><div class=\"ms-section\"><h3>References</h3><p>Market entry strategy synthesizes Michael Porter's Five Forces, Clayton Christensen's disruption theory, and Geoffrey Moore's adoption lifecycle. No single originator.</p><ul><li><em>Competitive Strategy</em> — Michael E. Porter (1980)</li><li><em>Crossing the Chasm</em> — Geoffrey A. Moore (1991)</li></ul></div>","file":"12-Pre-built-Chains/market-entry.md","searchText":"market entry market entry "},{"id":94,"name":"Pricing Decision","tagline":"Pricing Decision","category":"Pre-built Chains","color":"#B45309","preview":"","modal":"<div class=\"ms-section\"><h3>Step 1 — First Principles: What are we actually selling?</h3><p>Strip away existing pricing conventions in your category. Ask: what value does the customer actually receive, and what would they pay to get that value from their best alternative (time, other products, doing without)?</p></div><div class=\"ms-section\"><h3>Step 2 — Customer Development: What is the customer's willingness to pay based on evidence?</h3><p>Run value-anchored pricing interviews using the Van Westendorp Price Sensitivity Meter or direct willingness-to-pay questions with existing customers. Distinguish the price at which the product feels too cheap (quality concern), too expensive (rejection), expensive-but-acceptable, and a good deal. Do not rely on stated willingness to pay alone — test with real payment gates.</p></div><div class=\"ms-section\"><h3>Step 3 — Trade-offs: What does each pricing model trade off?</h3><p>Map the decision: per-seat pricing (predictable revenue, scales with customer growth, penalises large teams), usage-based (aligned with value, unpredictable, benefits small users), annual prepaid (cash flow positive, requires strong trust), freemium (acquisition efficiency, conversion dependency). Each trade-off has second-order implications for the customer relationship, the sales motion, and cash flow.</p></div><div class=\"ms-section\"><h3>Step 4 — Second-order Effects: How does this price signal quality and position the product?</h3><p>Price is communication. A price below the psychological threshold for the segment signals low quality regardless of product quality. A price above the anchor point for the category signals premium and attracts customers for whom price is a quality signal. Trace the second-order positioning effects of each price point.</p></div><div class=\"ms-section\"><h3>Step 5 — Incentives: What behavior does this pricing structure incentivize in the customer?</h3><p>Usage-based pricing incentivizes customers to minimize usage. Per-seat pricing incentivizes adding users. Annual contracts incentivize low switching costs after the contract ends. Design the pricing structure so the incentivized behavior aligns with the customer's desired outcome.</p></div><div class=\"ms-section\"><h3>Step 6 — Experiment Design: Run a pricing test before committing.</h3><p>If possible, test multiple price points with new prospects simultaneously. Define the metric (conversion rate, ACV, NPS at 30 days) and the sample size required to detect a meaningful difference. Don't test by asking — test by charging.</p></div><div class=\"ms-section\"><h3>Step 7 — Margin of Safety: Can you sustain at this price under adverse scenarios?</h3><p>At the lowest credible volume, does this price cover fully loaded cost of delivery with adequate margin? Model the stress scenario before committing.</p>\n<br>\n<p><strong>Key failure modes to avoid:</strong> Anchoring to your cost structure rather than customer value; underpricing out of fear rather than evidence; setting price that contradicts positioning.</p></div><div class=\"ms-section\"><h3>References</h3><p>This pre-built chain synthesizes concepts from multiple fields including economics (price theory), psychology (anchoring, loss aversion), and strategy (competitive positioning). No single originator; draws on the framework authors listed throughout this collection.</p><ul><li><em>Priceless: The Myth of Fair Value</em> — William Poundstone (2010)</li><li><em>The Strategy and Tactics of Pricing</em> — Thomas T. Nagle & Georg Müller (2018)</li></ul></div>","file":"12-Pre-built-Chains/pricing-decision.md","searchText":"pricing decision pricing decision "},{"id":97,"name":"Product Launch","tagline":"Product Launch","category":"Pre-built Chains","color":"#B45309","preview":"","modal":"<div class=\"ms-section\"><h3>Step 1 — Product-Market Fit: Is PMF established, and for whom?</h3><p>Before launching, be explicit about the customer segment for whom you have evidence of strong PMF. Retention curves that flatten, cohort NPS above threshold, and organic word-of-mouth are the evidence. Don't launch before PMF is established in a specific, named segment — you will be paying to acquire customers who will churn.</p></div><div class=\"ms-section\"><h3>Step 2 — Assumption Mapping: What must be true for the launch to succeed?</h3><p>Map the assumptions underlying the launch plan: demand assumption (enough addressable customers exist), channel assumption (the acquisition channel will deliver at modelled CAC), timing assumption (market conditions support the launch), operational assumption (we can deliver at the volumes the launch generates). Rank them and validate the top three before committing.</p></div><div class=\"ms-section\"><h3>Step 3 — Inversion: How would this launch fail?</h3><p>Pre-mortem: it is 6 months after launch and the product has stalled. What are the most likely causes? Failing to get the initial customer base to activate? Word of mouth not spreading? A competitor response that undercut our positioning? Each failure mode should have a mitigation built into the launch plan.</p></div><div class=\"ms-section\"><h3>Step 4 — Bottlenecks: Where will we hit the constraint?</h3><p>As launch volumes scale, what breaks first? Customer support capacity, infrastructure, onboarding bandwidth, sales motion for enterprise deals? Identify the bottleneck before it hits.</p></div><div class=\"ms-section\"><h3>Step 5 — Activation Energy: What needs to happen for the first user to get value in the first session?</h3><p>The moment of first value — when the new user experiences the core value proposition for the first time — is the most critical activation energy problem in any launch. Design the entire first-run experience around minimizing the time and friction to that moment.</p></div><div class=\"ms-section\"><h3>Step 6 — Viral Growth: Is there a viral loop, and is it designed?</h3><p>If the product has viral potential, is the viral mechanism built into the launch plan? Who shares, why, how, and what do they share? What does the recipient experience that would make them activate?</p></div><div class=\"ms-section\"><h3>Step 7 — Framing and Audience: Is the launch communication designed for the right audience?</h3><p>Who is the specific person the launch communication is designed for? Is the framing of the value proposition in their language, addressing their specific jobs-to-be-done? Is the launch channel matched to where they are?</p></div><div class=\"ms-section\"><h3>Step 8 — Innovation Accounting: What will we measure in the first 30/60/90 days?</h3><p>Define the innovation accounting metrics before launch. What does success look like? What would indicate the need to pivot vs. continue? Set the thresholds in advance.</p></div><div class=\"ms-section\"><h3>References</h3><p>Product launch frameworks synthesize Geoffrey Moore's adoption curve, Eric Ries's Build-Measure-Learn, and Al Ries and Jack Trout's positioning work. No single originator.</p><ul><li><em>Positioning: The Battle for Your Mind</em> — Al Ries & Jack Trout (1981)</li><li><em>Crossing the Chasm</em> — Geoffrey A. Moore (1991)</li></ul></div>","file":"12-Pre-built-Chains/product-launch.md","searchText":"product launch product launch "},{"id":99,"name":"Should I Quit","tagline":"Should I Quit","category":"Pre-built Chains","color":"#B45309","preview":"","modal":"<div class=\"ms-section\"><h3>Step 1 — Sunk Cost check: Am I staying because it makes forward sense, or because of what I've invested?</h3><p>Explicitly acknowledge the investment made (years, relationships, identity, opportunity costs forgone). Then bracket it: &quot;If this were year one, knowing what I know now, would I choose this role/company/endeavor?&quot; The sunk cost should not be a reason to stay; it is done.</p></div><div class=\"ms-section\"><h3>Step 2 — Second-order Effects: What happens if I stay vs. if I leave?</h3><p>Model both directions explicitly. Stay: what does year 3 and year 5 look like on the current trajectory? Leave: what doors open, what doors close, what relationships are affected, what reputation effects occur?</p></div><div class=\"ms-section\"><h3>Step 3 — Opportunity Cost: What am I giving up by staying?</h3><p>The decision to stay is a decision not to pursue alternatives. Name the specific alternatives: other roles, other companies, starting something, returning to a field you left. Are any of these clearly superior to the current situation on a forward-looking basis?</p></div><div class=\"ms-section\"><h3>Step 4 — Circle of Competence: Is my unhappiness/dissatisfaction coming from something I'm well-placed to judge?</h3><p>Some dissatisfaction is meaningful signal (misaligned values, role that doesn't match skills, organization in genuine decline). Some is noise (temporary frustration, normal difficulty of any challenging work, the grass-is-greener illusion). Which is this?</p></div><div class=\"ms-section\"><h3>Step 5 — Inversion: What would definitely make this situation work?</h3><p>Before concluding it doesn't work, be specific: what would need to change for this situation to be one you'd actively choose to be in? If the changes required are realistic (role scope, team composition, reporting structure), have you explicitly requested them? If they are structural to the organization and unlikely to change, that is meaningful information.</p></div><div class=\"ms-section\"><h3>Step 6 — Regression to the Mean: Is this a temporary extreme or a stable average?</h3><p>Is the dissatisfaction coming from an unusually bad period (which will regress) or from the long-run average of the experience? Distinguish temporary lows (high-stress period, difficult project) from chronic systematic issues (values misalignment, poor manager who won't change, structural role fit problem).</p></div><div class=\"ms-section\"><h3>Step 7 — Probabilistic Thinking: What is the expected value of each path?</h3><p>Assign rough probabilities to the scenarios under each option: stay and conditions improve (probability?), stay and conditions stay the same (probability?), leave and land in a clearly superior situation (probability?), leave and land laterally or worse (probability?). The expected value calculation is the frame for the decision.</p></div><div class=\"ms-section\"><h3>Step 8 — Margin of Safety: Do I have the financial and personal runway to make this decision well?</h3><p>Decisions made under acute financial pressure or emotional exhaustion are compromized. Assess your runway — financial, relational, psychological — and make the decision at a moment of adequate stability if possible.</p></div><div class=\"ms-section\"><h3>References</h3><p>Decision frameworks for quitting synthesize Daniel Kahneman's work on sunk costs and loss aversion, Seth Godin's strategic quitting analysis, and Jeff Bezos's regret minimization framework.</p><ul><li><em>The Dip: A Little Book That Teaches You When to Quit</em> — Seth Godin (2007)</li><li><em>Thinking in Bets</em> — Annie Duke (2018)</li></ul></div>","file":"12-Pre-built-Chains/should-i-quit.md","searchText":"should i quit should i quit "},{"id":130,"name":"Transformation Chain","tagline":"","category":"Pre-built Chains","color":"#B45309","preview":"","modal":"<div class=\"ms-section\"><h3>When to Use</h3><p>Before launching any major organisational transformation: a merger, new operating model, digital transformation, cultural shift, or strategic pivot.</p></div><div class=\"ms-section\"><h3>Steps</h3><p>1. <strong>Diagnose current state</strong> — Cynefin + Organizational Culture + Stakeholder Mapping<br>\n2. <strong>Build urgency and coalition</strong> — Change Management (Kotter Steps 1–2)<br>\n3. <strong>Define the target state</strong> — Scenario Planning + Mission Command + Theory of Change<br>\n4. <strong>Clarify governance and accountability</strong> — RACI + Board Governance + Principal-Agent Problem<br>\n5. <strong>Manage risk</strong> — Risk Management + Pre-mortem + Margin of Safety<br>\n6. <strong>Execute adaptively</strong> — OODA Loop + Capacity Planning + Bottlenecks<br>\n7. <strong>Generate and celebrate early wins</strong> — Change Management (Kotter Steps 5–6)<br>\n8. <strong>Institutionalise</strong> — Organizational Culture + Goodhart's Law + Feedback Loops</p></div><div class=\"ms-section\"><h3>References</h3><p>The Transformation Chain synthesises Kotter's 8-Step Change Model, Schein's organisational culture framework, COSO's ERM, and the RACI governance model into a sequenced executive protocol.</p><p class=\"ref-item\"><em>Leading Change</em> — John Kotter, 1996</p><p class=\"ref-item\"><em>The Heart of Change</em> — John Kotter & Dan Cohen, 2002</p><p class=\"ref-item\"><em>Organizational Culture and Leadership</em> — Edgar Schein, 1985 (5th ed. 2017)</p></div>","file":"12-Pre-built-Chains/transformation.md","searchText":"transformation chain  "},{"id":129,"name":"Board Governance","tagline":"","category":"Leadership","color":"#1E40AF","preview":"Board Governance refers to the systems and principles by which organisations are directed and controlled at the highest level. Three fiduciary duties: Duty of Care (act with the diligence of a reasonably prudent person), Duty of Loyalty (act in the organisation's interest, not pe","modal":"<div class=\"ms-section\"><h3>Definition</h3><p>Board Governance refers to the systems and principles by which organisations are directed and controlled at the highest level. Three fiduciary duties: <strong>Duty of Care</strong> (act with the diligence of a reasonably prudent person), <strong>Duty of Loyalty</strong> (act in the organisation's interest, not personal interest), <strong>Duty of Obedience</strong> (act in accordance with the organisation's purpose).</p>\n<br>\n<p>The central principle: separation between governance (board) and management (executives). Epistemic capture — believing you understand the organisation because management told you so — is the failure mode behind almost every major governance collapse.</p></div><div class=\"ms-section\"><h3>Connections</h3></div><div class=\"ms-section\"><h3>References</h3><p><strong>Key frameworks:</strong> Cadbury Report (UK, 1992), Sarbanes-Oxley (US, 2002), King Reports (South Africa), OECD Principles of Corporate Governance (2023).</p>\n<br>\n<p>- <em>Corporate Governance</em> — Robert Monks &amp; Nell Minow, 5th ed. 2011<br>\n- <em>The Boardroom Imperative</em> — Ram Charan, 2005<br>\n- <em>OECD Principles of Corporate Governance</em> — OECD, 2023</p></div>","file":"11-Leadership/board-governance.md","searchText":"board governance  board governance refers to the systems and principles by which organisations are directed and controlled at the highest level. three fiduciary duties: duty of care (act with the diligence of a reasonably prudent person), duty of loyalty (act in the organisation's interest, not pe"},{"id":125,"name":"Change Management","tagline":"","category":"Leadership","color":"#1E40AF","preview":"Change Management is the structured approach to transitioning individuals, teams, and organisations from a current state to a desired future state. Two dominant frameworks: Kotter's 8-Step Model — create urgency, build a guiding coalition, form a vision, enlist volunteers, enable","modal":"<div class=\"ms-section\"><h3>Definition</h3><p>Change Management is the structured approach to transitioning individuals, teams, and organisations from a current state to a desired future state. Two dominant frameworks: <strong>Kotter's 8-Step Model</strong> — create urgency, build a guiding coalition, form a vision, enlist volunteers, enable action, generate short-term wins, sustain acceleration, institute change — and <strong>ADKAR</strong> (Awareness, Desire, Knowledge, Ability, Reinforcement), which focuses on individual-level change readiness.</p>\n<br>\n<p>Most transformations fail not because of flawed strategy but because of insufficient attention to the human side of change.</p></div><div class=\"ms-section\"><h3>Connections</h3></div><div class=\"ms-section\"><h3>References</h3><p><strong>Originators:</strong> Kurt Lewin (1947), John Kotter (1996), Jeff Hiatt / Prosci ADKAR (1998).</p>\n<br>\n<p>- <em>Leading Change</em> — John Kotter, 1996<br>\n- <em>ADKAR: A Model for Change in Business, Government and our Community</em> — Jeff Hiatt, 2006<br>\n- <em>Managing Transitions</em> — William Bridges, 2009</p></div>","file":"11-Leadership/change-management.md","searchText":"change management  change management is the structured approach to transitioning individuals, teams, and organisations from a current state to a desired future state. two dominant frameworks: kotter's 8-step model — create urgency, build a guiding coalition, form a vision, enlist volunteers, enable"},{"id":118,"name":"Mission Command","tagline":"","category":"Leadership","color":"#1E40AF","preview":"Mission Command (Auftragstaktik) is the doctrine that commanders should communicate what must be achieved and why, then leave how to the person with the best situational information. Developed by the Prussian military under Helmuth von Moltke the Elder, it was a rejection of rigi","modal":"<div class=\"ms-section\"><h3>Definition</h3><p>Mission Command (Auftragstaktik) is the doctrine that commanders should communicate <strong>what</strong> must be achieved and <strong>why</strong>, then leave <strong>how</strong> to the person with the best situational information. Developed by the Prussian military under Helmuth von Moltke the Elder, it was a rejection of rigid top-down orders in favour of adaptive, decentralised execution. Von Moltke's insight: no plan survives first contact with reality, and the only defence against an unpredictable environment is a force whose every member understands the commander's intent deeply enough to improvise intelligently when the plan breaks.</p></div><div class=\"ms-section\"><h3>Mental Model</h3><p>Think of Mission Command as the difference between a GPS app and a printed turn-by-turn list. The list fails the moment you take a wrong turn; the GPS re-routes because it knows the destination.</p>\n<br>\n<p>Three layers make Mission Command work:<br>\n1. <strong>Clarity of intent</strong> — what does success look like at the end state?<br>\n2. <strong>Boundaries</strong> — what constraints (resources, ethics, timing) are non-negotiable?<br>\n3. <strong>Trust and competence</strong> — subordinates must be capable enough to fill in the gaps.</p></div><div class=\"ms-section\"><h3>Connections</h3></div><div class=\"ms-section\"><h3>References</h3><p><strong>Originator:</strong> Helmuth von Moltke the Elder (1800–1891); codified for modern organisations by Stephen Bungay.</p>\n<br>\n<p>- <em>The Art of Action</em> — Stephen Bungay, 2011<br>\n- <em>Moltke on the Art of War: Selected Writings</em> — Helmuth von Moltke / Daniel Hughes ed., 1993<br>\n- <em>Turn the Ship Around!</em> — L. David Marquet, 2013</p></div>","file":"11-Leadership/mission-command.md","searchText":"mission command  mission command (auftragstaktik) is the doctrine that commanders should communicate what must be achieved and why, then leave how to the person with the best situational information. developed by the prussian military under helmuth von moltke the elder, it was a rejection of rigi"},{"id":119,"name":"OODA Loop","tagline":"","category":"Leadership","color":"#1E40AF","preview":"The OODA Loop (Observe → Orient → Decide → Act) is a decision cycle developed by US Air Force Colonel John Boyd from his study of fighter-pilot performance in the Korean War. American F-86 pilots had a better kill ratio against superior MiG-15s because their plane's better visibi","modal":"<div class=\"ms-section\"><h3>Definition</h3><p>The OODA Loop (Observe → Orient → Decide → Act) is a decision cycle developed by US Air Force Colonel John Boyd from his study of fighter-pilot performance in the Korean War. American F-86 pilots had a better kill ratio against superior MiG-15s because their plane's better visibility and more responsive controls allowed faster decision cycling — completing a new action before the enemy could respond to the last one.</p>\n<br>\n<p>Boyd extended the model into a general theory of competitive advantage: the party that can observe, orient, decide, and act faster creates a tempo of change that overwhelms the opponent's ability to respond.</p></div><div class=\"ms-section\"><h3>Mental Model</h3><p>The <strong>Orient</strong> step is the decisive stage — it's where incoming information is filtered and interpreted through mental models, previous experience, and cultural assumptions. Two people observing the same event will orient differently, and that difference determines the quality of every decision that follows.</p>\n<br>\n<p>Executives who seek disconfirming information and hold their mental models loosely are doing high-quality Orient work. Those who filter data through fixed beliefs are degrading the center of their own decision loop.</p></div><div class=\"ms-section\"><h3>Connections</h3></div><div class=\"ms-section\"><h3>References</h3><p><strong>Originator:</strong> John Boyd (1927–1997), US Air Force Colonel, through his unpublished briefings &quot;Patterns of Conflict&quot; and &quot;A Discourse on Winning and Losing.&quot;</p>\n<br>\n<p>- <em>boyd: The Fighter Pilot Who Changed the Art of War</em> — Robert Coram, 2002<br>\n- <em>Certain to Win</em> — Chet Richards, 2004<br>\n- <em>The Art of Maneuver</em> — Robert Leonhard, 1991</p></div>","file":"11-Leadership/ooda-loop.md","searchText":"ooda loop  the ooda loop (observe → orient → decide → act) is a decision cycle developed by us air force colonel john boyd from his study of fighter-pilot performance in the korean war. american f-86 pilots had a better kill ratio against superior mig-15s because their plane's better visibi"},{"id":124,"name":"Organizational Culture","tagline":"","category":"Leadership","color":"#1E40AF","preview":"Organizational Culture, in Edgar Schein's model, is the pattern of shared basic assumptions a group has learned as it solved problems of external adaptation and internal integration. Schein's decisive contribution was distinguishing three levels:","modal":"<div class=\"ms-section\"><h3>Definition</h3><p>Organizational Culture, in Edgar Schein's model, is the pattern of shared basic assumptions a group has learned as it solved problems of external adaptation and internal integration. Schein's decisive contribution was distinguishing three levels:</p>\n<br>\n<p>- <strong>Artefacts</strong> — visible structures, behaviours, and symbols (above the waterline)<br>\n- <strong>Espoused Values</strong> — stated strategies, goals, and philosophies (at the waterline)<br>\n- <strong>Basic Assumptions</strong> — unconscious, taken-for-granted beliefs that actually drive behaviour (deep underwater)</p>\n<br>\n<p>Culture change initiatives frequently fail because they target artefacts while leaving basic assumptions intact.</p></div><div class=\"ms-section\"><h3>Mental Model</h3><p>The diagnostic question is: <em>where do espoused values and actual behaviour diverge?</em> That gap is the location of the underlying basic assumptions. If a company espouses &quot;we celebrate failure&quot; but every post-mortem ends in blame, the basic assumption is that failure is career-threatening. No amount of redecorating the artefact layer will close that gap.</p>\n<br>\n<p>Culture change requires surfacing basic assumptions, making explicit what was previously implicit, and then demonstrating through repeated leader behaviour that the new assumption is operative. This is slow and cannot be delegated.</p></div><div class=\"ms-section\"><h3>Connections</h3></div><div class=\"ms-section\"><h3>References</h3><p><strong>Originator:</strong> Edgar Schein (1928–2023), Professor of Management at MIT Sloan School of Management.</p>\n<br>\n<p>- <em>Organizational Culture and Leadership</em> — Edgar Schein, 1985 (5th ed. 2017)<br>\n- <em>The Corporate Culture Survival Guide</em> — Edgar Schein, 1999<br>\n- <em>An Everyone Culture</em> — Robert Kegan &amp; Lisa Laskow Lahey, 2016</p></div>","file":"11-Leadership/organizational-culture.md","searchText":"organizational culture  organizational culture, in edgar schein's model, is the pattern of shared basic assumptions a group has learned as it solved problems of external adaptation and internal integration. schein's decisive contribution was distinguishing three levels:"},{"id":126,"name":"Risk Management","tagline":"","category":"Leadership","color":"#1E40AF","preview":"Enterprise Risk Management (ERM): the systematic process of identifying, assessing, and responding to risks that could affect an organisation's ability to achieve its objectives. Three foundational concepts: Risk appetite (amount of risk the board will accept), Risk tolerance (ac","modal":"<div class=\"ms-section\"><h3>Definition</h3><p>Enterprise Risk Management (ERM): the systematic process of identifying, assessing, and responding to risks that could affect an organisation's ability to achieve its objectives. Three foundational concepts: <strong>Risk appetite</strong> (amount of risk the board will accept), <strong>Risk tolerance</strong> (acceptable variation around appetite), and the <strong>Three Lines of Defence</strong> — (1) operations owns risk, (2) risk/compliance provides oversight, (3) internal audit provides independent assurance.</p>\n<br>\n<p>The goal is not to eliminate risk — it is to hold the right risks at the right level.</p></div><div class=\"ms-section\"><h3>Connections</h3></div><div class=\"ms-section\"><h3>References</h3><p><strong>Originators:</strong> COSO ERM framework (2004, updated 2017); ISO 31000; IIA Three Lines of Defence.</p>\n<br>\n<p>- <em>Enterprise Risk Management — Integrating with Strategy and Performance</em> — COSO, 2017<br>\n- <em>Against the Gods: The Remarkable Story of Risk</em> — Peter Bernstein, 1996<br>\n- <em>The Failure of Risk Management</em> — Douglas Hubbard, 2009</p></div>","file":"11-Leadership/risk-management.md","searchText":"risk management  enterprise risk management (erm): the systematic process of identifying, assessing, and responding to risks that could affect an organisation's ability to achieve its objectives. three foundational concepts: risk appetite (amount of risk the board will accept), risk tolerance (ac"}];

const CAT_COLORS = {"General Thinking": "#3B82F6", "Systems": "#0D9488", "Economics": "#16A34A", "Physics & Chemistry": "#EA580C", "Psychology": "#9333EA", "Startups": "#DC2626", "Business": "#475569", "Mathematics": "#4F46E5", "Network Effects": "#CA8A04", "Learning": "#059669", "Art": "#DB2777", "Pre-built Chains": "#B45309", "Leadership": "#1E40AF"};

let activecat = 'all', query = '';
const CAT_ORDER = Object.keys(CAT_COLORS);

function debounce(fn, ms) {
  let t;
  return (...args) => {
    clearTimeout(t);
    t = setTimeout(() => fn(...args), ms);
  };
}

function esc(s) {
  return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function topOverlay() {
  const refs = document.getElementById('refs-overlay');
  const modal = document.getElementById('overlay');
  if (refs?.classList.contains('open')) return 'refs';
  if (modal?.classList.contains('open')) return 'modal';
  return null;
}

function buildFilters() {
  const el = document.getElementById('filters');
  el.replaceChildren();
  const btn = (cat, label, color) => {
    const b = document.createElement('button');
    b.className = 'fbtn' + (cat === 'all' ? ' active' : '');
    b.dataset.cat = cat;
    b.textContent = label;
    if (cat !== 'all' && color) b.style.color = color;
    b.addEventListener('click', () => { activecat = cat; render(); });
    el.appendChild(b);
  };
  const counts = {};
  SKILLS.forEach(s => { counts[s.category] = (counts[s.category] || 0) + 1; });
  btn('all', 'All  ' + SKILLS.length, null);
  CAT_ORDER.forEach(c => {
    if (counts[c]) {
      btn(c, c.replace('Pre-built Chains', '⛓ Chains').replace('Physics & Chemistry', 'Physics/Chem'), CAT_COLORS[c]);
    }
  });
}

function filtered() {
  const q = query.toLowerCase().trim();
  return SKILLS.filter(s => {
    if (activecat !== 'all' && s.category !== activecat) return false;
    if (!q) return true;
    const hay = s.searchText || [s.name, s.tagline, s.preview].join(' ').toLowerCase();
    return hay.includes(q);
  });
}

function render() {
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  const stats = document.getElementById('stats');
  const fs = filtered();

  document.querySelectorAll('.fbtn').forEach(b => {
    b.classList.toggle('active', b.dataset.cat === activecat);
    if (b.dataset.cat !== 'all' && CAT_COLORS[b.dataset.cat]) {
      b.style.background = b.classList.contains('active') ? CAT_COLORS[b.dataset.cat] : '';
      b.style.color = b.classList.contains('active') ? '#fff' : CAT_COLORS[b.dataset.cat];
      b.style.borderColor = b.classList.contains('active') ? CAT_COLORS[b.dataset.cat] : '';
    } else if (b.dataset.cat === 'all') {
      b.style.background = b.classList.contains('active') ? 'var(--hdr-bg)' : '';
      b.style.color = b.classList.contains('active') ? '#fff' : '';
      b.style.borderColor = b.classList.contains('active') ? 'var(--hdr-bg)' : '';
    }
  });

  const catCount = CAT_ORDER.length;
  stats.textContent = query
    ? `${fs.length} skill${fs.length !== 1 ? 's' : ''} match "${query}"`
    : `${fs.length} skill${fs.length !== 1 ? 's' : ''}${activecat !== 'all' ? ' in ' + activecat : ' across ' + catCount + ' categories'}`;

  grid.querySelectorAll('.card').forEach(c => c.remove());
  empty.style.display = fs.length ? 'none' : 'block';

  const frag = document.createDocumentFragment();
  fs.forEach(s => {
    const card = document.createElement('div');
    card.className = 'card';
    const isChain = s.category === 'Pre-built Chains';
    card.innerHTML = `
      <div class="card-accent" style="background:${s.color}"></div>
      <div class="card-body">
        <div class="card-cat" style="color:${s.color}">${esc(s.category)}</div>
        <div class="card-name">${esc(s.name)}</div>
        ${s.tagline ? `<div class="card-tagline">${esc(s.tagline)}</div>` : ''}
        <div class="card-preview">${esc(s.preview)}</div>
      </div>
      <div class="card-footer">
        ${isChain ? '<span class="card-chain-badge">⛓ Decision Chain</span>' : '<span></span>'}
        <span class="card-link">click to expand →</span>
      </div>`;
    card.addEventListener('click', () => openModal(s));
    frag.appendChild(card);
  });
  grid.appendChild(frag);
}

function openModal(s) {
  const overlay = document.getElementById('overlay');
  const modal = document.getElementById('modal');
  document.getElementById('modal-top').style.background = s.color;
  document.getElementById('modal-cat').style.color = s.color;
  document.getElementById('modal-cat').textContent = s.category;
  document.getElementById('modal-name').textContent = s.name;
  document.getElementById('modal-tagline').textContent = s.tagline || '';
  document.getElementById('modal-file').innerHTML =
    `<a href="${esc(s.file)}" style="color:#94A3B8;font-size:.72rem">📄 Open deep-dive: ${esc(s.file)}</a>`;
  document.getElementById('modal-body').innerHTML = s.modal;
  overlay.classList.add('open');
  overlay.setAttribute('aria-hidden', 'false');
  modal.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
  document.getElementById('modal-close').focus();
}

function closeModal() {
  const overlay = document.getElementById('overlay');
  const modal = document.getElementById('modal');
  overlay.classList.remove('open');
  overlay.setAttribute('aria-hidden', 'true');
  modal.setAttribute('aria-hidden', 'true');
  if (topOverlay() === null) document.body.style.overflow = '';
}

function buildRefsPanel(filter) {
  const q = (filter || '').toLowerCase();
  const body = document.getElementById('refs-body');
  const cnt = document.getElementById('refs-count');
  const shown = q
    ? REFS_DATA.filter(r =>
        r.title.toLowerCase().includes(q) ||
        r.authorYear.toLowerCase().includes(q) ||
        r.skills.some(sk => sk.name.toLowerCase().includes(q)))
    : REFS_DATA;
  cnt.textContent = shown.length + ' source' + (shown.length !== 1 ? 's' : '');
  body.innerHTML = shown.map(r => {
    const pills = r.skills.map(sk =>
      `<span class="ref-skill-pill" data-sid="${sk.id}"
        style="background:${sk.color}1a;color:${sk.color};border-color:${sk.color}55"
      >${esc(sk.name)}</span>`
    ).join('');
    return `<div class="ref-entry">
      <div class="ref-title">${esc(r.title)}</div>
      <div class="ref-author">${esc(r.authorYear)}</div>
      <div class="ref-skills">${pills}</div>
    </div>`;
  }).join('');
}

function openRefs() {
  buildRefsPanel('');
  const overlay = document.getElementById('refs-overlay');
  const panel = document.getElementById('refs-panel');
  overlay.classList.add('open');
  overlay.setAttribute('aria-hidden', 'false');
  panel.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
  document.getElementById('refs-search').focus();
}

function closeRefs() {
  const overlay = document.getElementById('refs-overlay');
  const panel = document.getElementById('refs-panel');
  overlay.classList.remove('open');
  overlay.setAttribute('aria-hidden', 'true');
  panel.setAttribute('aria-hidden', 'true');
  if (topOverlay() === null) document.body.style.overflow = '';
}

document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('overlay')) closeModal();
});

document.getElementById('search').addEventListener('input', debounce(e => {
  query = e.target.value;
  render();
}, 200));

document.getElementById('refs-btn').addEventListener('click', openRefs);
document.getElementById('refs-close').addEventListener('click', closeRefs);
document.getElementById('refs-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('refs-overlay')) closeRefs();
});
document.getElementById('refs-search').addEventListener('input', debounce(e => {
  buildRefsPanel(e.target.value);
}, 200));

document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  const top = topOverlay();
  if (top === 'refs') closeRefs();
  else if (top === 'modal') closeModal();
});

document.getElementById('refs-panel').addEventListener('click', e => {
  const pill = e.target.closest('.ref-skill-pill');
  if (!pill) return;
  const sid = parseInt(pill.dataset.sid, 10);
  const skill = SKILLS.find(s => s.id === sid);
  if (skill) { closeRefs(); openModal(skill); }
});

document.getElementById('modal-body').addEventListener('click', e => {
  const link = e.target.closest('.skill-link');
  if (!link) return;
  e.preventDefault();
  const sid = parseInt(link.dataset.id, 10);
  const target = SKILLS.find(s => s.id === sid);
  if (target) openModal(target);
});

buildFilters();
render();

</script>
</body>
</html>
