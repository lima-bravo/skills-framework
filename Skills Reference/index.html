nd most of their innovation energy generating and evaluating solutions to a problem that was never properly understood. Design thinking inverts this: the empathize and define stages are where the highest-leverage work happens, because correctly defining the problem makes solution generation straightforward. The classic design thinking insight — &quot;you're not designing a blood test kit, you're designing the experience of a sick person waiting for news&quot; — illustrates why shallow problem definition produces solutions that are technically correct and humanly wrong. Prototyping in design thinking is also fundamentally different from prototyping in engineering: design thinking prototypes are tools for thinking, not demonstrations of a solution. A paper sketch that tests whether users understand a navigation concept in 20 minutes is more valuable than a polished mockup that confirms assumptions over two weeks. The point of the prototype is to fail quickly and specifically — to learn exactly which part of the current solution is wrong so the problem definition can be refined.</p></div><div class=\"ms-section\"><h3>Practitioner Heuristics</h3><ul>\n<li><strong>Spend more time on problem definition than feels right.</strong> The empathize and define stages are consistently under-invested. A team that cannot write a specific, testable &quot;How Might We&quot; statement after empathy work has not yet understood the problem.</li>\n<li><strong>Interview for behavior, not opinions.</strong> &quot;What would you do if...&quot; produces rationalization. &quot;Tell me about the last time you...&quot; produces real behavior. Observation of actual behavior is more valuable still. Design thinking's empathy stage is only as good as the quality of the field data it collects.</li>\n<li><strong>Prototype the assumption, not the solution.</strong> Before building anything, identify the single most important assumption embedded in your current solution. Prototype that assumption — the minimum representation that would test it — rather than a working version of the solution.</li>\n<li><strong>Use constraints to force creativity in ideation.</strong> &quot;How might we redesign the waiting room experience with no budget?&quot; produces more creative solutions than open-ended ideation. Constraints focus divergent energy.</li>\n<li><strong>Reframe failure as data, not defeat.</strong> A prototype that fails has succeeded in providing learning. The question after every failed test is not &quot;should we abandon this?&quot; but &quot;what specifically did we learn, and how does that update the problem definition?&quot;</li>\n</ul></div><div class=\"ms-section\"><h3>Common Failure Modes</h3><ul>\n<li><strong>Skipping empathy to get to ideation.</strong> Teams know what the solution is before they start; the empathy stage becomes validation theater. The result is innovation that solves an imagined problem.</li>\n<li><strong>One-shot process thinking.</strong> Running design thinking as a single workshop and expecting a polished solution. Design thinking is iterative — the first round of prototyping is not supposed to produce the answer but to refine the problem definition.</li>\n<li><strong>Prototyping the solution rather than the assumption.</strong> Building a functional prototype of the preferred solution rather than a minimal test of the riskiest assumption. This conflates design thinking with traditional development and loses the learning efficiency.</li>\n<li><strong>Treating the methodology as the output.</strong> Organizations that run design sprints to signal innovation capability without genuine commitment to acting on the findings. Participants experience the process; the results go unimplemented.</li>\n<li><strong>Confusing stakeholder needs with user needs.</strong> Design thinking centers the end user; most organizational processes center the stakeholder. Mixing the two produces solutions that satisfy internal requirements but fail the humans they were meant to serve.</li>\n</ul></div><div class=\"ms-section\"><h3>Worked Example</h3><p>IDEO was hired to redesign the patient experience in a large hospital. The standard approach would have been to interview administrators and clinical staff about workflow inefficiencies. Instead, the IDEO team checked a researcher into the hospital as a patient for several days. They found that the defining feature of the patient experience was not clinical quality but unrelenting ceiling-staring: patients spent 90% of their time lying on their backs, looking up at fluorescent lights and ceiling tiles, with no control over information or environment. The redesign that followed was not primarily about clinical processes — it was about giving patients agency over their visual environment, improving the ceiling aesthetics and information displays, and creating interaction points that let patients feel less like subjects being processed. These solutions were invisible to any analysis that started in the conference room with administrators. They emerged only from genuine empathy — inhabiting the user's experience rather than describing it.</p></div><div class=\"ms-section\"><h3>Connections</h3><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"103\"><strong>Jobs to Be Done</strong></a> — design thinking's empathy stage and JTBD interviews are complementary: JTBD identifies the functional, social, and emotional job; design thinking uncovers the human experience surrounding it.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"66\"><strong>Customer Development</strong></a> — customer development and design thinking share the commitment to field-based learning before solution building; design thinking adds structured ideation and rapid prototyping to the customer development toolkit.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"107\"><strong>Divergent and Convergent Thinking</strong></a> — design thinking is structured around alternating divergent phases (empathy, ideation) and convergent phases (problem definition, prototype selection, insight synthesis).</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"73\"><strong>Assumption Mapping</strong></a> — design thinking's prototyping stage is most productive when combined with assumption mapping: the prototype tests the highest-priority assumption explicitly.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"63\"><strong>Build-Measure-Learn</strong></a> — build-measure-learn and design thinking are complementary: design thinking produces the right question to test; build-measure-learn provides the quantitative loop to validate the answer at scale.</p></div><div class=\"ms-section\"><h3>References</h3><p>Herbert Simon introduced design as a 'science of the artificial' (1969). The modern human-centered design process was developed by IDEO (David Kelley, Tim Brown) and the Stanford d.school.</p><ul><li><em>Change by Design</em> — Tim Brown (2009)</li><li><em>The Design of Everyday Things</em> — Don Norman (1988; revised 2013)</li><li><em>Creative Confidence</em> — Tom Kelley & David Kelley (2013)</li></ul></div>","file":"06-Startups/design-thinking.md","searchText":"design thinking a human-centered innovation process — empathize, define, ideate, prototype, test — that insists on understanding people's actual experience before generating solutions. design thinking is a structured, iterative, human-centered innovation process developed at ideo and formalized at the stanford d.school. its five stages — empathize, define, ideate, prototype, test — are designed to ensure that innovation begins with a deep understanding of the p"},{"id":67,"name":"Innovation Accounting","tagline":"Measure progress toward validated learning","category":"Startups","color":"#DC2626","preview":"Innovation accounting (Eric Ries) is a framework for measuring the progress of a startup in a way that is meaningful when traditional metrics (revenue, profit, growth) are not yet established or are misleading. Traditional accounting measures the output of a business operating in","modal":"<div class=\"ms-section\"><h3>Definition</h3><p>Innovation accounting (Eric Ries) is a framework for measuring the progress of a startup in a way that is meaningful when traditional metrics (revenue, profit, growth) are not yet established or are misleading. Traditional accounting measures the output of a business operating in a known market. Innovation accounting measures progress toward finding a validated business model — the learning that occurs before the business model is known.</p>\n<br>\n<p>The three milestones of innovation accounting: (1) use an MVP to establish real baseline data; (2) tune the engine — test improvements toward the ideal; (3) pivot or persevere based on whether the trajectory is improving fast enough.</p></div><div class=\"ms-section\"><h3>Mental Model</h3><p>In a startup, improving traditional metrics can actually obscure lack of progress — revenue growth through discounting, or user growth through paid channels, can mask the absence of product-market fit. Innovation accounting separates &quot;working harder on the same model&quot; from &quot;validating the model.&quot; The practitioner measures what genuine progress looks like for the stage of the business.</p></div><div class=\"ms-section\"><h3>Practitioner Heuristics</h3><ul>\n<li><strong>Define the metrics for each stage of your funnel explicitly.</strong> Awareness → interest → consideration → trial → retention → referral. Which stage is the bottleneck? That stage's metric is the innovation accounting metric to move.</li>\n<li><strong>Use cohort analysis rather than aggregate metrics.</strong> Aggregate metrics smooth over the difference between old customers (who have been retained through inertia) and new customers (who reflect current product-market fit). Cohort retention curves are the most honest PMF measurement.</li>\n<li><strong>Treat the vanity metric baseline as the enemy.</strong> Total users, total revenue, total downloads are easy to make look good by adding inputs. Cohort retention, activation rate, and referral rate are harder to game and more informative.</li>\n<li><strong>Connect every initiative to a hypothesis and an innovation accounting metric.</strong> &quot;We're building Feature X&quot; is not an innovation accounting statement. &quot;We're building Feature X to test whether it moves activation from 20% to 35%, which our model says is the threshold for sustainable growth&quot; is.</li>\n<li><strong>Run the numbers on &quot;is this trajectory sufficient?&quot;</strong> Even a positive trajectory on the right metrics may not be sufficient. A company improving retention by 1 percentage point per quarter may never reach the threshold for organic growth.</li>\n</ul></div><div class=\"ms-section\"><h3>Common Failure Modes</h3><ul>\n<li><strong>Measuring activity instead of learning.</strong> &quot;We ran 15 experiments&quot; is activity; &quot;we learned that our activation problem is in the onboarding email, not the product&quot; is learning.</li>\n<li><strong>One-size-fits-all metrics across growth stages.</strong> Pre-PMF metrics (does this work at all?) are different from post-PMF metrics (can we scale this?). Using scale metrics before PMF is confirmed produces misleading conclusions.</li>\n</ul></div><div class=\"ms-section\"><h3>Worked Example</h3><p>A mobile app team tracks DAU (daily active users) as their north star metric. DAU is growing 20% per month — excellent by any standard. But a cohort analysis reveals that day-30 retention is 3% — almost no one who downloads the app is still using it a month later. The growth in DAU is entirely driven by increasing acquisition spend; the product is not retaining users. Innovation accounting reveals the business is not progressing; traditional accounting (revenue, downloads) shows impressive growth.</p></div><div class=\"ms-section\"><h3>Connections</h3><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"63\"><strong>Build-Measure-Learn</strong></a> — innovation accounting is the measurement discipline within BML.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"62\"><strong>Product-Market Fit</strong></a> — innovation accounting is the toolkit for measuring progress toward PMF.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"72\"><strong>Experiment Design</strong></a> — the rigor of experiment design determines the quality of innovation accounting data.</p></div><div class=\"ms-section\"><h3>References</h3><p>Introduced by Eric Ries in The Lean Startup (2011) to provide a rigorous alternative to vanity metrics for measuring early-stage progress.</p><ul><li><em>The Lean Startup</em> — Eric Ries (2011)</li><li><em>Measure What Matters</em> — John Doerr (2018)</li></ul></div>","file":"06-Startups/innovation-accounting.md","searchText":"innovation accounting measure progress toward validated learning innovation accounting (eric ries) is a framework for measuring the progress of a startup in a way that is meaningful when traditional metrics (revenue, profit, growth) are not yet established or are misleading. traditional accounting measures the output of a business operating in"},{"id":103,"name":"Jobs to Be Done","tagline":"People don't buy products — they hire them to do a job in their life.","category":"Startups","color":"#DC2626","preview":"Jobs to Be Done (JTBD) is a framework for understanding why customers adopt products and services. The central claim is that customers do not buy products for their features or because of their demographic profile — they hire products to make progress in a specific circumstance. ","modal":"<div class=\"ms-section\"><h3>Definition</h3><p>Jobs to Be Done (JTBD) is a framework for understanding why customers adopt products and services. The central claim is that customers do not buy products for their features or because of their demographic profile — they hire products to make progress in a specific circumstance. The &quot;job&quot; is the functional, social, and emotional progress the customer is trying to achieve. Understanding the job — and the context in which it arises — predicts switching behavior, reveals true competition, and guides feature development far more reliably than product-centric or demographic analysis.</p></div><div class=\"ms-section\"><h3>Mental Model</h3><p>An experienced practitioner thinks about every product and feature decision through the lens of the job: what is the customer trying to accomplish, in what specific circumstance, and what are the functional, social, and emotional dimensions of that goal? The framework has two powerful implications that are regularly missed. First, competition is defined by the job, not the product category. A milkshake doesn't compete with other milkshakes — it competes with everything a commuter could hire to make a boring drive more engaging: a banana, a podcast, a coffee. Defining competition by job rather than category opens and reshapes market analysis. Second, the switch decision — why a customer moves from their current solution to yours — is the richest source of insight. Customers switch when their current solution fails to do the job well, or when a new option does it better. The moment of switch is where motivation is highest and data is most honest. JTBD redirects product thinking from &quot;what features do customers want?&quot; (which produces feature lists and survey noise) to &quot;what situation triggers the need, what are they trying to accomplish, and what does good look like to them?&quot; — which produces insight about real value.</p></div><div class=\"ms-section\"><h3>Practitioner Heuristics</h3><ul>\n<li><strong>Interview around the purchase decision, not the product.</strong> Ask: What were you doing when you first thought you needed this? What did you try before? What made you decide to switch? This reconstructs the circumstance and reveals the job.</li>\n<li><strong>Identify all three dimensions of the job.</strong> Functional (what task is being accomplished), social (how does this affect how others perceive the customer), and emotional (how does it make the customer feel). Products that address all three build deeper loyalty.</li>\n<li><strong>Define your real competition by the job.</strong> Ask: &quot;What else could someone hire to do this same job?&quot; Include non-consumption — doing nothing, doing it themselves — as a competitor.</li>\n<li><strong>Design features around job completion, not feature parity.</strong> The question is not &quot;what do competitors have?&quot; but &quot;what does a customer need to get the job done reliably and satisfyingly?&quot;</li>\n<li><strong>Distinguish the job-to-be-done from the desired outcome.</strong> The job is the progress sought; the outcome is how the customer measures success. &quot;I want to feel confident in my decision&quot; is a job; &quot;I need to review three comparable options&quot; is an outcome measure.</li>\n</ul></div><div class=\"ms-section\"><h3>Common Failure Modes</h3><ul>\n<li><strong>Defining the job too narrowly.</strong> &quot;Help me drill a quarter-inch hole&quot; misses the job (hang something on the wall) and the emotional layer (make my space feel like home). Narrow job definitions produce incrementally better drills rather than stud finders, hooks, or command strips.</li>\n<li><strong>Defining the job too broadly.</strong> &quot;Help me be happier&quot; is too abstract to generate product insight. The job must be specific enough to reveal what &quot;done&quot; looks like and what failure looks like.</li>\n<li><strong>Ignoring the switch moment.</strong> Most product teams talk to current satisfied users. The most actionable insight comes from recent switchers — people who just adopted the product or who just left for a competitor.</li>\n<li><strong>Treating JTBD as a replacement for quantitative data.</strong> JTBD is qualitative and contextual. It reveals what to build and why; quantitative analysis reveals how much of it to build and for whom.</li>\n<li><strong>Feature-washing.</strong> Reframing existing feature roadmaps as &quot;jobs&quot; without changing the underlying analysis. The framework produces genuine insight only when it genuinely changes how customer needs are investigated.</li>\n</ul></div><div class=\"ms-section\"><h3>Worked Example</h3><p>McDonald's wanted to improve milkshake sales. Conventional market research — demographic profiling, flavor testing — produced no actionable insight. Clayton Christensen's team shadowed customers and found that nearly half of all milkshakes were purchased before 9am by solo commuters. The job: hire something to make a long, boring commute more engaging, while keeping one hand on the wheel, without getting hungry by 10am. The milkshake competed not with other milkshakes but with bananas (finished too fast, not filling), bagels (too crumbly, require two hands), and donuts (messy). To do the job better, the milkshake needed to be thicker (more viscous = longer engagement), more interesting in flavor (reduce boredom), and available faster at the drive-through. None of these insights came from asking customers what they wanted in a milkshake — they came from understanding the job and the circumstances in which it arose.</p></div><div class=\"ms-section\"><h3>Connections</h3><p class=\"connection\">→ <strong>Customer Development</strong> — JTBD defines what questions to ask in customer development interviews; the two frameworks are complementary and should be run together.</p><p class=\"connection\">→ <strong>Value Prop Canvas</strong> — the customer jobs section of the value prop canvas is a direct application of JTBD thinking; JTBD provides the underlying theory.</p><p class=\"connection\">→ <strong>Product-Market Fit</strong> — product-market fit, at its core, is a product that does the job better than any alternative. JTBD is the diagnostic tool for understanding whether and why fit exists.</p><p class=\"connection\">→ <strong>Build-Measure-Learn</strong> — JTBD defines what to build (job-completing features) and what to measure (job completion rate and satisfaction); it sharpens the hypothesis in each build-measure-learn cycle.</p><p class=\"connection\">→ <strong>First Principles</strong> — JTBD is an application of first principles to product strategy: stripping away assumptions about product categories to ask what the customer fundamentally needs.</p></div><div class=\"ms-section\"><h3>References</h3><p>The Jobs to Be Done framework was developed by Clayton Christensen, Bob Moesta, and Anthony Ulwick in the 1990s–2000s. Christensen's milkshake interview became the iconic illustration.</p><ul><li><em>Competing Against Luck</em> — Clayton M. Christensen, Taddy Hall, Karen Dillon & David S. Duncan (2016)</li><li><em>Jobs to Be Done: Theory to Practice</em> — Anthony W. Ulwick (2016)</li><li><em>The Innovator's Dilemma</em> — Clayton M. Christensen (1997)</li></ul></div>","file":"06-Startups/jobs-to-be-done.md","searchText":"jobs to be done people don't buy products — they hire them to do a job in their life. jobs to be done (jtbd) is a framework for understanding why customers adopt products and services. the central claim is that customers do not buy products for their features or because of their demographic profile — they hire products to make progress in a specific circumstance. "},{"id":64,"name":"MVP","tagline":"The minimum viable product generates maximum learning","category":"Startups","color":"#DC2626","preview":"The Minimum Viable Product is the version of a product with the minimum set of features required to generate the learning that validates (or invalidates) the riskiest assumptions in the business model. Eric Ries's definition: not a smaller, cheaper product — a fundamentally diffe","modal":"<div class=\"ms-section\"><h3>Definition</h3><p>The Minimum Viable Product is the version of a product with the minimum set of features required to generate the learning that validates (or invalidates) the riskiest assumptions in the business model. Eric Ries's definition: not a smaller, cheaper product — a fundamentally different artefact designed to learn, not to ship. The purpose of the MVP is not to satisfy customers fully; it is to discover whether the core value hypothesis is correct before investing in the full product.</p></div><div class=\"ms-section\"><h3>Mental Model</h3><p>The practitioner holds two products in mind simultaneously: the eventual product they want to build, and the MVP — the minimum that generates the learning needed to justify building the eventual product. The discipline is in identifying which assumptions are riskiest (the ones that, if wrong, most invalidate the business) and designing the minimum test for exactly those assumptions. Everything else is deferred.</p></div><div class=\"ms-section\"><h3>Practitioner Heuristics</h3><ul>\n<li><strong>MVP is defined by the riskiest assumption, not by engineering convenience.</strong> Ask: &quot;What is the single thing that, if we're wrong about it, makes this entire venture not worth pursuing?&quot; The MVP tests that thing.</li>\n<li><strong>The MVP is not the first version of the product.</strong> It may not be a product at all — it could be a video, a landing page, a manually executed service, a wizard-of-oz prototype. Use whatever cheapest possible version generates the learning.</li>\n<li><strong>Don't use MVP as an excuse for poor quality in the assumptions you're actually testing.</strong> The MVP can be low-fidelity in everything except the specific dimension being tested. A shoddy test of a real hypothesis is worse than a polished test of the wrong hypothesis.</li>\n<li><strong>Define the metric that the MVP must move.</strong> Not &quot;users seemed to like it&quot; but &quot;X% of users took Y action within Z days.&quot;</li>\n<li><strong>Sequence MVPs to de-risk assumptions in order of importance.</strong> The most dangerous assumption first, then progressively less dangerous assumptions, each MVP building on the validated foundation of the previous.</li>\n</ul></div><div class=\"ms-section\"><h3>Common Failure Modes</h3><ul>\n<li><strong>Minimum vanity product.</strong> A product that is technically &quot;minimal&quot; but tests irrelevant assumptions. The result looks like lean methodology and produces no useful learning.</li>\n<li><strong>No definition of &quot;viable.&quot;</strong> Without a clear threshold for what constitutes a success signal, the MVP produces ambiguous results that get interpreted in whatever direction the team prefers.</li>\n<li><strong>Feedback from non-target users.</strong> Testing with convenient users (friends, family, colleagues) rather than the actual target segment produces misleading signals.</li>\n</ul></div><div class=\"ms-section\"><h3>Worked Example</h3><p>Zappos founder Nick Swinmurn wanted to test whether people would buy shoes online. The riskiest assumption: the demand exists. Rather than building a warehouse, stocking inventory, and launching a platform, he took photos of shoes in local stores, posted them online, and when someone ordered, he bought the shoes from the store and shipped them himself. He had no inventory, no logistics infrastructure, no technology. He had an answer: yes, people buy shoes online. The MVP cost a weekend; the learning was worth a company.</p></div><div class=\"ms-section\"><h3>Connections</h3><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"63\"><strong>Build-Measure-Learn</strong></a> — the MVP is the &quot;build&quot; artefact in each BML cycle.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"73\"><strong>Assumption Mapping</strong></a> — assumption mapping identifies which assumptions the MVP should test.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"66\"><strong>Customer Development</strong></a> — customer development generates the hypotheses that the MVP tests.</p></div><div class=\"ms-section\"><h3>References</h3><p>The term 'minimum viable product' was coined by Frank Robinson and popularized as a central concept by Eric Ries in The Lean Startup. Steve Blank's customer development work provided the empirical foundation.</p><ul><li><em>The Lean Startup</em> — Eric Ries (2011)</li><li><em>The Four Steps to the Epiphany</em> — Steve Blank (2003)</li></ul></div>","file":"06-Startups/mvp.md","searchText":"mvp the minimum viable product generates maximum learning the minimum viable product is the version of a product with the minimum set of features required to generate the learning that validates (or invalidates) the riskiest assumptions in the business model. eric ries's definition: not a smaller, cheaper product — a fundamentally diffe"},{"id":65,"name":"Pivot or Persevere","tagline":"Structured decision when the current approach isn't working","category":"Startups","color":"#DC2626","preview":"The pivot-or-persevere decision is the structured assessment of whether to change strategy (pivot) or continue executing the current one (persevere) based on learning from experiments and the market. Eric Ries defined a pivot as \"a structured course correction designed to test a ","modal":"<div class=\"ms-section\"><h3>Definition</h3><p>The pivot-or-persevere decision is the structured assessment of whether to change strategy (pivot) or continue executing the current one (persevere) based on learning from experiments and the market. Eric Ries defined a pivot as &quot;a structured course correction designed to test a new fundamental hypothesis about the product, business model, or engine of growth.&quot; It is not giving up; it is the deliberate application of learning to direction.</p></div><div class=\"ms-section\"><h3>Mental Model</h3><p>The pivot-or-persevere decision is a Bayesian update: given what we have learned, has our confidence in the current direction increased or decreased? If the learning consistently validates the direction, persevere. If it consistently disconfirms, pivot. The discipline is having a clear threshold in advance and applying it honestly rather than interpreting ambiguous results in whichever direction preserves the existing strategy.</p></div><div class=\"ms-section\"><h3>Practitioner Heuristics</h3><ul>\n<li><strong>Set a review cadence and hold to it.</strong> Scheduled pivot-or-persevere reviews (monthly for early-stage, quarterly for later-stage) impose the discipline of regular reassessment that organic execution does not produce.</li>\n<li><strong>Separate the pivot decision from the performance evaluation.</strong> A pivot is not a failure assessment; it is a strategic update. Conflating the two creates defensiveness that distorts the analysis.</li>\n<li><strong>Identify what types of pivot are available.</strong> Common pivot types (Ries): zoom-in pivot (one feature becomes the product), zoom-out pivot (the product becomes a feature of a larger offering), customer segment pivot, customer need pivot, platform pivot, business model pivot, engine of growth pivot, channel pivot, technology pivot. Naming the type clarifies the decision.</li>\n<li><strong>Maintain what's working while pivoting.</strong> Few pivots require abandoning everything. The discipline is identifying what evidence supports continuation (preserve those elements) and what evidence requires change (pivot those elements).</li>\n<li><strong>Distinguish perseverance from inertia.</strong> Continuing without clear supporting evidence is inertia, not perseverance. Perseverance requires active evidence that the direction is correct.</li>\n</ul></div><div class=\"ms-section\"><h3>Common Failure Modes</h3><ul>\n<li><strong>Pivoting from emotional exhaustion rather than evidence.</strong> Changing direction because it's frustrating, not because the evidence points elsewhere. Evidence-based pivots improve outcomes; emotional pivots usually don't.</li>\n<li><strong>Persevering from sunk cost rather than evidence.</strong> &quot;We've come too far to change&quot; is sunk cost reasoning. The decision should be made from current evidence.</li>\n<li><strong>Pivoting so frequently that no learning accumulates.</strong> Each experiment needs enough time to generate valid data. Weekly pivots produce no learning.</li>\n</ul></div><div class=\"ms-section\"><h3>Worked Example</h3><p>Instagram began as Burbn — a check-in app with gaming elements. The data showed one feature was used by almost all users: photo sharing. Everything else was barely used. The pivot was not a failure; it was a data-informed decision to strip the product to its single point of strength. The pivot preserved the user base, the team, and the core technology. Everything not supported by the usage data was cut. The result: a product with exceptional retention and word-of-mouth because it did one thing excellently.</p></div><div class=\"ms-section\"><h3>Connections</h3><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"63\"><strong>Build-Measure-Learn</strong></a> — the pivot-or-persevere decision is the &quot;learn&quot; step of the BML loop operationalized.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"53\"><strong>Sunk Cost</strong></a> — the perseverance trap is often sunk cost; the pivot decision must be separated from sunk cost attachment.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"62\"><strong>Product-Market Fit</strong></a> — the goal of pivots is to find the product-market fit that perseverance is preserving.</p></div><div class=\"ms-section\"><h3>References</h3><p>Formalized by Eric Ries in The Lean Startup (2011) as a structured decision point in the Build-Measure-Learn loop.</p><ul><li><em>The Lean Startup</em> — Eric Ries (2011)</li><li><em>Disciplined Entrepreneurship</em> — Bill Aulet (2013)</li></ul></div>","file":"06-Startups/pivot-or-persevere.md","searchText":"pivot or persevere structured decision when the current approach isn't working the pivot-or-persevere decision is the structured assessment of whether to change strategy (pivot) or continue executing the current one (persevere) based on learning from experiments and the market. eric ries defined a pivot as \"a structured course correction designed to test a "},{"id":62,"name":"Product-Market Fit","tagline":"The product satisfies a strong market need","category":"Startups","color":"#DC2626","preview":"Product-market fit (PMF) is the degree to which a product satisfies the needs of a strong market. Marc Andreessen defined it as \"being in a good market with a product that can satisfy that market.\" The operational hallmark: the market is pulling the product from you — customers r","modal":"<div class=\"ms-section\"><h3>Definition</h3><p>Product-market fit (PMF) is the degree to which a product satisfies the needs of a strong market. Marc Andreessen defined it as &quot;being in a good market with a product that can satisfy that market.&quot; The operational hallmark: the market is pulling the product from you — customers return, tell others, and complain loudly when the product is unavailable. Before PMF, growth is manufactured. After PMF, it becomes sustainable.</p></div><div class=\"ms-section\"><h3>Mental Model</h3><p>PMF is a binary state in practice even though it exists on a spectrum conceptually. You either have the pull dynamic — organic retention, strong word of mouth, customers who find you rather than you finding them — or you don't. Sean Ellis's test: &quot;How would you feel if you could no longer use this product?&quot; If at least 40% answer &quot;very disappointed,&quot; you're approaching PMF. Below that threshold, no amount of growth investment produces durable results.</p></div><div class=\"ms-section\"><h3>Practitioner Heuristics</h3><ul>\n<li><strong>Measure retention before measuring growth.</strong> Cohort retention curves that flatten (users who stay, stay) are the most reliable PMF signal. Retention curves that continue falling indicate you do not have PMF regardless of top-of-funnel volume.</li>\n<li><strong>Listen for the pull.</strong> In a PMF state, customers start using the product in ways you didn't design, request features you were already planning, and refer others before you ask. The absence of this pull is diagnostic.</li>\n<li><strong>Don't scale before PMF.</strong> Scaling acquisition before PMF means paying to acquire customers who will churn. The economics are always negative until retention is proven.</li>\n<li><strong>PMF is segment-specific.</strong> You may have strong PMF with one customer segment and none with another. Identify the segment where retention is strong before expanding.</li>\n<li><strong>PMF can be lost.</strong> Market conditions, competitive dynamics, or product drift can erode PMF after it's been achieved. Monitor leading indicators continuously.</li>\n</ul></div><div class=\"ms-section\"><h3>Common Failure Modes</h3><ul>\n<li><strong>Vanity metrics as PMF signals.</strong> Downloads, sign-ups, and press coverage are not PMF. Active retention and word-of-mouth are.</li>\n<li><strong>Premature scaling.</strong> Hiring aggressively and raizing large rounds before retention is proven. The result: a large team burning cash to acquire customers who leave.</li>\n<li><strong>Narrowing too slowly.</strong> Companies that try to serve too broad a market find weak PMF signals everywhere and strong signals nowhere. Narrowing to a specific segment where PMF is strong, then expanding, is the typical path.</li>\n</ul></div><div class=\"ms-section\"><h3>Worked Example</h3><p>Slack's early users were internal at Stewart Butterfield's game company Glitch. When they shared it with other companies, those users responded with extraordinary engagement. The pull dynamic: users were frustrated when access was interrupted; they spread it to colleagues without prompting; usage expanded to the full organization without a sales effort. These signals preceded the decision to build Slack as a product. PMF was identified before a growth team was assembled.</p></div><div class=\"ms-section\"><h3>Connections</h3><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"63\"><strong>Build-Measure-Learn</strong></a> — the loop used to discover PMF efficiently.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"66\"><strong>Customer Development</strong></a> — the process of understanding whether the market pull exists before building.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"17\"><strong>Feedback Loops</strong></a> — PMF activates a reinforcing feedback loop between product quality, retention, and word-of-mouth.</p></div><div class=\"ms-section\"><h3>References</h3><p>The term was coined by Andy Rachleff and popularized in a landmark 2007 blog post by Marc Andreessen, 'The Only Thing That Matters.'</p><ul><li><em>The Lean Startup</em> — Eric Ries (2011)</li><li><em>Zero to One</em> — Peter Thiel & Blake Masters (2014)</li></ul></div>","file":"06-Startups/product-market-fit.md","searchText":"product-market fit the product satisfies a strong market need product-market fit (pmf) is the degree to which a product satisfies the needs of a strong market. marc andreessen defined it as \"being in a good market with a product that can satisfy that market.\" the operational hallmark: the market is pulling the product from you — customers r"},{"id":73,"name":"Assumption Mapping","tagline":"Surface and prioritize the beliefs a plan depends on","category":"Business","color":"#475569","preview":"Assumption mapping is the practice of explicitly listing all the beliefs on which a plan, strategy, or product depends — and then ranking them by importance (how much does success depend on this being true?) and evidence (how confident are we that this is true?). The result is a ","modal":"<div class=\"ms-section\"><h3>Definition</h3><p>Assumption mapping is the practice of explicitly listing all the beliefs on which a plan, strategy, or product depends — and then ranking them by importance (how much does success depend on this being true?) and evidence (how confident are we that this is true?). The result is a map of where the most dangerous assumptions lie: the high-importance, low-evidence beliefs. These are the assumptions that should be tested first.</p></div><div class=\"ms-section\"><h3>Mental Model</h3><p>Every plan is built on a stack of assumptions. Some are well-evidenced (near certainties); some are speculative guesses. Most plans fail not at the level of execution but at the level of a specific assumption being wrong. Assumption mapping makes the assumption stack visible, making it possible to prioritize de-risking effort on the assumptions that would most damage the plan if wrong.</p></div><div class=\"ms-section\"><h3>Practitioner Heuristics</h3><ul>\n<li><strong>Extract assumptions from every element of the business model canvas or strategic plan.</strong> Each box in the canvas is an assumption. Each strategic bet is an assumption stack.</li>\n<li><strong>Map on two axes: certainty (known ↔ unknown) and importance (critical ↔ nice-to-know).</strong> High-importance, low-certainty assumptions in the top-left quadrant are your priority tests.</li>\n<li><strong>Generate assumptions from multiple perspectives.</strong> Your team will have blind spots. Bring in customer voice, market data, and adversarial challenge to surface assumptions the team has normalized.</li>\n<li><strong>Assign an owner and a test to every critical assumption.</strong> &quot;We don't know this&quot; is not a resting state; it is a test-design prompt. Who will test this, how, and by when?</li>\n<li><strong>Update the map as evidence arrives.</strong> Assumption mapping is an ongoing exercise, not a one-time workshop. Each learning cycle should update the certainty scores of assumptions tested.</li>\n</ul></div><div class=\"ms-section\"><h3>Common Failure Modes</h3><ul>\n<li><strong>Identifying assumptions but not prioritizing them.</strong> A map with 50 assumptions of equal priority produces no action. The discipline is ranking ruthlessly.</li>\n<li><strong>Treating low-certainty as equivalent to &quot;we need to learn more internally.&quot;</strong> Most critical assumptions can only be tested through market interaction — customer interviews, MVPs, pilots. Internal analysis cannot test customer behavior assumptions.</li>\n</ul></div><div class=\"ms-section\"><h3>Worked Example</h3><p>A team is planning a new market entry. They list their assumptions and find 35. After mapping on importance vs. certainty, five assumptions emerge as critical and low-certainty: (1) the target customer experiences the problem intensely enough to pay for a solution; (2) the customer's current workaround can be disrupted by a software product; (3) the procurement cycle is short enough for the unit economics to work; (4) regulatory approval is achievable within 12 months; and (5) a comparable case study will be sufficient to win enterprise trust. These five assumptions define the next three months of customer development and legal exploration before any product is built.</p></div><div class=\"ms-section\"><h3>Connections</h3><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"68\"><strong>Business Model Canvas</strong></a> — the canvas is the source document from which assumptions are extracted.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"64\"><strong>MVP</strong></a> — the MVP is the cheapest device for testing the most critical assumptions.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"72\"><strong>Experiment Design</strong></a> — assumption mapping defines what to test; experiment design defines how to test it validly.</p></div><div class=\"ms-section\"><h3>References</h3><p>Developed by David Bland and Alexander Osterwalder as a structured pre-experiment tool, introduced in Testing Business Ideas (2019).</p><ul><li><em>Testing Business Ideas</em> — David J. Bland & Alexander Osterwalder (2019)</li><li><em>The Lean Startup</em> — Eric Ries (2011)</li></ul></div>","file":"07-Business/assumption-mapping.md","searchText":"assumption mapping surface and prioritize the beliefs a plan depends on assumption mapping is the practice of explicitly listing all the beliefs on which a plan, strategy, or product depends — and then ranking them by importance (how much does success depend on this being true?) and evidence (how confident are we that this is true?). the result is a "},{"id":68,"name":"Business Model Canvas","tagline":"Map the structure of value creation and capture","category":"Business","color":"#475569","preview":"The Business Model Canvas (Alexander Osterwalder) is a strategic template for developing or documenting a business model. It organizes nine building blocks onto a single page: Customer Segments, Value Propositions, Channels, Customer Relationships, Revenue Streams, Key Resources,","modal":"<div class=\"ms-section\"><h3>Definition</h3><p>The Business Model Canvas (Alexander Osterwalder) is a strategic template for developing or documenting a business model. It organizes nine building blocks onto a single page: Customer Segments, Value Propositions, Channels, Customer Relationships, Revenue Streams, Key Resources, Key Activities, Key Partnerships, and Cost Structure. The power of the canvas is forcing explicit choices about every element of the business and making the interdependencies between elements visible.</p></div><div class=\"ms-section\"><h3>Mental Model</h3><p>The canvas is a hypothesis map for the entire business, not just the product. The right side describes how value is delivered to customers (Segments, Value Proposition, Channels, Relationships, Revenue). The left side describes how value is created (Resources, Activities, Partnerships, Costs). A viable business model is one where the right side generates revenue that exceeds the left side's costs, and where the left side's capabilities are genuinely suited to deliver the right side's promises.</p></div><div class=\"ms-section\"><h3>Practitioner Heuristics</h3><ul>\n<li><strong>Fill it in as hypotheses, not facts.</strong> In early-stage work, every box is a hypothesis. Label each box with a confidence level. The low-confidence hypotheses are your highest-priority tests.</li>\n<li><strong>Test the interdependencies, not just the boxes.</strong> The key insight often emerges at the interface between boxes. Does the channel choice match the customer segment's buying behavior? Do the key resources enable the key activities? Does the revenue stream match the value proposition?</li>\n<li><strong>Use it for competitive analysis.</strong> Map a competitor's canvas alongside yours. Where are the differences? Those differences are the competing hypotheses about how the market works.</li>\n<li><strong>Iterate the canvas before iterating the product.</strong> Many product problems are actually business model problems. Adding features that don't change customer economics, channel efficiency, or unit economics doesn't improve the model.</li>\n<li><strong>The value proposition is the center.</strong> If the value proposition is wrong — if it doesn't solve a genuine, important problem for the target segment — no amount of optimization on the other boxes will produce a viable business.</li>\n</ul></div><div class=\"ms-section\"><h3>Common Failure Modes</h3><ul>\n<li><strong>Treating the canvas as a document rather than a tool.</strong> Filling it in once and filing it away is not the intended use. The canvas should be updated every time a significant assumption is tested.</li>\n<li><strong>Describing the current business rather than questioning it.</strong> The canvas should be provocative: why this customer segment and not another? Why this channel? These are not rhetorical questions.</li>\n</ul></div><div class=\"ms-section\"><h3>Worked Example</h3><p>A founder building a B2B SaaS product fills in the canvas. Under Revenue Streams, she writes &quot;subscription.&quot; Under Customer Relationships, she writes &quot;self-serve.&quot; The interdependency check: are her Customer Segments (enterprise companies with long procurement cycles) actually compatible with self-serve, low-touch relationships? The canvas exposes the mismatch: enterprise customers need high-touch relationships, not self-serve. This changes both the Revenue Streams box (higher ACV, longer contracts) and the Key Activities box (sales, customer success). One canvas review saved six months of building the wrong go-to-market.</p></div><div class=\"ms-section\"><h3>Connections</h3><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"69\"><strong>Value Prop Canvas</strong></a> — the detailed tool for the Value Proposition and Customer Segment boxes.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"73\"><strong>Assumption Mapping</strong></a> — the canvas produces a comprehensive list of assumptions to map.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"62\"><strong>Product-Market Fit</strong></a> — the canvas is a framework for asking whether a business model around which PMF could be achieved exists.</p></div><div class=\"ms-section\"><h3>References</h3><p>Developed by Alexander Osterwalder, based on his doctoral dissertation under Yves Pigneur. Introduced to a mass audience in Business Model Generation (2010).</p><ul><li><em>Business Model Generation</em> — Alexander Osterwalder & Yves Pigneur (2010)</li><li><em>Value Proposition Design</em> — Alexander Osterwalder et al. (2014)</li></ul></div>","file":"07-Business/business-model-canvas.md","searchText":"business model canvas map the structure of value creation and capture the business model canvas (alexander osterwalder) is a strategic template for developing or documenting a business model. it organizes nine building blocks onto a single page: customer segments, value propositions, channels, customer relationships, revenue streams, key resources,"},{"id":112,"name":"Disruptive Innovation","tagline":"How entrants using simpler, cheaper technology serve overlooked customers and then improve until they displace incumbents — and why rational incumbents consistently fail to respond in time.","category":"Business","color":"#475569","preview":"Disruptive innovation, as defined by Clayton Christensen, describes a specific mechanism by which entrants using initially inferior technology eventually displace established market leaders. It is not synonymous with \"breakthrough\" or \"radical\" innovation — many disruptive innova","modal":"<div class=\"ms-section\"><h3>Definition</h3><p>Disruptive innovation, as defined by Clayton Christensen, describes a specific mechanism by which entrants using initially inferior technology eventually displace established market leaders. It is not synonymous with &quot;breakthrough&quot; or &quot;radical&quot; innovation — many disruptive innovations begin as worse products by conventional metrics. There are two primary forms: low-end disruption, where entrants target over-served customers with a cheaper, simpler product that incumbents are happy to cede; and new-market disruption, where entrants create a new customer population by enabling people who previously couldn't consume (non-consumers) to do so. In both cases, the disruptor improves along a performance trajectory that eventually meets mainstream requirements, at which point it displaces the incumbent from below. The defining feature is the asymmetry: incumbent organizations consistently fail to respond because the rational management decisions that maximize current performance simultaneously make it impossible to invest appropriately in the disruptive trajectory.</p></div><div class=\"ms-section\"><h3>Mental Model</h3><p>An experienced practitioner understands the innovator's dilemma at its core: good management practices, applied to a disruption threat, produce the wrong response. Incumbents have large margins on their best customers; disruptors serve customers with thin margins or no margins. Rational resource allocation directs investment toward high-margin customers, away from the disruptive segment. Incumbent customers ask for more performance on established metrics; disruptors improve on different metrics (price, convenience, accessibility) that incumbent customers don't value — yet. By the time the disruptive trajectory intersects with mainstream requirements, the incumbent has lost years of development time in the disruptive technology and the entrant has the structural advantages of a simpler cost base. The pattern is not about bad management — most incumbents that are disrupted are well-managed by conventional standards. It is about organizational structures and incentives that make certain investments systematically impossible to make and sustain. The practitioner's use of this model is dual: as an attacker, to identify the foothold that incumbents are rationally abandoning; as an incumbent, to recognize early-stage disruption before the performance trajectories cross, and create genuinely separate organizational structures to respond.</p></div><div class=\"ms-section\"><h3>Practitioner Heuristics</h3><ul>\n<li><strong>Look for over-served customers to identify disruption footholds.</strong> Where are incumbents providing more performance than customers need? Where are customers paying for features they don't use? These are the entry points for low-end disruption.</li>\n<li><strong>Look for non-consumers to identify new-market disruption.</strong> Who cannot currently participate in a market due to cost, complexity, or access? Enabling them — even with inferior solutions — is the classic new-market disruption entry.</li>\n<li><strong>Assess disruption threats by performance trajectory, not current performance.</strong> A disruptive technology is consistently dismissed because it is currently inferior. The question is whether its improvement trajectory will eventually intersect mainstream requirements. If yes, the timing question is: when?</li>\n<li><strong>As an incumbent, create structurally separate units for disruptive responses.</strong> Embedding disruptive business models inside existing organizations produces the wrong incentives, the wrong metrics, and the wrong priorities. Separation is the structural prerequisite for genuine response.</li>\n<li><strong>As an attacker, stay below the incumbent's response threshold as long as possible.</strong> Disruption works by staying in markets the incumbent rationally ignores. Moving upstream too fast triggers a response before the disruptive foothold is secure.</li>\n</ul></div><div class=\"ms-section\"><h3>Common Failure Modes</h3><ul>\n<li><strong>Conflating disruptive with better or more innovative.</strong> Disruptive innovations are initially inferior by conventional metrics — they disrupt because of a business model or cost structure advantage, not because they are technically superior at launch.</li>\n<li><strong>Treating all new technology as potentially disruptive.</strong> Sustaining innovations (improvements that incumbents can and do adopt) are not disruptions. Most innovation is sustaining. The distinction matters because the strategic response is opposite.</li>\n<li><strong>Incumbent over-response.</strong> Treating every low-cost entrant as existential and acquiring or competing directly with it, destroying the very business model innovation that made it disruptive. The correct incumbent response is often to create a separate unit, not to integrate or destroy.</li>\n<li><strong>Attacker moving upstream too quickly.</strong> Disruptive entrants that pursue high-end mainstream customers before securing their foothold enter the incumbent's home territory — the incumbent's capabilities, customer relationships, and margins are all superior there.</li>\n<li><strong>Post-hoc labeling.</strong> Calling any successful new entrant &quot;disruptive&quot; retrospectively, removing the model's predictive value. The definition requires the specific mechanism: initially inferior product, overlooked customer, improving performance trajectory.</li>\n</ul></div><div class=\"ms-section\"><h3>Worked Example</h3><p>Netflix's disruption of Blockbuster followed the textbook mechanism. Netflix launched with a mail-order DVD service — inferior to Blockbuster on the most-valued dimension (no instant access). It targeted a specific over-served segment: frequent renters who hated late fees and found the Blockbuster store experience frustrating. Blockbuster rationally ignored Netflix: the mail-order segment was small, margin-thin, and served a customer profile that wasn't Blockbuster's most profitable. As Netflix's subscription model improved — more titles, faster delivery, better recommendation — it gradually attracted mainstream customers. By the time Blockbuster recognized the threat, Netflix had a superior cost structure (no stores), a loyal customer base, and a streaming transition already underway. Blockbuster's eventual attempts to respond were hamstrung by its store infrastructure — the assets that had made it dominant were liabilities in the new model. The disruption was not caused by Netflix being technologically superior (initially it wasn't) but by a business model that incumbents couldn't adopt without destroying their existing margins.</p></div><div class=\"ms-section\"><h3>Connections</h3><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"108\"><strong>Exploration vs. Exploitation</strong></a> — disruptive innovation exploits the exploitation trap: incumbents rationally over-exploit current capabilities while the disruption develops in territory they are rationally ignoring.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"102\"><strong>S-Curves</strong></a> — disruptive innovations ride a new S-curve that eventually intersects the incumbent's S-curve; recognizing the crossing point before it occurs is the incumbent's primary analytical challenge.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"103\"><strong>Jobs to Be Done</strong></a> — disruptions often succeed because they do the job better for a specific customer segment that the incumbent has stopped serving well; JTBD analysis reveals these overlooked segments.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"68\"><strong>Business Model Canvas</strong></a> — disruption is almost always a business model innovation as much as a product innovation; the disruptor's canvas is structurally different from the incumbent's, making direct competition difficult.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"111\"><strong>Crossing the Chasm</strong></a> — disruptive innovations often cross from non-consumer or low-end footholds to mainstream markets by a path that differs from the standard early-adopter-to-mainstream chasm crossing.</p></div><div class=\"ms-section\"><h3>References</h3><p>The theory of disruptive innovation was developed by Clayton M. Christensen, introduced in a 1995 paper with Joseph Bower in the Harvard Business Review and fully elaborated in The Innovator's Dilemma.</p><ul><li><em>The Innovator's Dilemma</em> — Clayton M. Christensen (1997)</li><li><em>The Innovator's Solution</em> — Clayton M. Christensen & Michael E. Raynor (2003)</li></ul></div>","file":"07-Business/disruptive-innovation.md","searchText":"disruptive innovation how entrants using simpler, cheaper technology serve overlooked customers and then improve until they displace incumbents — and why rational incumbents consistently fail to respond in time. disruptive innovation, as defined by clayton christensen, describes a specific mechanism by which entrants using initially inferior technology eventually displace established market leaders. it is not synonymous with \"breakthrough\" or \"radical\" innovation — many disruptive innova"},{"id":72,"name":"Experiment Design","tagline":"Structure tests to generate valid learning","category":"Business","color":"#475569","preview":"Experiment design is the disciplined process of constructing tests that generate valid, actionable evidence. A well-designed experiment isolates the variable of interest, defines success criteria in advance, uses an appropriate sample size, controls for confounders, and generates","modal":"<div class=\"ms-section\"><h3>Definition</h3><p>Experiment design is the disciplined process of constructing tests that generate valid, actionable evidence. A well-designed experiment isolates the variable of interest, defines success criteria in advance, uses an appropriate sample size, controls for confounders, and generates evidence that distinguishes between the hypothesis being true and the hypothesis being false. The principles come from scientific methodology and apply wherever a decision must be made under uncertainty.</p></div><div class=\"ms-section\"><h3>Mental Model</h3><p>Every experiment tests a specific hypothesis. The quality of the experiment determines the quality of the evidence generated. Poorly designed experiments (leading questions, small samples, no control group, post-hoc definition of success) produce the appearance of evidence without the substance — they confirm whatever the experimenter wanted to find. The practitioner's commitment: if the experiment doesn't have the potential to produce an answer that would change the decision, it isn't worth running.</p></div><div class=\"ms-section\"><h3>Practitioner Heuristics</h3><ul>\n<li><strong>State the hypothesis in falsifiable form.</strong> &quot;We believe X&quot; should be statable as &quot;if X is true, we will observe Y under conditions Z.&quot; If you can't state it in this form, you can't test it.</li>\n<li><strong>Define success criteria before running the experiment.</strong> What result would you interpret as confirming? What would you interpret as disconfirming? Decide before the data comes in.</li>\n<li><strong>Calculate statistical power before choosing sample size.</strong> The sample size should be sufficient to detect the minimum effect that would be meaningful. An underpowered experiment that shows no effect has not shown that there is no effect — it has shown that the sample was too small to detect it.</li>\n<li><strong>Use a control group wherever possible.</strong> Without a control condition, it is impossible to determine whether an observed change was caused by the intervention or by simultaneous external factors.</li>\n<li><strong>Plan for multiple testing correction.</strong> Running many experiments simultaneously increases the probability of false positives. Use Bonferroni correction or Bayesian methods if running multiple simultaneous tests.</li>\n</ul></div><div class=\"ms-section\"><h3>Common Failure Modes</h3><ul>\n<li><strong>Stopping early when results look good.</strong> Stopping a test the moment results are favorable inflates false positive rates. Run to the predetermined sample size.</li>\n<li><strong>Changing the hypothesis post-hoc.</strong> Redefining what &quot;success&quot; means after seeing the data is the most common way to manufacture false validation.</li>\n<li><strong>HIPPO-driven experiment interpretation.</strong> The Highest-Paid Person's Opinion determining the experiment's conclusion regardless of the data. Experiment design protects against this only if results are published before interpretation is socialized.</li>\n</ul></div><div class=\"ms-section\"><h3>Worked Example</h3><p>An e-commerce team is testing whether a new checkout flow improves conversion. They define the hypothesis (&quot;the new flow increases checkout conversion by at least 5%&quot;), calculate that they need 2,000 users per variant to detect a 5% difference with 80% power, run the test for the required duration with no peeking at results, and analyse only when the sample size is reached. The result: a 4.8% improvement (below threshold). They persevere with the test and, after reaching 4,000 users per variant, see a 6.2% improvement. Pre-defined criteria prevented a premature decision in either direction.</p></div><div class=\"ms-section\"><h3>Connections</h3><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"63\"><strong>Build-Measure-Learn</strong></a> — experiment design disciplines the &quot;measure&quot; step of the BML cycle.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"7\"><strong>Probabilistic Thinking</strong></a> — statistical significance and power are applications of probabilistic thinking to experiment design.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"55\"><strong>Confirmation Bias</strong></a> — rigorous experiment design is the structural antidote to confirmation bias in analysis.</p></div><div class=\"ms-section\"><h3>References</h3><p>The formal theory of designed experiments was established by Ronald A. Fisher in The Design of Experiments (1935). Applied to online products by Ron Kohavi and colleagues at Microsoft.</p><ul><li><em>The Design of Experiments</em> — Ronald A. Fisher (1935)</li><li><em>Trustworthy Online Controlled Experiments</em> — Ron Kohavi, Diane Tang & Ya Xu (2020)</li></ul></div>","file":"07-Business/experiment-design.md","searchText":"experiment design structure tests to generate valid learning experiment design is the disciplined process of constructing tests that generate valid, actionable evidence. a well-designed experiment isolates the variable of interest, defines success criteria in advance, uses an appropriate sample size, controls for confounders, and generates"},{"id":70,"name":"Innovation Funnel","tagline":"Stage-gate the progression from idea to impact","category":"Business","color":"#475569","preview":"The innovation funnel is a staged process for managing ideas from initial generation through progressive filtering, testing, and scaling. Ideas enter at the wide top; through successive stages of testing and validation, the successful ones progress toward deployment; the funnel n","modal":"<div class=\"ms-section\"><h3>Definition</h3><p>The innovation funnel is a staged process for managing ideas from initial generation through progressive filtering, testing, and scaling. Ideas enter at the wide top; through successive stages of testing and validation, the successful ones progress toward deployment; the funnel narrows as ideas are filtered on evidence of viability, feasibility, and strategic fit. The funnel manages the balance between generating enough raw ideas (divergence) and rigorously selecting the best ones (convergence).</p></div><div class=\"ms-section\"><h3>Mental Model</h3><p>The funnel is a portfolio of bets at different stages of validation. Early stages carry many small, cheap bets (low evidence, low investment). Later stages carry fewer, larger bets (higher evidence, higher investment). The practitioner's discipline is sizing each bet appropriately to its validation stage and not allowing attachment to specific ideas to override the evidence-based filtering process.</p></div><div class=\"ms-section\"><h3>Practitioner Heuristics</h3><ul>\n<li><strong>Define the stage-gate criteria explicitly before the funnel is loaded.</strong> What evidence is required to progress from stage 2 to stage 3? If this isn't defined in advance, the criteria will be applied inconsistently and political considerations will dominate.</li>\n<li><strong>Separate idea generation from idea evaluation.</strong> Simultaneous generation and evaluation suppresses idea generation (critical evaluation kills nascent ideas). Run divergence phases before convergence phases.</li>\n<li><strong>Maintain a portfolio across stages.</strong> An organization with only late-stage bets (developed products close to deployment) has no pipeline. An organization with only early-stage bets (ideas) has no results. The funnel should have active ideas at every stage.</li>\n<li><strong>Kill early, cheaply.</strong> The purpose of early-stage validation is to identify non-starters before significant investment. The metric for early stages: speed to kill, not quality of the killed idea. The faster you eliminate non-viable ideas, the more resources remain for viable ones.</li>\n<li><strong>Connect the funnel to strategic intent.</strong> Innovation funnels that are disconnected from strategy produce interesting ideas that don't serve the organization's direction. The filter at each stage should include strategic fit.</li>\n</ul></div><div class=\"ms-section\"><h3>Common Failure Modes</h3><ul>\n<li><strong>Zombie ideas.</strong> Ideas that aren't progressed and aren't killed — they persist in the funnel consuming mindshare and conversation without generating learning. Stage-gate discipline with real kill criteria prevents zombies.</li>\n<li><strong>Funnel without a sponsor.</strong> Ideas that progress through the funnel without an internal champion who will advocate for resources will stall in late stages. Every idea in the funnel should have an owner.</li>\n</ul></div><div class=\"ms-section\"><h3>Worked Example</h3><p>A FMCG company runs an annual innovation sprint: 200 ideas entered, 50 developed to concept, 20 consumer tested, 5 piloted, 2 launched at scale. The funnel shape is maintained year-over-year. The stage-gate criteria are published and consistently applied. The failure mode they fixed: previously, pet ideas of senior leaders bypassed the funnel and entered late stages without early-stage validation. Two high-profile failures led to a rule: no idea can skip a funnel stage regardless of sponsor seniority.</p></div><div class=\"ms-section\"><h3>Connections</h3><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"63\"><strong>Build-Measure-Learn</strong></a> — each stage of the funnel is a BML cycle.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"73\"><strong>Assumption Mapping</strong></a> — each stage tests specific assumptions before advancing.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"71\"><strong>Portfolio Map</strong></a> — the portfolio map shows the aggregate distribution of bets across stages.</p></div><div class=\"ms-section\"><h3>References</h3><p>The stage-gate process — the formal predecessor — was developed by Robert G. Cooper in the 1980s. The funnel metaphor was widely adopted in corporate innovation programs.</p><ul><li><em>Winning at New Products</em> — Robert G. Cooper (1986)</li><li><em>The Innovator's Dilemma</em> — Clayton M. Christensen (1997)</li></ul></div>","file":"07-Business/innovation-funnel.md","searchText":"innovation funnel stage-gate the progression from idea to impact the innovation funnel is a staged process for managing ideas from initial generation through progressive filtering, testing, and scaling. ideas enter at the wide top; through successive stages of testing and validation, the successful ones progress toward deployment; the funnel n"},{"id":116,"name":"Maker's Schedule vs. Manager's Schedule","tagline":"A single meeting in a maker's afternoon doesn't cost one hour — it costs the whole block; managers and makers need fundamentally different calendars","category":"Business","color":"#475569","preview":"Managers and makers operate in fundamentally incompatible time structures. Managers use a calendar divided into one-hour slots — switching between meetings, decisions, and status updates every hour is normal and creates no meaningful productivity loss for them. Makers — engineers","modal":"<div class=\"ms-section\"><h3>Definition</h3><p>Managers and makers operate in fundamentally incompatible time structures. Managers use a calendar divided into one-hour slots — switching between meetings, decisions, and status updates every hour is normal and creates no meaningful productivity loss for them. Makers — engineers, writers, designers, analysts — require large uninterrupted blocks to reach and sustain the state of focused concentration that produces their best work.</p>\n<br>\n<p>A single one-hour meeting placed in the middle of an afternoon does not cost a maker one hour — it costs the entire afternoon, because the anticipation of the meeting prevents entry into the deep focus required for complex work. Paul Graham articulated this asymmetry in 2009. Gloria Mark's research quantified the re-focus cost at an average of 23 minutes per disruption.</p></div><div class=\"ms-section\"><h3>Mental Model</h3><p>Time is not homogeneous for knowledge workers. Its value depends entirely on whether it forms a contiguous block long enough for meaningful cognitive work. An 8-hour day with 3 scattered 1-hour meetings contains approximately zero usable deep work blocks. The same 8 hours with all meetings consolidated in the morning leaves a 4–5 hour afternoon: the only structure in which deep work is actually possible.</p>\n<br>\n<p>Same total hours. Same meeting load. Profoundly different capacity. This is the asymmetry managers applying their own scheduling intuitions to makers miss — because for managers, meeting distribution within the day genuinely does not matter much.</p></div><div class=\"ms-section\"><h3>Practitioner Heuristics</h3><ul>\n<li><strong>Design calendars around the maker's schedule by default.</strong> Managers can adapt to any time structure; makers cannot.</li>\n<li><strong>Consolidate all recurring meetings into defined blocks</strong> — mornings, specific days, or office hours — and protect the remaining time as a no-interruption zone.</li>\n<li><strong>Treat any meeting inside a maker's prime work block as a full-block tax</strong>, not a one-hour cost.</li>\n<li><strong>When estimating team capacity, subtract the fragmentation tax</strong>: every scattered meeting reduces usable deep work by more than its nominal duration.</li>\n<li><strong>Know which people on your team are in maker mode</strong> and apply explicitly different scheduling norms to them.</li>\n</ul></div><div class=\"ms-section\"><h3>Common Failure Modes</h3><ul>\n<li><strong>Assuming makers switch between focus and meetings as fluidly as managers do.</strong> For managers, this is true. For makers, it is not.</li>\n<li><strong>Scheduling brief &quot;15-minute syncs&quot; without recognizing their placement cost.</strong> Duration is almost irrelevant; placement inside a prime work block is the primary damage.</li>\n<li><strong>Measuring team health by meeting attendance and responsiveness</strong> rather than by output quality and deep work time protected.</li>\n<li><strong>Applying uniform calendar norms across a team that contains both makers and managers.</strong></li>\n</ul></div><div class=\"ms-section\"><h3>Worked Example</h3><p>A senior engineer is allocated full-time to a critical project. Their calendar shows 4 hours of meetings distributed across each day. Nominal availability: 50%. Actual usable deep work: approximately 1–1.5 hours per day, because no contiguous block longer than 75 minutes exists before 4pm. Consolidating all recurring meetings to Tuesday and Thursday mornings frees Monday, Wednesday, and Friday as protected deep work days — same meeting count, roughly 3× the usable cognitive output.</p></div><div class=\"ms-section\"><h3>Connections</h3><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"114\"><strong>Deep Work / Cognitive Capacity</strong></a> — the scheduling structure that preserves or destroys deep work time</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"18\"><strong>Bottlenecks</strong></a> — fragmented schedules make attention the binding bottleneck</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"45\"><strong>Activation Energy</strong></a> — every interruption resets the cost of re-entering deep focus</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"44\"><strong>Friction</strong></a> — scattered meetings are a structural source of compounding cognitive friction</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"51\"><strong>Incentives</strong></a> — organizations reward responsiveness; protecting maker time requires counteracting this</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"17\"><strong>Feedback Loops</strong></a> — fragmentation → lower output → more status meetings → more fragmentation</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"28\"><strong>Conway's Law</strong></a> — org communication structures determine scheduling norms as a structural output</p></div><div class=\"ms-section\"><h3>References</h3><p>Paul Graham articulated the maker/manager schedule distinction in a 2009 essay. Gloria Mark's cognitive science research quantified the interruption re-focus cost. Cal Newport provides the complementary deep work framework.</p><ul><li><em>Maker's Schedule, Manager's Schedule</em> — Paul Graham (paulgraham.com, July 2009)</li><li><em>The Cost of Interrupted Work: More Speed and Stress — CHI Proceedings</em> — Gloria Mark, Daniela Gudith & Ulrich Klocke (2008)</li><li><em>Deep Work: Rules for Focused Success in a Distracted World</em> — Cal Newport (2016)</li></ul></div>","file":"07-Business/makers-schedule.md","searchText":"maker's schedule vs. manager's schedule a single meeting in a maker's afternoon doesn't cost one hour — it costs the whole block; managers and makers need fundamentally different calendars managers and makers operate in fundamentally incompatible time structures. managers use a calendar divided into one-hour slots — switching between meetings, decisions, and status updates every hour is normal and creates no meaningful productivity loss for them. makers — engineers"},{"id":71,"name":"Portfolio Map","tagline":"Manage a balanced set of bets across horizons","category":"Business","color":"#475569","preview":"A portfolio map (McKinsey's Three Horizons framework is the most common version) organizes an organization's initiatives across time horizons and risk profiles. Horizon 1: optimize and extend the core business (near-term, high confidence). Horizon 2: build emerging businesses tha","modal":"<div class=\"ms-section\"><h3>Definition</h3><p>A portfolio map (McKinsey's Three Horizons framework is the most common version) organizes an organization's initiatives across time horizons and risk profiles. Horizon 1: optimize and extend the core business (near-term, high confidence). Horizon 2: build emerging businesses that will become the new core (medium-term, moderate uncertainty). Horizon 3: explore and create viable options for future growth (long-term, high uncertainty). The portfolio should have active investment at all three horizons; over-concentration in any single horizon is a strategic risk.</p></div><div class=\"ms-section\"><h3>Mental Model</h3><p>The portfolio map is a visual representation of strategic optionality. H1 generates today's cash flows. H2 generates medium-term growth. H3 generates future optionality — low probability but potentially high-magnitude outcomes. The distribution of investment across horizons reflects risk tolerance, competitive position, and strategic intent. The portfolio is healthy when H1 is strong enough to fund H2 and H3 exploration.</p></div><div class=\"ms-section\"><h3>Practitioner Heuristics</h3><ul>\n<li><strong>Don't let H1 starve H2 and H3.</strong> Organizations under pressure from H1 performance systematically cut H2 and H3 investment. This is rational in the very short term and dangerous over any medium-term horizon.</li>\n<li><strong>Don't let H3 distract from H1.</strong> Exciting H3 initiatives can absorb disproportionate senior attention relative to their investment and near-term impact. Protect H1 execution.</li>\n<li><strong>Expect most H3 bets to fail.</strong> A portfolio with five H3 bets succeeding 100% is insufficiently exploratory. A portfolio with three successes from 20 bets is a healthy exploration rate.</li>\n<li><strong>Stage transitions are where most value is lost.</strong> Ideas that are strong in H3 exploration often fail in the transition to H2 (scaling from proof of concept to emerging business requires different capabilities and investment levels). Plan the transition explicitly.</li>\n<li><strong>The horizon timeline is industry-relative, not absolute.</strong> In fast-moving technology markets, H1 may be 6-12 months; H3 may be 2-3 years. In stable industries, H1 is 3-5 years; H3 is 10+ years. Calibrate to your competitive environment.</li>\n</ul></div><div class=\"ms-section\"><h3>Common Failure Modes</h3><ul>\n<li><strong>Tunnel vision on H1.</strong> Pure exploitation of the current model with no exploration investment is a delayed death sentence.</li>\n<li><strong>H3 theater.</strong> Running exploration programs that are too small to produce real options — too small to hire the talent, build the capability, or reach sufficient scale to generate valid learning.</li>\n</ul></div><div class=\"ms-section\"><h3>Worked Example</h3><p>Google's resource allocation explicitly accounts for the 70-20-10 rule: 70% of resources to H1 (search, advertizing), 20% to H2 (Gmail, Maps), 10% to H3 (moonshots, experimental projects). This is not an accident — it is a deliberate portfolio strategy. The 10% generates the optionality that becomes the 20% of the next cycle. YouTube, Android, and Google Cloud each began as sub-20% investments that became H1 businesses.</p></div><div class=\"ms-section\"><h3>Connections</h3><p class=\"connection\">→ <a cl
