he post-mortem with genuine curiosity rather than defensiveness, and maintain relentless focus on systemic causes rather than individual blame.</p></div><div class=\"ms-section\"><h3>Practitioner Heuristics</h3><ul>\n<li><strong>Separate the post-mortem from performance evaluation.</strong> If people fear that admitting failure in a post-mortem will be used against them in performance reviews, they will not be honest. Explicitly decouple the two.</li>\n<li><strong>Use the &quot;five whys&quot; to reach systemic causes.</strong> The first answer to &quot;why did this happen?&quot; is almost always a proximate cause (the engineer made an error; the customer didn't receive the message). Five levels of &quot;why&quot; typically reveal the systemic failure (the deployment process had no rollback check; the customer communication process had no confirmation mechanism).</li>\n<li><strong>Write it down and make it searchable.</strong> An unwritten post-mortem benefits only the people in the room. A written post-mortem, searchable by future team members, compounds over time.</li>\n<li><strong>Track whether actions were completed.</strong> Post-mortems that generate action items that are never completed are theater. Assign owners, due dates, and a review in the next post-mortem.</li>\n<li><strong>Review a collection of post-mortems periodically for patterns.</strong> Individual post-mortems surface specific causes; reviewing a set of post-mortems surfaces the systemic themes that show up repeatedly. These themes are the most valuable organizational learning.</li>\n</ul></div><div class=\"ms-section\"><h3>Common Failure Modes</h3><ul>\n<li><strong>Blame culture contamination.</strong> When post-mortems are used to identify who was at fault, people reconstruct events to protect themselves. The post-mortem produces a politically adjusted account, not a true one.</li>\n<li><strong>Treating corrective actions as the endpoint.</strong> The actions assigned at the end of a post-mortem are only valuable when completed. Without a follow-up mechanism, post-mortem outputs evaporate.</li>\n<li><strong>Availability bias in post-mortem frequency.</strong> Teams run post-mortems after dramatic failures and rarely after quiet successes. Successful projects also contain learnable information; the &quot;what worked&quot; side of the analysis is systematically underinvested.</li>\n</ul></div><div class=\"ms-section\"><h3>Worked Example</h3><p>Amazon's culture of written post-mortems after production incidents includes a specific format: timeline of events, contributing factors (not root cause — Amazon explicitly avoids singular root cause attribution), impact summary, what went well, what went poorly, and action items with owners and dates. The &quot;what went well&quot; section is as important as the &quot;what went poorly&quot; — it identifies the safety barriers that prevented a worse outcome, so they can be strengthened rather than accidentally dismantled. This format has been widely copied in engineering culture precisely because it produces learning rather than blame.</p></div><div class=\"ms-section\"><h3>Connections</h3><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"10\"><strong>Pre-mortem</strong></a> — the bookends: the pre-mortem imagines future failure; the post-mortem analyses actual failure. A mature team practices both.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"17\"><strong>Feedback Loops</strong></a> — the post-mortem closes the feedback loop: action → outcome → learning → updated action.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"88\"><strong>Five-Hour Rule</strong></a> — post-mortems are one of the most efficient uses of deliberate learning time because they are grounded in direct organizational experience.</p></div><div class=\"ms-section\"><h3>References</h3><p>Borrowed from medical autopsy practice; systematized in engineering and software through disciplines such as blameless post-mortems (originated at Google SRE). Popularized in business by Ben Horowitz.</p><ul><li><em>The Hard Thing About Hard Things</em> — Ben Horowitz (2014)</li><li><em>Site Reliability Engineering</em> — Betsy Beyer, Chris Jones, Jennifer Petoff & Niall Richard Murphy (2016)</li></ul></div>","file":"01-General-Thinking/post-mortem.md","searchText":"post-mortem learn structurally from what happened a post-mortem (also called an after-action review, retrospective, or incident review) is a structured examination of a completed project, incident, or period of work to extract learnable lessons. the goal is not to assign blame but to identify systemic causes — the conditions, de"},{"id":10,"name":"Pre-mortem","tagline":"Imagine failure before it happens","category":"General Thinking","color":"#3B82F6","preview":"A pre-mortem is a structured prospective exercise in which a team, before committing to a plan, imagines that it is some specified future time (3 months, 12 months) and the plan has failed — completely and catastrophically. Working backward from that imagined failure, each partic","modal":"<div class=\"ms-section\"><h3>Definition</h3><p>A pre-mortem is a structured prospective exercise in which a team, before committing to a plan, imagines that it is some specified future time (3 months, 12 months) and the plan has failed — completely and catastrophically. Working backward from that imagined failure, each participant independently writes down what they believe caused it. The results are then pooled, discussed, and converted into risk mitigations or plan adjustments. The pre-mortem was developed and named by psychologist Gary Klein as a counterweight to planning optimism bias.</p></div><div class=\"ms-section\"><h3>Mental Model</h3><p>The standard planning process activates the wrong psychology: everyone is committed to the plan, invested in its success, and under social pressure to be a team player. This systematically suppresses dissent and risk identification. The pre-mortem resolves this by making failure the baseline assumption. You are no longer identifying &quot;reasons this might fail&quot; (which feels like disloyalty); you are explaining &quot;why this already failed&quot; (which is simply analysis). The frame shift unlocks the critical thinking the planning process suppressed.</p></div><div class=\"ms-section\"><h3>Practitioner Heuristics</h3><ul>\n<li><strong>Do it on paper, individually, before discussing as a group.</strong> Group discussion of failure causes is dominated by anchoring on the first thing said. Independent written answers before any sharing produce richer, more diverse failure hypotheses.</li>\n<li><strong>Set the time horizon to be uncomfortable but plausible.</strong> &quot;It is 12 months from now and this project has failed completely&quot; is more productive than a vague or very distant future.</li>\n<li><strong>Distinguish failure causes by type.</strong> External (market, competition, regulatory), execution (team, process, resource), strategic (wrong direction, wrong customer), and catastrophic (black swan) failures have different mitigations. Categorize after surfacing.</li>\n<li><strong>Convert every identified failure mode into a specific mitigation or monitoring metric.</strong> The pre-mortem is useless if it generates a list that no one acts on. Each failure cause should produce either a plan change or an early warning indicator to track.</li>\n<li><strong>Repeat at major phase gates.</strong> A pre-mortem done once at project start ages quickly. Repeat at each major milestone, resetting the imagination to the new known risks.</li>\n</ul></div><div class=\"ms-section\"><h3>Common Failure Modes</h3><ul>\n<li><strong>Stopping at identification.</strong> The most common failure: generating a rich failure list, feeling that &quot;we've done the pre-mortem,&quot; and not converting it to mitigations.</li>\n<li><strong>Leader reveals their view first.</strong> If the most senior person in the room shares their pre-mortem hypothesis first, anchoring suppresses everyone else's. The senior person should go last.</li>\n<li><strong>Using it as a ritual rather than a tool.</strong> A pre-mortem that produces the same three obvious risks every time is a process-compliance exercise, not genuine risk identification.</li>\n</ul></div><div class=\"ms-section\"><h3>Worked Example</h3><p>A company is about to launch a new pricing model. Pre-mortem: &quot;It is Q4 and the pricing change has failed — we've lost 20% of our customer base and the board is discussing reverting.&quot; Individual written failure reasons: (a) existing customers felt blindsided and churned before renewing; (b) the sales team couldn't explain the new model clearly to prospects; (c) a competitor responded with an aggressive price cut; (d) the price increase hit a segment that was more price-sensitive than modelled; (e) implementation bugs in billing created customer service crises. Mitigations: a customer communication plan, a sales training sprint, a competitor monitoring cadence, segment-level price sensitivity analysis before go-live, and a billing QA checklist. Several of these mitigations were not in the original launch plan.</p></div><div class=\"ms-section\"><h3>Connections</h3><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"1\"><strong>Inversion</strong></a> — the pre-mortem is inversion operationalized as a group process.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"73\"><strong>Assumption Mapping</strong></a> — failure causes in a pre-mortem often correspond to critical assumptions that weren't tested.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"24\"><strong>Margin of Safety</strong></a> — pre-mortems identify the specific risks that margin of safety should buffer against.</p></div><div class=\"ms-section\"><h3>References</h3><p>Developed by psychologist Gary Klein and introduced in a 1989 paper. Popularized in business and decision-making by Daniel Kahneman.</p><ul><li><em>Sources of Power: How People Make Decisions</em> — Gary Klein (1998)</li><li><em>Thinking, Fast and Slow</em> — Daniel Kahneman (2011)</li></ul></div>","file":"01-General-Thinking/pre-mortem.md","searchText":"pre-mortem imagine failure before it happens a pre-mortem is a structured prospective exercise in which a team, before committing to a plan, imagines that it is some specified future time (3 months, 12 months) and the plan has failed — completely and catastrophically. working backward from that imagined failure, each partic"},{"id":7,"name":"Probabilistic Thinking","tagline":"Think in distributions, not outcomes","category":"General Thinking","color":"#3B82F6","preview":"Probabilistic thinking is the practice of representing beliefs as probability distributions rather than binary true/false or confident predictions. Rather than \"I think X will happen,\" the practitioner says \"I think X will happen with 70% probability, and here are the main altern","modal":"<div class=\"ms-section\"><h3>Definition</h3><p>Probabilistic thinking is the practice of representing beliefs as probability distributions rather than binary true/false or confident predictions. Rather than &quot;I think X will happen,&quot; the practitioner says &quot;I think X will happen with 70% probability, and here are the main alternative scenarios and their likelihoods.&quot; This discipline is borrowed from statistical reasoning and decision theory and applied to everyday judgment.</p>\n<br>\n<p>The goal is not to be right on any given call — you will be wrong 30% of the time on your 70% calls by definition. The goal is to be calibrated: your 70% calls should come true roughly 70% of the time, your 90% calls roughly 90% of the time. Calibration, not accuracy on individual bets, is the mark of the probabilistic thinker.</p></div><div class=\"ms-section\"><h3>Mental Model</h3><p>Imagine a physical bet: you stake money on an outcome, and your stake is proportional to your stated confidence. If you say something is 95% likely and it's wrong, you lose much more than if you said 60% and it was wrong. This framing forces honesty. The practitioner runs a continuous internal audit: <em>&quot;Am I actually willing to stake according to my stated confidence levels?&quot;</em> If not, the confidence is wrong.</p></div><div class=\"ms-section\"><h3>Practitioner Heuristics</h3><ul>\n<li><strong>State confidence intervals, not point estimates.</strong> Not &quot;revenue will be £2M&quot; but &quot;revenue will be between £1.5M and £2.8M, with most of my probability mass between £1.8M and £2.3M.&quot;</li>\n<li><strong>Separate the decision from the outcome.</strong> A good decision made under genuine uncertainty can produce a bad outcome; a bad decision can get lucky. Judge the quality of reasoning, not just the result. This requires recording decisions and rationale at time of making, not retrospectively.</li>\n<li><strong>Use base rates as your anchor.</strong> Before forming a view on this specific case, ask: what happens to similar cases in general? Start with the base rate probability and adjust up or down based on features that distinguish this case.</li>\n<li><strong>Track your predictions explicitly.</strong> Use a simple spreadsheet or journal. Without a track record you cannot calibrate. Without calibration, stated probabilities are just feelings with numbers attached.</li>\n<li><strong>Update continuously on new evidence.</strong> Bayesian updating — formally or intuitively — is the mechanism by which probability estimates stay accurate as information arrives.</li>\n</ul></div><div class=\"ms-section\"><h3>Common Failure Modes</h3><ul>\n<li><strong>False precision.</strong> Attaching specific probabilities (37%, 68%) creates the appearance of rigor without the substance. Probability estimates should reflect genuine uncertainty — sometimes &quot;roughly 70%&quot; is as precise as honest.</li>\n<li><strong>Anchoring on the base rate and not adjusting.</strong> Starting with the base rate is correct; failing to adjust for specific features of this case is lazy. Both steps matter.</li>\n<li><strong>Hindsight contamination.</strong> After outcomes are known, we rewrite our memory of our prior probability estimates upward for correct calls and downward for wrong ones. The fix is written records.</li>\n</ul></div><div class=\"ms-section\"><h3>Worked Example</h3><p>A product team is deciding whether to build a feature. The PM estimates &quot;it will definitely improve retention.&quot; A probabilistic reframe: &quot;What is the base rate for retention improvements from comparably scoped feature launches in our product category?&quot; Research suggests roughly 40% of such features produce measurable retention improvements. This specific feature has some positive signals (user interviews, competitor data) and some negative ones (our retention problem may be driven by factors unrelated to this feature). Updated estimate: 55% chance of meaningful retention improvement. This now-explicit uncertainty changes the decision: rather than building the full feature, the team runs a 4-week test first.</p></div><div class=\"ms-section\"><h3>Connections</h3><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"5\"><strong>Circle of Competence</strong></a> — probability estimates are only as good as your underlying knowledge. Outside your circle, confidence intervals should be much wider.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"77\"><strong>Regression to the Mean</strong></a> — understanding that extreme outcomes tend toward average is a structural input to probabilistic thinking.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"24\"><strong>Margin of Safety</strong></a> — once you have a probability distribution on outcomes, margin of safety tells you how much buffer to hold.</p></div><div class=\"ms-section\"><h3>References</h3><p>Rooted in the probability theory of Pierre-Simon Laplace and Thomas Bayes (18th century). Applied to everyday decision-making by Annie Duke and Nate Silver.</p><ul><li><em>Thinking in Bets</em> — Annie Duke (2018)</li><li><em>The Signal and the Noise</em> — Nate Silver (2012)</li><li><em>Against the Gods: The Remarkable Story of Risk</em> — Peter L. Bernstein (1996)</li></ul></div>","file":"01-General-Thinking/probabilistic-thinking.md","searchText":"probabilistic thinking think in distributions, not outcomes probabilistic thinking is the practice of representing beliefs as probability distributions rather than binary true/false or confident predictions. rather than \"i think x will happen,\" the practitioner says \"i think x will happen with 70% probability, and here are the main altern"},{"id":15,"name":"Regret Minimization Framework","tagline":"Choose the path you would least regret at 80","category":"General Thinking","color":"#3B82F6","preview":"The Regret Minimization Framework, coined by Jeff Bezos in the context of his decision to leave a high-paying job to start Amazon, is a decision-making heuristic that projects the decision-maker forward to extreme old age (80 years old is Bezos's specific frame) and asks: looking","modal":"<div class=\"ms-section\"><h3>Definition</h3><p>The Regret Minimization Framework, coined by Jeff Bezos in the context of his decision to leave a high-paying job to start Amazon, is a decision-making heuristic that projects the decision-maker forward to extreme old age (80 years old is Bezos's specific frame) and asks: looking back from that vantage point, which choice would you regret more — acting or not acting? The framework exploits the well-documented asymmetry in how humans experience regret: we regret inactions (things we didn't try, risks we didn't take) more than actions (things we tried that didn't work out) over the long term.</p></div><div class=\"ms-section\"><h3>Mental Model</h3><p>Short-term decision-making is dominated by loss aversion, risk aversion, and the fear of disruption to current comfort. These are psychologically powerful but poor guides to long-run satisfaction. The 80-year-old frame removes most of these short-term distortions: the financial loss from a failed venture is immaterial at 80; the social embarrassment of a failed attempt is forgotten; the salary forgone is irrelevant. What remains is the larger question of whether you made the choices that reflected your actual values and used your actual capabilities. This frame cuts through the noise that makes short-term risk feel catastrophic.</p></div><div class=\"ms-section\"><h3>Practitioner Heuristics</h3><ul>\n<li><strong>Use for decisions where short-term risk aversion is clearly in tension with long-term aspiration.</strong> Career pivots, starting something, committing to a significant relationship, geographic moves — all situations where the short-term cost of acting is vivid and the long-term cost of not acting is diffuse.</li>\n<li><strong>Pair with Second-Order Effects.</strong> The 80-year frame is asking about second-, third-, and nth-order effects. Run the second-order analysis for both paths explicitly.</li>\n<li><strong>Don't use it to override short-term reality entirely.</strong> The framework is a corrective for excessive short-term risk aversion, not a reason to take financially ruinous risks or disregard responsibilities. The 80-year frame should expand the option set, not eliminate prudent constraint.</li>\n<li><strong>Use it to distinguish recoverable from permanent inactions.</strong> &quot;I can always start a company later&quot; may or may not be true — some windows close. &quot;I can always travel later&quot; is probably true. The framework is most powerful for genuinely time-bounded opportunities.</li>\n<li><strong>Apply to relationships and investment in people, not just professional decisions.</strong> From the 80-year vantage point, the quality of relationships typically dominates career regrets. Include this dimension when the framework is applied.</li>\n</ul></div><div class=\"ms-section\"><h3>Common Failure Modes</h3><ul>\n<li><strong>Rationalizing impulsive decisions.</strong> Using the 80-year frame to justify any risk as &quot;I'd regret not doing this,&quot; without honestly modeling the downside scenarios at 80. Regret minimization doesn't mean consequence minimization.</li>\n<li><strong>Over-applying to short-term decisions.</strong> The framework is for major, potentially irreversible choices. Using it for everyday decisions imports an inappropriate frame.</li>\n<li><strong>Anchoring on the failure scenario only.</strong> Imagining regret of not trying without also imagining the regret of trying and disrupting something that was working well.</li>\n</ul></div><div class=\"ms-section\"><h3>Worked Example</h3><p>Bezos's original application: he was a high-performing VP at D.E. Shaw, contemplating leaving to start an internet company in 1994. Using the framework: &quot;If I'm 80 years old and I tried this and it failed, will I regret having tried? Probably not — I would have learned a lot and would have been part of something exciting. If I'm 80 years old and I never tried, staying at a comfortable job during what might be the most important technological shift in my lifetime — will I regret that? Yes, I think I will.&quot; The asymmetry of the two regrets drove the decision to act. The framework didn't guarantee success; it resolved the decision by making the asymmetry visible.</p></div><div class=\"ms-section\"><h3>Connections</h3><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"1\"><strong>Inversion</strong></a> — the regret minimization framework is inversion applied to decision-making: instead of &quot;what's the best outcome I'm seeking?&quot;, it asks &quot;which failure would be worse?&quot;</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"12\"><strong>Asymmetry/Convexity</strong></a> — trying and failing is often less costly at 80 than not trying; this is the regret asymmetry corresponding to Taleb's payoff asymmetry.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"16\"><strong>Two-Way Doors</strong></a> — reversible decisions (two-way doors) have naturally low regret potential from failure; irreversible ones (one-way doors) are where this framework is most relevant.</p></div><div class=\"ms-section\"><h3>References</h3><p>Articulated by Jeff Bezos in 1997 as the personal heuristic he used when deciding to leave a hedge fund job to start Amazon.</p><ul><li><em>Invent and Wander: The Collected Writings of Jeff Bezos</em> — Jeff Bezos, ed. Walter Isaacson (2021)</li><li><em>The Everything Store</em> — Brad Stone (2013)</li></ul></div>","file":"01-General-Thinking/regret-minimization-framework.md","searchText":"regret minimization framework choose the path you would least regret at 80 the regret minimization framework, coined by jeff bezos in the context of his decision to leave a high-paying job to start amazon, is a decision-making heuristic that projects the decision-maker forward to extreme old age (80 years old is bezos's specific frame) and asks: looking"},{"id":2,"name":"Second-Order Effects","tagline":"What happens after what happens","category":"General Thinking","color":"#3B82F6","preview":"Second-order thinking is the discipline of asking not just \"what will happen if I do X?\" (first-order) but \"what will happen as a result of what happens?\" (second-order), and then continuing to third, fourth order and beyond as far as the analysis remains tractable. Howard Marks,","modal":"<div class=\"ms-section\"><h3>Definition</h3><p>Second-order thinking is the discipline of asking not just &quot;what will happen if I do X?&quot; (first-order) but &quot;what will happen as a result of what happens?&quot; (second-order), and then continuing to third, fourth order and beyond as far as the analysis remains tractable. Howard Marks, the investor, described it as asking &quot;and then what?&quot; repeatedly until you reach a stopping point of genuine uncertainty.</p>\n<br>\n<p>Most people think in first-order terms because second-order effects are delayed, diffuse, and require more cognitive effort. This creates systematic gaps between intended and actual outcomes — and systematic opportunities for those who think further ahead.</p></div><div class=\"ms-section\"><h3>Mental Model</h3><p>Every action creates reactions. Systems with feedback loops mean that initial effects circle back and change the conditions that produced them. The practitioner's model is a causal chain with explicit time stamps: X happens at T0, which causes Y at T1, which causes Z at T2. The quality of a decision depends on how far down that chain you can reason accurately — and how honestly you acknowledge where your confidence runs out.</p></div><div class=\"ms-section\"><h3>Practitioner Heuristics</h3><ul>\n<li><strong>Always add a time dimension.</strong> &quot;This will increase sales&quot; is first-order. &quot;This will increase sales in Q1, which will attract copycat entrants by Q3, which will compress margins by Q4&quot; is second-order. Make the timeline explicit.</li>\n<li><strong>Ask &quot;who else is affected, and how will they respond?&quot;</strong> Second-order effects are often driven by other agents adapting to the first-order outcome. Competitors, regulators, customers, and employees all react.</li>\n<li><strong>Map incentives downstream.</strong> Trace who benefits and who is harmed by the first-order outcome. The harmed parties will typically generate the most important second-order effects.</li>\n<li><strong>Distinguish reversible from irreversible chains.</strong> If the second-order effect is irreversible (reputation damage, regulatory response, ecological harm), the analysis must be done before acting, not after.</li>\n<li><strong>Stop when uncertainty dominates.</strong> Beyond a certain depth, chains become speculative. Good practitioners note where their second-order analysis becomes a guess, and hold those conclusions more loosely.</li>\n</ul></div><div class=\"ms-section\"><h3>Common Failure Modes</h3><ul>\n<li><strong>Infinite regress.</strong> Tracing effects so many levels deep that no decision is ever made. Practical second-order thinking goes to the depth where the effects are large and tractable, then stops.</li>\n<li><strong>Selective chain-following.</strong> Tracing only the positive second-order effects of your preferred option and only the negative ones of alternatives. Use the same rigor on all chains.</li>\n<li><strong>Ignoring feedback loops.</strong> Linear chains miss the fact that second-order effects often change the initial conditions, creating self-reinforcing or self-correcting dynamics.</li>\n</ul></div><div class=\"ms-section\"><h3>Worked Example</h3><p>A city decides to build a new urban highway to reduce commute times (first-order effect: faster commutes). Second-order: cheaper transport makes suburban living more attractive, so more people move to suburbs. Third-order: increased suburban car use negates the time savings as road use increases (induced demand). Fourth-order: city center commercial real estate values fall as economic activity disperses. The policy intended to improve quality of life produces the opposite through a chain most planners in the 1950s failed to trace. Modern urban planners are trained specifically in this failure mode.</p></div><div class=\"ms-section\"><h3>Connections</h3><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"17\"><strong>Feedback Loops</strong></a> — second-order thinking identifies the chains; feedback loop analysis describes when those chains circle back.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"51\"><strong>Incentives</strong></a> — the most reliable second-order effects come from tracing how incentives shift after the first-order outcome.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"19\"><strong>Emergence</strong></a> — second-order effects in complex systems often produce emergent properties that no single causal chain predicted.</p></div><div class=\"ms-section\"><h3>References</h3><p>Articulated in investor practice by Howard Marks and Charlie Munger; the underlying systems-level idea was developed rigorously by Donella Meadows in systems dynamics.</p><ul><li><em>The Most Important Thing</em> — Howard Marks (2011)</li><li><em>Thinking in Systems</em> — Donella H. Meadows (2008)</li><li><em>Poor Charlie's Almanack</em> — Charlie Munger, ed. Peter Kaufman (2005)</li></ul></div>","file":"01-General-Thinking/second-order-effects.md","searchText":"second-order effects what happens after what happens second-order thinking is the discipline of asking not just \"what will happen if i do x?\" (first-order) but \"what will happen as a result of what happens?\" (second-order), and then continuing to third, fourth order and beyond as far as the analysis remains tractable. howard marks,"},{"id":9,"name":"Socratic Thinking","tagline":"Question your way to clarity","category":"General Thinking","color":"#3B82F6","preview":"The Socratic method is a form of cooperative dialog in which a series of probing questions is used to expose assumptions, surface contradictions, and guide the interlocutor toward clearer thinking or a better-grounded conclusion. Named after Socrates, whose practice was to claim ","modal":"<div class=\"ms-section\"><h3>Definition</h3><p>The Socratic method is a form of cooperative dialog in which a series of probing questions is used to expose assumptions, surface contradictions, and guide the interlocutor toward clearer thinking or a better-grounded conclusion. Named after Socrates, whose practice was to claim ignorance and ask questions until the other person's position either became well-founded or collapsed under its own contradictions. In practice, Socratic thinking is both a technique for examining others' claims and a discipline for examining one's own.</p>\n<br>\n<p>It is distinct from First Principles thinking in that it is dialogic and questioning rather than constructive — it tears down and tests, where First Principles builds up from the ground.</p></div><div class=\"ms-section\"><h3>Mental Model</h3><p>The Socratic practitioner operates from a position of genuine (or feigned) ignorance. Every assertion — especially from authority or convention — is treated as a hypothesis to be examined: &quot;What do you mean by that exactly? How do you know? What would a counter-example look like? What follows from that?&quot; The goal is not to win an argument but to arrive at a more accurate understanding. The method works because most confident claims are based on imprecise definitions, unexamined assumptions, or narrow evidence.</p></div><div class=\"ms-section\"><h3>Practitioner Heuristics</h3><ul>\n<li><strong>Ask for definitions before engaging with claims.</strong> &quot;What do you mean by 'better'?&quot; or &quot;How are you defining 'success' here?&quot; — imprecise terms are the source of most apparent agreement and most real disagreement. Defining terms first resolves a surprizing fraction of disputes.</li>\n<li><strong>Follow each answer with &quot;how do you know?&quot;</strong> The chain from claim to evidence to interpretation to conclusion is where the weak links live. Trace it deliberately.</li>\n<li><strong>Use hypothetical counter-examples.</strong> &quot;Is there a case where that wouldn't be true?&quot; is often more productive than direct contradiction. A single valid counter-example doesn't destroy a claim but forces it to be refined.</li>\n<li><strong>Apply to your own thinking before applying it to others.</strong> Internal Socratic dialog — &quot;what exactly am I claiming here, and how do I know?&quot; — is the highest-value use of the method.</li>\n<li><strong>The goal is examination, not humiliation.</strong> Socratic questioning used aggressively to embarrass rather than to discover is a social weapon, not a thinking tool. Maintain genuine curiosity as the orientation.</li>\n</ul></div><div class=\"ms-section\"><h3>Common Failure Modes</h3><ul>\n<li><strong>Socratic aggression.</strong> Using relentless questioning to make a person feel stupid rather than to genuinely examine a claim. This destroys the psychological safety required for honest dialog.</li>\n<li><strong>Question without intent.</strong> Asking questions you don't actually want answered, using the form of inquiry to appear rigorous while guiding toward a predetermined conclusion.</li>\n<li><strong>Infinite regress.</strong> Questioning the questions. Every answer can be questioned; the skill is knowing when sufficient clarity has been reached to make a good decision.</li>\n</ul></div><div class=\"ms-section\"><h3>Worked Example</h3><p>A product team claims &quot;users want more features.&quot; Socratic examination: &quot;Which users? How many? How do you know it's features they want rather than the outcomes the features might provide? What did they say exactly? When they used the product without the features, what specifically went wrong? Has any user churned specifically because of missing features vs. other reasons?&quot; Within this questioning chain, &quot;users want more features&quot; typically resolves into &quot;three enterprise customers mentioned X in interviews, but churn data suggests the problem is onboarding, not feature depth.&quot; The original confident claim was a conflation of weak signals.</p></div><div class=\"ms-section\"><h3>Connections</h3><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"0\"><strong>First Principles</strong></a> — Socratic questioning strips away imprecision; First Principles strips away assumptions. Together, they constitute a complete belief-examination process.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"55\"><strong>Confirmation Bias</strong></a> — Socratic thinking is the antidote: it actively seeks the weakness in a belief rather than confirming it.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"14\"><strong>Ladder of Inference</strong></a> — Socratic questioning walks back down the ladder from belief to raw data.</p></div><div class=\"ms-section\"><h3>References</h3><p>Developed by Socrates (470–399 BC) and documented by his student Plato in the Dialogues. The method of disciplined questioning was revived in modern pedagogy by Leonard Nelson and Richard Paul.</p><ul><li><em>The Republic</em> — Plato (trans. Benjamin Jowett, c. 380 BC)</li><li><em>Socratic Seminars in the Block</em> — Wanda H. Ball & Pam Brewer (1996)</li></ul></div>","file":"01-General-Thinking/socratic-thinking.md","searchText":"socratic thinking question your way to clarity the socratic method is a form of cooperative dialog in which a series of probing questions is used to expose assumptions, surface contradictions, and guide the interlocutor toward clearer thinking or a better-grounded conclusion. named after socrates, whose practice was to claim "},{"id":128,"name":"Theory of Change","tagline":"","category":"General Thinking","color":"#3B82F6","preview":"A Theory of Change is an explicit, testable causal chain: Inputs → Activities → Outputs → Outcomes → Impact. Critically, it makes the assumptions at each causal link explicit — the conditions that must be true for one step to produce the next. Those assumptions are your highest-p","modal":"<div class=\"ms-section\"><h3>Definition</h3><p>A Theory of Change is an explicit, testable causal chain: Inputs → Activities → Outputs → Outcomes → Impact. Critically, it makes the <strong>assumptions</strong> at each causal link explicit — the conditions that must be true for one step to produce the next. Those assumptions are your highest-priority hypotheses to test.</p>\n<br>\n<p>Many transformation programmes have a clear vision and a detailed activity plan with no explicit account of why those activities will produce the intended outcome.</p></div><div class=\"ms-section\"><h3>Connections</h3></div><div class=\"ms-section\"><h3>References</h3><p><strong>Originators:</strong> Carol Weiss and the Aspen Institute Roundtable on Community Change (1990s).</p>\n<br>\n<p>- <em>Realistic Evaluation</em> — Ray Pawson &amp; Nick Tilley, 1997<br>\n- <em>The Logic Model Guidebook</em> — Lisa Wyatt Knowlton &amp; Cynthia Phillips, 2013<br>\n- <em>Lean Impact</em> — Ann Mei Chang, 2018</p></div>","file":"01-General-Thinking/theory-of-change.md","searchText":"theory of change  a theory of change is an explicit, testable causal chain: inputs → activities → outputs → outcomes → impact. critically, it makes the assumptions at each causal link explicit — the conditions that must be true for one step to produce the next. those assumptions are your highest-p"},{"id":8,"name":"Thought Experiment","tagline":"Reason through the impossible to illuminate the actual","category":"General Thinking","color":"#3B82F6","preview":"A thought experiment is a structured exercise in hypothetical reasoning: you posit a scenario — often simplified, idealized, or physically impossible — and reason through its implications to produce insight about real phenomena. The technique is central to physics (Einstein's ele","modal":"<div class=\"ms-section\"><h3>Definition</h3><p>A thought experiment is a structured exercise in hypothetical reasoning: you posit a scenario — often simplified, idealized, or physically impossible — and reason through its implications to produce insight about real phenomena. The technique is central to physics (Einstein's elevator, Schrödinger's cat, Maxwell's demon), philosophy (Rawls' veil of ignorance, the trolley problem), and strategic thinking. The value is not in the imagined scenario but in what the reasoning reveals about constraints, principles, and trade-offs in the real case.</p></div><div class=\"ms-section\"><h3>Mental Model</h3><p>Thought experiments work by stripping away confounding variables until only the essential dynamic remains. Reality is always cluttered with factors that obscure the pure operation of the principle you're trying to understand. The thought experiment creates a clean laboratory. The practitioner's skill is designing the experiment so that (a) the thing being investigated is genuinely isolated, and (b) the conclusions can be carefully mapped back to the messy real case.</p></div><div class=\"ms-section\"><h3>Practitioner Heuristics</h3><ul>\n<li><strong>State the specific question the experiment is designed to answer.</strong> Without a clear question, a thought experiment is just speculation with elevated vocabulary.</li>\n<li><strong>Identify what you're holding constant and what you're varying.</strong> The experimental structure (variables controlled, variable changed, outcome observed) should be as explicit as in a real experiment.</li>\n<li><strong>Push to the limit case.</strong> Thought experiments are most revealing at the extremes. &quot;What if we had infinite marketing budget?&quot; reveals the limits of distribution; &quot;what if we had zero?&quot; reveals the minimum viable product.</li>\n<li><strong>Test your conclusions back against reality.</strong> If the thought experiment implies X, look for evidence of X in real cases. If you can't find any, either your experiment was poorly designed or your conclusion needs revision.</li>\n<li><strong>Use thought experiments to surface ethical and strategic asymmetries.</strong> &quot;What would I think of this decision if I were on the receiving end?&quot; is a thought experiment. So is &quot;what would the decision look like if the parties involved were reversed?&quot;</li>\n</ul></div><div class=\"ms-section\"><h3>Common Failure Modes</h3><ul>\n<li><strong>Underconstrained scenarios.</strong> A thought experiment with no rules produces no insight — any conclusion can be drawn because anything is possible. The power comes from specific constraints.</li>\n<li><strong>Conclusions that don't survive the return to reality.</strong> The thought experiment is a tool for generating hypotheses, not proving them. Failing to test conclusions against actual evidence turns thought experiment into sophisticated storytelling.</li>\n<li><strong>Choosing thought experiments that confirm existing views.</strong> A well-designed thought experiment should be capable of producing conclusions that surprise you. If every thought experiment you run confirms what you already believed, check the design.</li>\n</ul></div><div class=\"ms-section\"><h3>Worked Example</h3><p>Jeff Bezos's &quot;two-pizza team&quot; rule emerged from a thought experiment: if coordination overhead scales with the number of connections in a team, and connections scale as n(n-1)/2, what team size minimizes the ratio of productive work to coordination overhead? The thought experiment (hold everything else constant, vary team size, measure implied coordination cost) produced the insight that small teams with high autonomy outperform larger coordinated ones for most product development tasks. The rule it generated — teams should be small enough to be fed by two pizzas — is a heuristic derived from the experimental conclusion.</p></div><div class=\"ms-section\"><h3>Connections</h3><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"0\"><strong>First Principles</strong></a> — thought experiments often use first principles reasoning to work out the implications of basic laws.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"1\"><strong>Inversion</strong></a> — the pre-mortem is a thought experiment in inversion: imagine the failure state and reason backward.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"2\"><strong>Second-order Effects</strong></a> — thought experiments are ideal for tracing second-order chains in controlled, simplified form before applying the reasoning to real systems.</p></div><div class=\"ms-section\"><h3>References</h3><p>Central to the natural philosophy of Galileo Galilei (17th century) and formalized in physics by Ernst Mach and Albert Einstein, who called them Gedankenexperimente.</p><ul><li><em>Einstein: His Life and Universe</em> — Walter Isaacson (2007)</li><li><em>Thirty Years that Shook Physics</em> — George Gamow (1966)</li></ul></div>","file":"01-General-Thinking/thought-experiment.md","searchText":"thought experiment reason through the impossible to illuminate the actual a thought experiment is a structured exercise in hypothetical reasoning: you posit a scenario — often simplified, idealized, or physically impossible — and reason through its implications to produce insight about real phenomena. the technique is central to physics (einstein's ele"},{"id":16,"name":"Two-Way Doors","tagline":"Reversible decisions deserve speed; irreversible ones deserve deliberation","category":"General Thinking","color":"#3B82F6","preview":"Jeff Bezos introduced the Two-Way Door (Type 1 / Type 2 decision) framework to describe the fundamental distinction between reversible and irreversible decisions. A two-way door (Type 2) is a decision you can walk back through: if it proves wrong, you reverse it with limited cost","modal":"<div class=\"ms-section\"><h3>Definition</h3><p>Jeff Bezos introduced the Two-Way Door (Type 1 / Type 2 decision) framework to describe the fundamental distinction between reversible and irreversible decisions. A <strong>two-way door</strong> (Type 2) is a decision you can walk back through: if it proves wrong, you reverse it with limited cost. A <strong>one-way door</strong> (Type 1) is irreversible or very difficult to reverse: once made, you are committed to the consequences. The practitioner's insight: organizations systematically apply too much process to Type 2 decisions (slowing them unnecessarily) and too little deliberation to Type 1 decisions (making them with insufficient analysis). The goal is to match decision process to decision type.</p></div><div class=\"ms-section\"><h3>Mental Model</h3><p>Imagine two doors. The two-way door: you can open it, walk through, look around, and if you don't like what you see, walk back through to where you started. The cost of a wrong choice is small — the time and energy of the exploration. The one-way door: once you walk through, the door disappears. You are committed to wherever you find yourself. The asymmetry is large: the cost of a wrong choice in a one-way door decision is very high. The correct response to a one-way door is deliberate analysis before committing; the correct response to a two-way door is to move quickly, try it, and update based on what you find.</p></div><div class=\"ms-section\"><h3>Practitioner Heuristics</h3><ul>\n<li><strong>Classify decisions as Type 1 or Type 2 before applying any decision process.</strong> Most decisions that teams treat as highly consequential are actually Type 2. Name the type first.</li>\n<li><strong>Default to Type 2 (reversible) unless you can articulate a specific reason for irreversibility.</strong> The bias should be toward treating decisions as more reversible than they initially appear. This increases decision speed and reduces process overhead.</li>\n<li><strong>For Type 1 decisions, slow down and gather more evidence.</strong> The cost of slow deliberation on a one-way door decision is low (delay); the cost of a wrong decision is high (irreversibility). Invest proportionally.</li>\n<li><strong>Create reversibility where possible before committing.</strong> Can you turn a one-way door into a two-way door? A pilot before a full launch, a trial before a permanent hire, a reversible architecture before a permanent system migration — these convert irreversibility into reversibility and allow you to apply the faster Type 2 process.</li>\n<li><strong>Watch for false irreversibility.</strong> Many decisions that feel permanent are actually reversible with modest cost. Labelling a reversible decision as a one-way door to justify high process is a common organizational dysfunction.</li>\n</ul></div><div class=\"ms-section\"><h3>Common Failure Modes</h3><ul>\n<li><strong>Type 1 process on Type 2 decisions.</strong> Multi-layer approval processes, cross-functional review, and months of analysis applied to decisions that could be made in a day and reversed if wrong. This is how organizations become slow without becoming safer.</li>\n<li><strong>Type 2 casualness on Type 1 decisions.</strong> Moving fast on hiring decisions that are actually very hard to reverse, technology architecture choices, or market positioning commitments as if they are easily reversible.</li>\n<li><strong>Using the framework to justify impulsivity.</strong> Claiming everything is a two-way door to avoid the deliberation that important decisions deserve. The framework requires honest classification.</li>\n</ul></div><div class=\"ms-section\"><h3>Worked Example</h3><p>A product team wants to deprecate a legacy API that some customers still use. Initial instinct: this requires a long, careful process — many stakeholders, months of communication. Two-way door analysis: is this irreversible? Not entirely — if the API is deprecated and a significant customer complains, re-enabling it (while embarrassing) is technically possible. The team negotiates a 90-day deprecation window with a direct notification to affected customers, monitors complaints, and reserves the right to extend the window. By explicitly structuring the reversibility (the 90-day window is the &quot;door&quot;), they convert a near-one-way-door decision into a two-way-door-with-a-short-corridor, and move significantly faster than a permanent deprecation decision would have required.</p></div><div class=\"ms-section\"><h3>Connections</h3><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"24\"><strong>Margin of Safety</strong></a> — irreversible decisions require more margin of safety than reversible ones; the two frameworks work together.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"12\"><strong>Asymmetry/Convexity</strong></a> — two-way doors are structurally asymmetric: limited downside (can reverse), full upside potential.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"15\"><strong>Regret Minimization</strong></a> — the regret of a wrong reversible decision is small; the regret of a wrong irreversible decision can be large. The two frameworks combine to guide which decisions to act on quickly.</p></div><div class=\"ms-section\"><h3>References</h3><p>Introduced by Jeff Bezos in Amazon's 2015 annual shareholder letter as a framework for distinguishing reversible from irreversible decisions.</p><ul><li><em>Invent and Wander: The Collected Writings of Jeff Bezos</em> — Jeff Bezos, ed. Walter Isaacson (2021)</li><li><em>Working Backwards</em> — Colin Bryar & Bill Carr (2021)</li></ul></div>","file":"01-General-Thinking/two-way-doors.md","searchText":"two-way doors reversible decisions deserve speed; irreversible ones deserve deliberation jeff bezos introduced the two-way door (type 1 / type 2 decision) framework to describe the fundamental distinction between reversible and irreversible decisions. a two-way door (type 2) is a decision you can walk back through: if it proves wrong, you reverse it with limited cost"},{"id":109,"name":"Adjacent Possible","tagline":"At any moment, innovation can only move into the space of possibilities adjacent to what currently exists — each step opens new doors, but you cannot skip rooms.","category":"Systems","color":"#0D9488","preview":"The adjacent possible is a concept developed by theoretical biologist Stuart Kauffman and popularized by Steven Johnson in Where Good Ideas Come From. It describes the constrained space of next possibilities available at any given moment — the innovations, combinations, and disco","modal":"<div class=\"ms-section\"><h3>Definition</h3><p>The adjacent possible is a concept developed by theoretical biologist Stuart Kauffman and popularized by Steven Johnson in <em>Where Good Ideas Come From</em>. It describes the constrained space of next possibilities available at any given moment — the innovations, combinations, and discoveries that are accessible from the current state but not from states further removed. The image is architectural: reality at any point resembles a vast building with many rooms, each containing multiple doors. You can enter the rooms adjacent to the one you occupy, and doing so reveals new rooms with new doors. But you cannot access rooms that are five doors away without passing through the intervening rooms first. Innovation, in this model, is not a leap across possibility space but a step-by-step expansion of it.</p></div><div class=\"ms-section\"><h3>Mental Model</h3><p>An experienced practitioner uses the adjacent possible as a diagnostic and directional tool. Diagnostically, it explains why innovations cluster in time and place: when multiple actors are in the same room, they all see the same adjacent doors. The telephone, the automobile, and the airplane all had multiple near-simultaneous independent inventors because the adjacent possible of the late 19th century had positioned many actors at the same threshold. A lone genius theory of innovation misses this — the genius was positioned well, not uniquely perceptive. Directionally, the adjacent possible answers the question: where should we look for our next innovation? The answer is always: map your current position and enumerate what is genuinely adjacent — what combinations of existing capabilities, technologies, regulations, or customer behaviors are one step away from where you stand. Non-adjacent innovations that appear desirable are seductive but unreachable without first building the intermediate positions. This explains why companies that try to leap from their current capabilities to a distant target consistently fail, while companies that expand systematically through adjacencies often arrive at the same destination while building durable competitive positions along the way.</p></div><div class=\"ms-section\"><h3>Practitioner Heuristics</h3><ul>\n<li><strong>Map your current position before planning your next move.</strong> What capabilities, technologies, relationships, data, and regulatory access do you currently possess? The adjacent possible is defined by this inventory.</li>\n<li><strong>Enumerate adjacencies explicitly.</strong> What is one capability-addition, one combination of existing assets, one regulatory or market change away from your current position? These are your genuinely adjacent next innovations.</li>\n<li><strong>Treat non-adjacencies as requiring a path, not a leap.</strong> If the desired destination is not adjacent, identify the intermediate positions that would make it adjacent. Plan the path, not the destination.</li>\n<li><strong>Watch for convergence in adjacency.</strong> When multiple independent actors are all adjacent to the same next possibility, breakthrough is imminent — either from you or a competitor. Convergence signals urgency.</li>\n<li><strong>Use the adjacent possible to evaluate ideas.</strong> Before investing in an innovation, ask: is this genuinely adjacent to where we are today? If the honest answer is no, the question is whether to build toward adjacency or to reset expectations about timeline.</li>\n</ul></div><div class=\"ms-section\"><h3>Common Failure Modes</h3><ul>\n<li><strong>The leap fallacy.</strong> Believing that sufficient will, resources, or talent can substitute for the intermediate steps that would make a non-adjacent innovation accessible. History is full of well-resourced failures that tried to skip the rooms between the current state and a desired one.</li>\n<li><strong>Mistaking vision for position.</strong> Knowing where you want to go is not the same as being positioned to get there. A clear destination description with no adjacency path is an aspiration, not a strategy.</li>\n<li><strong>Ignoring that adjacency is multidimensional.</strong> A product innovation may be technologically adjacent but regulatorily non-adjacent, or technically adjacent but culturally non-adjacent. All dimensions of adjacency must be cleared simultaneously.</li>\n<li><strong>Missing the convergence signal.</strong> When multiple teams are racing toward the same adjacent next step, the window for competitive advantage is narrow. Organizations focused internally miss the external convergence that signals urgency.</li>\n<li><strong>Not mapping adjacency for threats.</strong> The adjacent possible analysis applies equally to competitors and entrants. Your current assets make certain futures accessible to you; competitors' assets make certain attacks on your position accessible to them. Mapping their adjacencies reveals your vulnerabilities.</li>\n</ul></div><div class=\"ms-section\"><h3>Worked Example</h3><p>The emergence of the smartphone illustrates the sequential logic of the adjacent possible. Miniaturized electronics (1960s-70s) made portable computing conceivable; portable computing (1980s) made PDAs possible; PDAs + cellular networks (1990s) made the early smartphone possible; early smartphones + high-bandwidth wireless (2000s) made the app ecosystem possible; the app ecosystem made GPS navigation, mobile payments, and social media ubiquitous. Each step was adjacent to the last. The iPhone in 1985 was not adjacent — the technology, battery density, display quality, and wireless networks did not yet exist. By 2007, all of those rooms had been entered and the iPhone was fully adjacent. Apple was not smarter than the market — they were better positioned in the adjacent possible. The same pattern holds in biology, chemistry, and culture: what appears to be a sudden breakthrough is almost always the final step in a sequence of adjacencies, each of which had to be cleared first.</p></div><div class=\"ms-section\"><h3>Connections</h3><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"102\"><strong>S-Curves</strong></a> — S-curves describe adoption trajectories once an innovation is accessible; the adjacent possible explains when and why an innovation first becomes accessible.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"108\"><strong>Exploration vs. Exploitation</strong></a> — exploration is the active search through the adjacent possible for next innovations; the adjacent possible defines the boundary of productive exploration.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"106\"><strong>Analogical Reasoning</strong></a> — analogical reasoning expands the adjacent possible by making solutions developed in distant domains available to import, effectively opening new doors without passing through all intermediate rooms.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"112\"><strong>Disruptive Innovation</strong></a> — disruption often begins at the adjacent possible of entrants, who are positioned (by lower cost structures and different customer focus) adjacent to innovations incumbents cannot reach.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"75\"><strong>Compounding</strong></a> — each step through the adjacent possible compounds: entering a new room doesn't just solve today's problem, it opens new doors unavailable from the previous room. The value of early steps is partly the future steps they make accessible.</p></div><div class=\"ms-section\"><h3>References</h3><p>The concept of the adjacent possible was coined by theoretical biologist Stuart Kauffman to describe the boundary of what can emerge from a given state. Steven Johnson extended it as a framework for understanding innovation.</p><ul><li><em>Where Good Ideas Come From</em> — Steven Johnson (2010)</li><li><em>The Origins of Order</em> — Stuart A. Kauffman (1993)</li></ul></div>","file":"02-Systems/adjacent-possible.md","searchText":"adjacent possible at any moment, innovation can only move into the space of possibilities adjacent to what currently exists — each step opens new doors, but you cannot skip rooms. the adjacent possible is a concept developed by theoretical biologist stuart kauffman and popularized by steven johnson in where good ideas come from. it describes the constrained space of next possibilities available at any given moment — the innovations, combinations, and disco"},{"id":26,"name":"Algorithms","tagline":"Systematic procedures for solving problems","category":"Systems","color":"#0D9488","preview":"An algorithm is a finite, deterministic sequence of steps that reliably produces a correct output given valid inputs. The term comes from computer science but the concept — a systematic, reproducible procedure — is useful wherever decisions need to be made consistently, efficient","modal":"<div class=\"ms-section\"><h3>Definition</h3><p>An algorithm is a finite, deterministic sequence of steps that reliably produces a correct output given valid inputs. The term comes from computer science but the concept — a systematic, reproducible procedure — is useful wherever decisions need to be made consistently, efficiently, and at scale. Algorithms can be literal (sorting data, routing traffic) or conceptual (a systematic decision process, a repeatable hiring rubric, a standard operating procedure).</p>\n<br>\n<p>The practitioner's interest in algorithms is dual: (1) identifying where algorithmic thinking would improve the consistency and quality of decisions, and (2) understanding the properties of algorithms — their time complexity, failure modes, and assumptions — well enough to deploy them wisely.</p></div><div class=\"ms-section\"><h3>Mental Model</h3><p>An algorithm trades discretion for consistency. Where human judgment is expensive, slow, or inconsistent, an algorithm provides a rule that scales. The practitioner asks: <em>&quot;Is this decision type well-understood enough that a good algorithm would outperform human judgment most of the time?&quot;</em> Research in decision science (Kahneman, Meehl, Dawes) suggests the answer is yes more often than practitioners assume — simple rules outperform expert judgment in noisy environments with well-defined outcomes.</p></div><div class=\"ms-section\"><h3>Practitioner Heuristics</h3><ul>\n<li><strong>Distinguish decisions by their frequency and uniformity.</strong> High-frequency, structurally similar decisions (credit scoring, content moderation, lead prioritization) are candidates for algorithmic treatment. Low-frequency, structurally novel decisions (major strategy pivots, M&amp;A) are not.</li>\n<li><strong>Understand algorithm complexity.</strong> Some procedures scale linearly (O(n)); others scale as n log n or n². Before deploying an algorithm at scale, understand what happens to its cost or runtime as input size grows.</li>\n<li><strong>Audit algorithm failure modes explicitly.</strong> Algorithms fail in predictable ways: they perform poorly on edge cases outside their training distribution, they optimize their specified objective while ignoring important objectives not captured in the metric, and they can embed and amplify historical biases. Each failure mode requires a specific mitigation.</li>\n<li><strong>Build in human override at designed checkpoints.</strong> Algorithms should not be fully autonomous in high-stakes domains without human review at specified decision points. The override should be triggered by specific signals, not by general discomfort.</li>\n<li><strong>Treat your own decision heuristics as algorithms and debug them.</strong> Your mental rule for deciding X is an informal algorithm. Making it explicit allows you to identify where it fails and to improve it.</li>\n</ul></div><div class=\"ms-section\"><h3>Common Failure Modes</h3><ul>\n<li><strong>Goodhart's Law in algorithmic form.</strong> Optimizing an algorithmic objective that is a proxy for the real goal, allowing the algorithm to find solutions that maximize the metric while violating the intent.</li>\n<li><strong>Distribution shift.</strong> An algorithm trained on historical data performs badly when the world changes and the new data no longer matches the training distribution.</li>\n<li><strong>Automation bias.</strong> People over-trust algorithmic outputs, even when the algorithm is visibly wrong, because they attribute authority to systematic processes.</li>\n</ul></div><div class=\"ms-section\"><h3>Worked Example</h3><p>A law firm handling high-volume contract review introduces an NLP algorithm to flag non-standard clauses. Initial deployment: the algorithm flags everything, creating more work for the lawyers. After calibration, it flags genuinely non-standard clauses 85% accurately. The failure mode that emerges: lawyers stop reading the clauses the algorithm marks as standard, creating a critical oversight gap for the 15% false negatives. The fix: require human review of a random 10% sample of &quot;standard&quot; flags, with explicit tracking of the false-negative rate over time. The algorithm handles volume; the human spot-check maintains quality.</p></div><div class=\"ms-section\"><h3>Connections</h3><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"18\"><strong>Bottlenecks</strong></a> — algorithms are often deployed to relieve bottlenecks in high-frequency decision processes.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"33\"><strong>Optimization</strong></a> — algorithms are the mechanisms through which optimization is operationalized.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"6\"><strong>Map-Territory</strong></a> — an algorithm is a map of a decision process; the territory includes cases the map was not designed for.</p></div><div class=\"ms-section\"><h3>References</h3><p>The formal theory of algorithms was established by Alan Turing (1936) and Alonzo Church. Donald Knuth produced the definitive reference work beginning in 1968.</p><ul><li><em>The Art of Computer Programming (Vol. 1)</em> — Donald E. Knuth (1968)</li><li><em>Algorithms to Live By</em> — Brian Christian & Tom Griffiths (2016)</li></ul></div>","file":"02-Systems/algorithms.md","searchText":"algorithms systematic procedures for solving problems an algorithm is a finite, deterministic sequence of steps that reliably produces a correct output given valid inputs. the term comes from computer science but the concept — a systematic, reproducible procedure — is useful wherever decisions need to be made consistently, efficient"},{"id":18,"name":"Bottlenecks","tagline":"The constraint that governs throughput","category":"Systems","color":"#0D9488","preview":"A bottleneck is the single constraint that limits the throughput of an entire system. Coined in manufacturing and formalized by Eliyahu Goldratt in The Goal (1984) through his Theory of Constraints, the insight is profound: every system has exactly one binding constraint at any g","modal":"<div class=\"ms-section\"><h3>Definition</h3><p>A bottleneck is the single constraint that limits the throughput of an entire system. Coined in manufacturing and formalized by Eliyahu Goldratt in <em>The Goal</em> (1984) through his Theory of Constraints, the insight is profound: <strong>every system has exactly one binding constraint at any given time, and improving anything other than that constraint does not improve overall system performance.</strong> All other improvements are local optima that feel like progress but don't move the needle.</p></div><div class=\"ms-section\"><h3>Mental Model</h3><p>Think of a pipeline with sections of different diameters. The narrowest section determines total flow — it doesn't matter how wide the rest of the pipe is. The practitioner's question is: <em>&quot;Where does work/flow/product pile up, or where does it go fastest and then slow down?&quot;</em> The bottleneck is where the queue forms upstream and where downstream capacity sits idle.</p></div><div class=\"ms-section\"><h3>Practitioner Heuristics</h3><ul>\n<li><strong>Goldratt's five steps.</strong> (1) Identify the constraint. (2) Exploit it — squeeze maximum output from it without changing anything. (3) Subordinate everything else to the constraint — other steps should work at the rate the bottleneck can absorb. (4) Elevate it — only now invest in increasing its capacity. (5) If the constraint shifts, go to step 1.</li>\n<li><strong>Find where the queue is longest.</strong> In any process, the bottleneck is where incomplete work accumulates. This is often a person, an approval step, a machine, or a shared resource.</li>\n<li><strong>Protect the bottleneck.</strong> Never let the bottleneck go idle. If a senior engineer is the bottleneck on code reviews, they should never be waiting for context, blocked on a tool, or in non-essential meetings.</li>\n<li><strong>Avoid false bottlenecks.</strong> Sometimes the apparent bottleneck is not the true constraint but is being artificially stressed by poor upstream processes. Diagnose before treating.</li>\n<li><strong>Constraints shift.</strong> After you fix the bottleneck, the next tightest constraint becomes the new bottleneck. This is not failure; it is the system working. Keep iterating.</li>\n</ul></div><div class=\"ms-section\"><h3>Common Failure Modes</h3><ul>\n<li><strong>Improving non-bottlenecks.</strong> This is the most common failure in operational improvement: optimizing steps that are not the constraint, producing local efficiency but no global improvement. The team feels productive; system throughput doesn't change.</li>\n<li><strong>Misidentifying the bottleneck.</strong> The visible queue is not always at the true constraint — it may be downstream of an invisible constraint that limits how much work enters the system. Trace the full flow.</li>\n<li><strong>Creating new bottlenecks downstream.</strong> Aggressively fixing one bottleneck can shift the constraint to a part of the system you haven't prepared for.</li>\n</ul></div><div class=\"ms-section\"><h3>Worked Example</h3><p>An engineering team complains they can't ship fast enough. The diagnosis: pull requests wait an average of 3 days for review before being merged. The obvious solution: hire more engineers. But Theory of Constraints analysis shows the review queue is the bottleneck, not headcount — the engineers are writing code faster than it can be reviewed. Adding more engineers makes the queue longer, not shorter. The actual fix: dedicate 30% of senior engineer time to review, reduce PR size to make individual reviews faster, and invest in automated pre-review checks. Throughput improves before any new hiring.</p></div><div class=\"ms-section\"><h3>Connections</h3><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"17\"><strong>Feedback Loops</strong></a> — the bottleneck often sits where a balancing feedback loop operates most tightly.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"26\"><strong>Algorithms</strong></a> — scheduling algorithms are explicitly designed to route work around bottlenecks.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"21\"><strong>Scale</strong></a> — as organizations scale, the bottleneck migrates; strategic planning requires anticipating the next constraint.</p></div><div class=\"ms-section\"><h3>References</h3><p>Rigorously formalized as the Theory of Constraints by Eliyahu M. Goldratt in the early 1980s, introduced to a mass audience through his novel The Goal.</p><ul><li><em>The Goal</em> — Eliyahu M. Goldratt & Jeff Cox (1984)</li><li><em>The Phoenix Project</em> — Gene Kim, Kevin Behr & George Spafford (2013)</li></ul></div>","file":"02-Systems/bottlenecks.md","searchText":"bottlenecks the constraint that governs throughput a bottleneck is the single constraint that limits the throughput of an entire system. coined in manufacturing and formalized by eliyahu goldratt in the goal (1984) through his theory of constraints, the insight is profound: every system has exactly one binding constraint at any g"},{"id":25,"name":"Churn","tagline":"The rate at which a system loses what it gains","category":"Systems","color":"#0D9488","preview":"Churn is the rate at which a system loses existing members, customers, or resources — and thus the rate at which gains must exceed losses for net growth to occur. In SaaS businesses, customer churn is the percentage of subscribers who cancel in a given period. But the concept gen","modal":"<div class=\"ms-section\"><h3>Definition</h3><p>Churn is the rate at which a system loses existing members, customers, or resources — and thus the rate at which gains must exceed losses for net growth to occur. In SaaS businesses, customer churn is the percentage of subscribers who cancel in a given period. But the concept generalizes: employee churn, social network attrition, audience churn, partner churn. Any system where you are simultaneously gaining and losing members is governed by churn dynamics.</p>\n<br>\n<p>The brutal mathematics: at 5% monthly churn, the average customer stays 20 months. At 3% monthly churn, the average customer stays 33 months. The difference in customer lifetime value between 5% and 3% churn, compounded across a customer base, can exceed the total contribution of a new customer acquisition program.</p></div><div class=\"ms-section\"><h3>Mental Model</h3><p>Think of a leaking bucket. You are pouring water in (acquisition) while it leaks out the bottom (churn). Gross growth tells you how much water you're pouring in. Net growth tells you whether the bucket is filling or emptying. And the height of the waterline — the existing stock — determines how much you can afford to leak and still grow. The practitioner's insight: <strong>fixing the leak is often more valuable than pouring faster.</strong> At high churn, acquisition is just replacing what you're losing; reducing churn compounds forward.</p></div><div class=\"ms-section\"><h3>Practitioner Heuristics</h3><ul>\n<li><strong>Calculate LTV properly, using actual observed cohort retention, not steady-state assumptions.</strong> Many LTV calculations underestimate churn by using optimistic retention curves.</li>\n<li><strong>Segment churn by cohort and customer type.</strong> Aggregate churn can hide the fact that one segment is retaining well (your target customer) and another is churning badly (customers who were the wrong fit). Don't manage the average; manage the segments.</li>\n<li><strong>Identify the churn leading indicators.</strong> Churn is a lagging metric. The behaviors that predict churn (reduced usage, support ticket patterns, engagement drop, competitor evaluation) are detectable weeks or months in advance. Build early warning systems.</li>\n<li><strong>Distinguish preventable churn from inevitable churn.</strong> Some customers were never going to stay (wrong fit, one-off need, budget gone). Focusing retention investment on genuinely saveable churners produces better ROI than applying it universally.</li>\n<li><strong>Calculate the churn rate at which growth becomes impossible at current acquisition pace.</strong> This gives you a clear, quantified ceiling on how bad churn can be before growth reverses.</li>\n</ul></div><div class=\"ms-section\"><h3>Common Failure Modes</h3><ul>\n<li><strong>Acquisition obsession.</strong> Prioritizing new customer acquisition while ignoring churn, not noticing that the net effect is near zero or negative.</li>\n<li><strong>Averaging across heterogeneous cohorts.</strong> Showing good aggregate retention while a critical segment is churning catastrophically.</li>\n<li><strong>Confusing gross revenue retention with net revenue retention.</strong> GRR measures churn; NRR measures churn minus expansion revenue. Companies with high NRR can have significant customer churn but grow anyway through expansion — which is a very different strategic situation than having low churn.</li>\n</ul></div><div class=\"ms-section\"><h3>Worked Example</h3><p>A B2B SaaS company reports 92% annual gross retention — excellent by industry standards. But a cohort analysis reveals that enterprise customers (ACV &gt;£50k) have 97% retention, while SMB customers (ACV &lt;£5k) have 78% retention. The SMB segment is unprofitable on a fully-loaded basis including churn-driven CAC inefficiency. The aggregate number looked good, disguizing a clear strategic signal: either fix SMB retention specifically or exit that segment.</p></div><div class=\"ms-section\"><h3>Connections</h3><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"75\"><strong>Compounding</strong></a> — churn is the subtrahend in the compounding equation; reducing churn dramatically changes the long-run trajectory.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"17\"><strong>Feedback Loops</strong></a> — high churn can trigger a reinforcing negative loop (fewer users → less word of mouth → higher CAC → less investment in product → more churn).</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"18\"><strong>Bottlenecks</strong></a> — in a growth system, churn is often the binding constraint that limits net growth despite strong acquisition.</p></div><div class=\"ms-section\"><h3>References</h3><p>Emerged as a key SaaS business metric in the late 1990s–2000s. David Skok and Bill Gurley were among the earliest investors to publish rigorous frameworks for its interpretation.</p><ul><li><em>The Lean Startup</em> — Eric Ries (2011)</li><li><em>Crossing the Chasm</em> — Geoffrey A. Moore (1991)</li></ul></div>","file":"02-Systems/churn.md","searchText":"churn the rate at which a system loses what it gains churn is the rate at which a system loses existing members, customers, or resources — and thus the rate at which gains must exceed losses for net growth to occur. in saas businesses, customer churn is the percentage of subscribers who cancel in a given period. but the concept gen"},{"id":28,"name":"Conway's Law","tagline":"Systems mirror the communication structures that build them","category":"Systems","color":"#0D9488","preview":"Conway's Law, formulated by software engineer Melvin Conway in 1967, states: \"Any organization that designs a system (defined broadly) will produce a design whose structure is a copy of the organization's communication structure.\" Originally stated about software, it has proven t","modal":"<div class=\"ms-section\"><h3>Definition</h3><p>Conway's Law, formulated by software engineer Melvin Conway in 1967, states: <em>&quot;Any organization that designs a system (defined broadly) will produce a design whose structure is a copy of the organization's communication structure.&quot;</em> Originally stated about software, it has proven to apply broadly to products, processes, and organizational structures. The inverse, known as the <strong>Reverse Conway Manoeuvre</strong>, proposes deliberately restructuring teams to produce the system architecture you actually want.</p></div><div class=\"ms-section\"><h3>Mental Model</h3><p>Teams build interfaces between systems where they have interfaces between themselves. If two teams rarely talk, their respective subsystems will have a poorly designed integration. If a single team owns a complex, cross-cutting concern, their system will tend toward a monolith. The communication structure is not a constraint imposed on the architecture — it <em>is</em> the architecture. The practitioner who wants to change the architecture must first ask: &quot;Does the team structure and communication pattern produce this architecture? And if I want a different architecture, do I need a different team structure?&quot;</p></div><div class=\"ms-section\"><h3>Practitioner Heuristics</h3><ul>\n<li><strong>Audit the team structure before designing the system architecture.</strong> If you want a microservices architecture, you need teams that own individual services and have minimal cross-team dependencies. If your team structure is tightly coupled, your microservices will be too.</li>\n<li><strong>Apply the Reverse Conway Manoeuvre deliberately.</strong> When Amazon decided to build AWS, they restructured around the &quot;two-pizza team&quot; model with explicit API ownership. The restructuring preceded the architecture; the architecture followed.</li>\n<li><strong>Use Conway's Law diagnostically.</strong> If a system integration is consistently painful, fragile, or poorly defined, look at the interface between the teams responsible for it. The integration quality is a proxy for the relationship quality.</li>\n<li><strong>Microservices require micro-teams.</strong> The most common failure in microservices adoption: decomposing the system architecture without decomposing the team structure. The result is a distributed monolith — the worst of both worlds.</li>\n<li><strong>Conway's Law also applies to products.</strong> The features that are easiest to use are typically those where one team owns the entire user flow. Features that require multiple teams produce handoff seams that are visible in the user experience.</li>\n</ul></div><div class=\"ms-section\"><h3>Common Failure Modes</h3><ul>\n<li><strong>Designing for the intended architecture, not the actual team structure.</strong> Architecture diagrams describe how things should work; Conway's Law describes how they will actually work. Reconcile both before committing.</li>\n<li><strong>Ignoring Conway's Law during mergers and acquisitions.</strong> Two companies with different engineering cultures and team structures will produce integrated systems that reflect their independent communication patter
