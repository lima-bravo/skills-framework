<script>
const SKILLS = [{"id":106,"name":"Analogical Reasoning","tagline":"Recognizing structural similarities between different domains and importing solutions, mechanisms, or frameworks from one to solve problems in another.","category":"General Thinking","color":"#3B82F6","preview":"Analogical reasoning is the cognitive practice of identifying deep structural similarities between different domains and using those similarities to transfer solutions, mechanisms, or conceptual frameworks from a source domain to a target problem. It is one of the oldest and most","modal":"<div class=\"ms-section\"><h3>Definition</h3><p>Analogical reasoning is the cognitive practice of identifying deep structural similarities between different domains and using those similarities to transfer solutions, mechanisms, or conceptual frameworks from a source domain to a target problem. It is one of the oldest and most productive engines of innovation: most breakthroughs involve recognizing that a problem in one field resembles a problem already solved in another, and importing the mechanism rather than reinventing it. Analogical reasoning differs from metaphor (which is primarily communicative) and from first principles (which decomposes to fundamentals) — it is specifically a generative transfer tool, used to create new hypotheses and approaches by borrowing from distant domains.</p></div><div class=\"ms-section\"><h3>Mental Model</h3><p>An experienced practitioner operates with a mental library of mechanisms — patterns of cause and effect observed across many domains — and actively searches for structural matches when facing a novel problem. The key distinction is between surface analogies and deep structural analogies. Surface analogies share superficial features (both look similar); structural analogies share the underlying mechanism (both operate similarly). Darwin's application of Malthus's population pressure theory to biological species is a structural analogy: the mechanism (competition for limited resources producing differential survival) was the same, even though the domains looked nothing alike. Surface analogies mislead; structural analogies generate real insight. The practitioner's skill is in stripping away surface features to identify the mechanism at work, then asking: what other system operates by the same mechanism? The answer often comes from a distant domain — biology, physics, game theory, martial arts, military strategy — where the mechanism is better understood and more richly documented. Importing a well-developed theoretical framework from another field is orders of magnitude faster than building one from scratch.</p></div><div class=\"ms-section\"><h3>Practitioner Heuristics</h3><ul>\n<li><strong>Strip the problem to its mechanism before searching for analogies.</strong> What is the core dynamic: competition for scarce resources, amplifying feedback, barrier to entry, energy release, information asymmetry? The mechanism is what you're looking to match, not the surface.</li>\n<li><strong>Search deliberately in distant domains.</strong> The most productive analogies come from domains that look nothing like your field. Nature (biomimicry), military history, game theory, thermodynamics, and evolutionary biology are particularly rich sources. Close-domain analogies exist but are usually already known.</li>\n<li><strong>Use analogies to generate hypotheses, not conclusions.</strong> An analogy points toward a possible mechanism; it is not proof that the mechanism operates. Generate the hypothesis, then test it explicitly.</li>\n<li><strong>Ask: what does the source domain know that my domain doesn't?</strong> If the analogy is structural, then the rich literature of the source domain becomes a resource. What failure modes are documented there? What interventions work? What does the theory predict will happen next?</li>\n<li><strong>Build a cross-domain mechanism library.</strong> After encountering a useful analogy, name the mechanism explicitly and file it. Over time, practitioners develop a mental library of transferable patterns that become an intuitive first resource when facing new problems.</li>\n</ul></div><div class=\"ms-section\"><h3>Common Failure Modes</h3><ul>\n<li><strong>Surface analogies that mislead.</strong> The source and target share a superficial feature but a different underlying mechanism. Acting on a surface analogy imports the wrong model and produces wrong predictions. Always verify the mechanism, not just the resemblance.</li>\n<li><strong>Single-analogy lock-in.</strong> Once a powerful analogy is found, it becomes the lens through which everything is interpreted, even when a better analogy exists. Analogies should generate hypotheses, not replace further thinking.</li>\n<li><strong>Forgetting the disanalogy.</strong> Every analogy breaks down somewhere. The practitioner who doesn't identify where the analogy fails will eventually be surprised by a prediction it makes that doesn't hold. Map the limits explicitly.</li>\n<li><strong>Using analogies to persuade rather than to investigate.</strong> Analogies are excellent rhetorical tools — which means they are regularly used to make bad ideas sound plausible. When an analogy is being used to advocate for a position rather than to explore it, treat it as a warning sign.</li>\n<li><strong>Not importing the full framework.</strong> Borrowing the catchy surface of a concept from another domain without importing the deeper theoretical structure that makes it useful. The borrowed concept becomes jargon without substance.</li>\n</ul></div><div class=\"ms-section\"><h3>Worked Example</h3><p>In the 1850s, Charles Darwin was struggling with the mechanism of species change. Reading Thomas Malthus's <em>An Essay on the Principle of Population</em> provided the key structural analogy: Malthus argued that human populations grow faster than food supply, creating competition for scarce resources in which the weakest are eliminated. Darwin recognized that this exact mechanism — differential reproduction under resource scarcity — could operate on biological variation. The analogy was not superficial (economics and biology look nothing alike) but deeply structural: both involve variation in a population, differential survival based on fit with environment, and cumulative change over generations. Importing the mechanism gave Darwin what he was missing: a causal engine for evolution. The same pattern repeats throughout science and innovation — the telephone (modeled on the ear's anatomy), Velcro (modeled on burdock burrs), distributed computing (modeled on the postal routing system), genetic algorithms (modeled on natural selection).</p></div><div class=\"ms-section\"><h3>Connections</h3><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"0\"><strong>First Principles</strong></a> — first principles decomposes a problem to its foundations; analogical reasoning imports a solution framework from another domain. The two are complementary: first principles identifies what needs to be built; analogy identifies where it may already exist.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"8\"><strong>Thought Experiment</strong></a> — thought experiments run hypothetical scenarios within a single domain; analogical reasoning imports structure from another domain. Both are generative tools but operate differently.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"107\"><strong>Divergent and Convergent Thinking</strong></a> — analogical reasoning is a technique for the divergent phase: generating novel hypotheses by importing from distant domains before converging on a solution.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"89\"><strong>Learning Transfer</strong></a> — learning transfer at the individual level is the same mechanism as analogical reasoning at the problem-solving level: applying knowledge acquired in one context to a structurally similar but superficially different context.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"109\"><strong>Adjacent Possible</strong></a> — analogical reasoning expands the adjacent possible by revealing that solutions developed in other domains are available to import, broadening the space of accessible next innovations.</p></div><div class=\"ms-section\"><h3>References</h3><p>The cognitive science of analogy was formalized by Dedre Gentner in her structure-mapping theory (1983) and by Keith Holyoak and Paul Thagard. Its role in scientific discovery was documented by Kevin Dunbar.</p><ul><li><em>Mental Leaps: Analogy in Creative Thought</em> — Keith J. Holyoak & Paul Thagard (1995)</li><li><em>The Analogical Mind</em> — Dedre Gentner, Keith J. Holyoak & Boicho N. Kokinov, eds. (2001)</li></ul></div>","file":"01-General-Thinking/analogical-reasoning.md","searchText":"analogical reasoning recognizing structural similarities between different domains and importing solutions, mechanisms, or frameworks from one to solve problems in another. analogical reasoning is the cognitive practice of identifying deep structural similarities between different domains and using those similarities to transfer solutions, mechanisms, or conceptual frameworks from a source domain to a target problem. it is one of the oldest and most"},{"id":12,"name":"Asymmetry / Convexity","tagline":"Seek positions where upside exceeds downside","category":"General Thinking","color":"#3B82F6","preview":"Asymmetry describes situations where the potential upside and downside of a bet are not equal — where the magnitude of gain in favorable scenarios significantly exceeds the magnitude of loss in unfavorable ones (positive asymmetry), or the reverse (negative asymmetry). Nassim Tal","modal":"<div class=\"ms-section\"><h3>Definition</h3><p>Asymmetry describes situations where the potential upside and downside of a bet are not equal — where the magnitude of gain in favorable scenarios significantly exceeds the magnitude of loss in unfavorable ones (positive asymmetry), or the reverse (negative asymmetry). Nassim Taleb's concept of convexity formalizes this: a convex position is one that benefits from uncertainty and volatility; a concave position is harmed by it. The practitioner's discipline is to structure positions, investments, and decisions to be positively asymmetric — limited defined downside, theoretically uncapped upside.</p></div><div class=\"ms-section\"><h3>Mental Model</h3><p>In standard expected-value thinking, a bet with equal probabilities and equal stakes is fair. Asymmetric thinking says: the shape of the outcome distribution matters as much as its average. A position that loses a defined small amount when wrong but gains a large undefined amount when right produces positive expected value that is not visible in the average — it is embedded in the shape. Taleb's barbell strategy operationalizes this: hold most of your resources in extremely safe, low-return positions (protecting the base) and a small fraction in extremely high-variance bets (capturing the upside from unexpected positive events). Avoid the middle — moderate risk, moderate return — which has the worst asymmetry.</p></div><div class=\"ms-section\"><h3>Practitioner Heuristics</h3><ul>\n<li><strong>Before any significant bet, map the downside and upside independently.</strong> &quot;What is the maximum credible loss?&quot; and &quot;What is the maximum credible gain?&quot; If the answers are approximately symmetric, the bet may be fair but is not asymmetrically attractive.</li>\n<li><strong>Seek options, not obligations.</strong> An option gives you the right but not the obligation to take an action. Options have natural positive asymmetry: capped downside (the option premium), uncapped upside (the value of exercizing). Organize your strategy portfolio to contain many option-like positions.</li>\n<li><strong>Avoid negative asymmetry explicitly.</strong> Situations with large defined downside and small capped upside (financial ruin, reputational catastrophe, irreversible health consequences) are negative asymmetry traps regardless of their stated probability.</li>\n<li><strong>Volatility is your friend if you are convex.</strong> A convex position benefits more from large moves than it loses from equivalent large moves in the other direction. In uncertain environments, hold positions that benefit from turbulence, not positions that require stability.</li>\n<li><strong>Apply the barbell heuristic to experimentation.</strong> Dedicate 80-90% of resources to safe, proven strategies; reserve 10-20% for radically different experiments with large potential upside. The safe core funds the experimental bets; the bets provide the asymmetry.</li>\n</ul></div><div class=\"ms-section\"><h3>Common Failure Modes</h3><ul>\n<li><strong>Confusing probability with payoff.</strong> A high-probability outcome with small upside can have a worse expected value than a low-probability outcome with enormous upside. Asymmetry thinking requires tracking both probability and magnitude independently.</li>\n<li><strong>Negative asymmetry through overconfidence.</strong> Taking concentrated positions in &quot;sure things&quot; creates concavity — large downside when the sure thing fails, small upside relative to alternatives foregone. Conviction should not override structural asymmetry analysis.</li>\n<li><strong>Avoiding all variance.</strong> In a competitive environment, playing entirely safe produces certain mediocrity. Positive asymmetry requires accepting defined downside risk in exchange for participation in large upside outcomes.</li>\n</ul></div><div class=\"ms-section\"><h3>Worked Example</h3><p>A startup's investment in attending a major industry conference is asymmetric: the downside is the cost of attendance and two days of team time (defined, limited). The upside is potentially: a key partnership, a top-tier investor introduction, a business development relationship, or a product insight that changes the direction of the company — any of which could be worth multiples of the attendance cost. The expected value calculation on average conference ROI is uninspiring; the asymmetry of the option (you might encounter the connection that changes everything) justifies it. Attending multiple such conferences is a barbell strategy: most produce moderate value, one or two produce extraordinary value.</p></div><div class=\"ms-section\"><h3>Connections</h3><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"24\"><strong>Margin of Safety</strong></a> — asymmetry thinking and margin of safety are complementary: both protect against the downside while keeping upside accessible.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"16\"><strong>Two-Way Doors</strong></a> — reversible decisions are structurally asymmetric: the downside is limited (you can reverse); the upside is the potential gain from trying.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"7\"><strong>Probabilistic Thinking</strong></a> — asymmetry analysis requires explicit probability-and-magnitude estimation, not just probability alone.</p></div><div class=\"ms-section\"><h3>References</h3><p>Developed and popularized by Nassim Nicholas Taleb, who built the concept of convex payoffs as a cornerstone of his philosophical framework across the Incerto series.</p><ul><li><em>The Black Swan</em> — Nassim Nicholas Taleb (2007)</li><li><em>Antifragile</em> — Nassim Nicholas Taleb (2012)</li></ul></div>","file":"01-General-Thinking/asymmetry-convexity.md","searchText":"asymmetry / convexity seek positions where upside exceeds downside asymmetry describes situations where the potential upside and downside of a bet are not equal — where the magnitude of gain in favorable scenarios significantly exceeds the magnitude of loss in unfavorable ones (positive asymmetry), or the reverse (negative asymmetry). nassim tal"},{"id":5,"name":"Circle of Competence","tagline":"Know the edge of what you know","category":"General Thinking","color":"#3B82F6","preview":"The Circle of Competence is the domain within which a person has genuine, earned knowledge — understanding not just of the facts but of the failure modes, the edge cases, and the nuance that only comes from direct experience and study. The concept, articulated by Warren Buffett a","modal":"<div class=\"ms-section\"><h3>Definition</h3><p>The Circle of Competence is the domain within which a person has genuine, earned knowledge — understanding not just of the facts but of the failure modes, the edge cases, and the nuance that only comes from direct experience and study. The concept, articulated by Warren Buffett and Charlie Munger, holds that exceptional performance does not require a large circle; it requires knowing precisely where the boundary of your circle lies.</p>\n<br>\n<p>The critical distinction is between knowledge and the feeling of knowledge. Many domains feel familiar — we have opinions, we have read articles, we have seen the results — without our having the depth to distinguish correct from plausible-sounding-but-wrong. The practitioner's discipline is maintaining a brutally accurate map of their own competence boundary.</p></div><div class=\"ms-section\"><h3>Mental Model</h3><p>Draw three concentric rings. The inner ring is your genuine deep expertise — where you know the failure modes, where you've been wrong and understand why, where you can generate new insights rather than just recall received ones. The middle ring is informed familiarity — you understand the basics and can ask good questions, but should not make final calls without expert input. The outer ring is the vast territory you know little about. The razor insight: most people draw their inner ring far too large. The value of the model comes entirely from honest calibration.</p></div><div class=\"ms-section\"><h3>Practitioner Heuristics</h3><ul>\n<li><strong>Track your predictions.</strong> The only reliable way to calibrate your circle is to make explicit predictions in a domain and observe outcomes. Feeling confident is not evidence; track record is.</li>\n<li><strong>Distinguish knowledge from exposure.</strong> Reading extensively about surgery does not put surgery inside your circle. Ask: have I made consequential decisions in this domain, been wrong, understood why, and updated?</li>\n<li><strong>The boundary is more valuable than the center.</strong> Knowing your limits precisely lets you seek expert input exactly when needed — not reflexively (which is expensive) and not never (which is dangerous).</li>\n<li><strong>Use the circle to frame, not to fence.</strong> The goal is not to refuse to think about things outside your circle but to explicitly flag those thoughts as lower-confidence and seek calibration.</li>\n<li><strong>Shrink your circle under pressure.</strong> In high-stakes, time-pressured decisions, operate within the most conservative definition of your circle. The cost of overreach is highest when there is least time to recover.</li>\n</ul></div><div class=\"ms-section\"><h3>Common Failure Modes</h3><ul>\n<li><strong>The Dunning-Kruger entry point.</strong> Early learning in any domain produces false confidence before real competence is established. The circle feels large exactly when it is smallest.</li>\n<li><strong>Static mapping.</strong> The circle changes over time — expertise deepens in some areas and atrophies in others. A circle mapped five years ago may no longer be accurate.</li>\n<li><strong>Using the circle to justify intellectual laziness.</strong> &quot;That's outside my circle&quot; is not a reason to avoid developing an informed view; it is a reason to hold that view with appropriate humility and seek expert input.</li>\n</ul></div><div class=\"ms-section\"><h3>Worked Example</h3><p>A successful SaaS founder raises a fund and begins making angel investments. Her operational circle — product, B2B sales, SaaS unit economics — is genuinely deep. She begins making investments in biotech because she finds the science fascinating and has read widely. Three investments fail in ways she did not anticipate: regulatory approval timelines, IP disputes, and clinical trial design issues. Her circle in SaaS was deep; her circle in biotech was wide but shallow. The expensive lesson is that reading widely creates the feeling of the circle without the substance.</p></div><div class=\"ms-section\"><h3>Connections</h3><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"0\"><strong>First Principles</strong></a> — first principles reasoning requires you to know which of your foundations are actually solid. Outside your circle, you cannot reliably identify first principles.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"57\"><strong>Dunning-Kruger</strong></a> — the psychological mechanism that makes circle self-assessment hard; understanding one reinforces the other.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"7\"><strong>Probabilistic Thinking</strong></a> — within your circle, probability estimates are more reliable. Outside it, confidence intervals should widen dramatically.</p></div><div class=\"ms-section\"><h3>References</h3><p>Developed and named by Warren Buffett and Charlie Munger in Berkshire Hathaway shareholder letters, beginning in the early 1990s.</p><ul><li><em>The Essays of Warren Buffett</em> — Warren Buffett, ed. Lawrence Cunningham (1997)</li><li><em>Poor Charlie's Almanack</em> — Charlie Munger, ed. Peter Kaufman (2005)</li></ul></div>","file":"01-General-Thinking/circle-of-competence.md","searchText":"circle of competence know the edge of what you know the circle of competence is the domain within which a person has genuine, earned knowledge — understanding not just of the facts but of the failure modes, the edge cases, and the nuance that only comes from direct experience and study. the concept, articulated by warren buffett a"},{"id":122,"name":"Cynefin Framework","tagline":"","category":"General Thinking","color":"#3B82F6","preview":"The Cynefin Framework (Welsh: \"habitat\") is a sense-making model developed by Dave Snowden at IBM in 1999 that categorises problems by the nature of cause-and-effect relationships:","modal":"<div class=\"ms-section\"><h3>Definition</h3><p>The Cynefin Framework (Welsh: &quot;habitat&quot;) is a sense-making model developed by Dave Snowden at IBM in 1999 that categorises problems by the nature of cause-and-effect relationships:</p>\n<br>\n<p>- <strong>Clear</strong> — cause and effect are obvious; apply best practice<br>\n- <strong>Complicated</strong> — cause and effect require expertise; analyse then apply good practice<br>\n- <strong>Complex</strong> — cause and effect only visible in retrospect; probe → sense → respond<br>\n- <strong>Chaotic</strong> — no perceivable relationship; act first to stabilise, then sense</p>\n<br>\n<p>The framework's power is prescriptive: applying a Complicated-domain method to a Complex-domain problem is not just inefficient — it is structurally wrong.</p></div><div class=\"ms-section\"><h3>Mental Model</h3><p>The key distinction is <strong>Complicated vs. Complex</strong>. A complicated problem has many parts but a correct answer an expert can find (sending a rocket to the moon). A complex problem has emergent behaviour that cannot be predicted in advance — the answer cannot be known before you try because the trying itself changes the system.</p>\n<br>\n<p><strong>The danger zone:</strong> the cliff between Clear and Chaotic. Over-confidence in established best practice can cause a Clear situation to tip suddenly into Chaos when conditions change.</p></div><div class=\"ms-section\"><h3>Connections</h3></div><div class=\"ms-section\"><h3>References</h3><p><strong>Originator:</strong> Dave Snowden, IBM Global Services, 1999.</p>\n<br>\n<p>- <em>&quot;A Leader's Framework for Decision Making&quot;</em> — Dave Snowden &amp; Mary Boone, Harvard Business Review, 2007<br>\n- <em>Cynefin: Weaving Sense-Making into the Fabric of Our World</em> — Dave Snowden et al., 2020<br>\n- <em>The Fifth Discipline</em> — Peter Senge, 1990</p></div>","file":"01-General-Thinking/cynefin-framework.md","searchText":"cynefin framework  the cynefin framework (welsh: \"habitat\") is a sense-making model developed by dave snowden at ibm in 1999 that categorises problems by the nature of cause-and-effect relationships:"},{"id":13,"name":"De Bono's Six Thinking Hats","tagline":"Separate modes of thinking to think better together","category":"General Thinking","color":"#3B82F6","preview":"Edward de Bono's Six Thinking Hats is a parallel thinking framework that separates different modes of thinking into six distinct \"hats\" — each representing a single thinking mode that the group adopts simultaneously. White Hat: facts and data only. Red Hat: emotions and intuition","modal":"<div class=\"ms-section\"><h3>Definition</h3><p>Edward de Bono's Six Thinking Hats is a parallel thinking framework that separates different modes of thinking into six distinct &quot;hats&quot; — each representing a single thinking mode that the group adopts simultaneously. White Hat: facts and data only. Red Hat: emotions and intuitions, no justification required. Black Hat: caution, risks, why it won't work. Yellow Hat: optimism, benefits, why it will work. Green Hat: creative alternatives and new possibilities. Blue Hat: process meta-cognition, managing the thinking itself. By wearing one hat at a time, groups escape the adversarial dynamic of debate (where individuals defend positions) and enable parallel thinking (where everyone explores the same dimension together).</p></div><div class=\"ms-section\"><h3>Mental Model</h3><p>In conventional debate, different people are metaphorically wearing different hats simultaneously — one person is being cautious (Black), another is enthusiastic (Yellow), another is proposing alternatives (Green) — and they are arguing against each other. The Six Hats reframes this: everyone wears the same hat at the same time, exploring each dimension collectively. The intellectual richness comes from each hat's perspective; the efficiency comes from the elimination of ego-defense dynamics.</p></div><div class=\"ms-section\"><h3>Practitioner Heuristics</h3><ul>\n<li><strong>Use it when group thinking is getting stuck in adversarial loops.</strong> The Six Hats are most valuable not as a routine meeting tool but as an intervention when a discussion has become polarized or when one hat is dominating at the expense of others.</li>\n<li><strong>Protect the Red Hat.</strong> The most underused in professional contexts: giving explicit permission to name emotions and intuitions without justification. &quot;I have a bad feeling about this&quot; is a valuable signal; the Red Hat provides the space to surface it without requiring rationalization.</li>\n<li><strong>Use Black Hat and Yellow Hat together.</strong> Running risk analysis (Black) without benefit analysis (Yellow) produces paralysis; running benefit analysis without risk analysis produces naivety. Pair them in sequence.</li>\n<li><strong>The Blue Hat is leadership's hat.</strong> Managing which hat the group is wearing, for how long, and in what sequence is a facilitation function. Naming the current hat and the intended sequence improves meeting quality significantly.</li>\n<li><strong>Short hat sessions are most productive.</strong> Three to five minutes in each hat is often sufficient to extract the most useful thinking. Longer sessions encourage repetition rather than depth.</li>\n</ul></div><div class=\"ms-section\"><h3>Common Failure Modes</h3><ul>\n<li><strong>Treating it as a checklist.</strong> Running through all six hats because it's the process, rather than selecting the hats most relevant to the decision. Not every decision needs all six.</li>\n<li><strong>Black Hat dominance in conservative cultures.</strong> In organizations that reward caution, the Black Hat discussion absorbs most of the meeting time, and Yellow, Red, and Green are rushed. The facilitator must actively protect the other hats.</li>\n<li><strong>Conflating hats.</strong> Slipping from Yellow (benefits) into advocacy (argue for the option) or from Black (caution) into the Red (emotional opposition). Remind participants of each hat's specific mode.</li>\n</ul></div><div class=\"ms-section\"><h3>Worked Example</h3><p>A leadership team is deciding whether to acquire a competitor. The discussion has become heated — one camp strongly in favor, one strongly opposed, both talking past each other. A facilitator introduces the Six Hats. White: what do we factually know about their financials, customer base, and technology? (15 minutes) Red: what are our honest gut reactions? (5 minutes, undefended) Yellow: what is the best case? (10 minutes) Black: what are the specific risks? (10 minutes) Green: are there alternative deal structures we haven't considered? (10 minutes) Blue: given all this, what are our next steps? (5 minutes). The same information that was generating conflict in debate mode produces a much richer analysis in parallel thinking mode. The acquisition thesis is refined (not abandoned or approved) based on the structured exploration.</p></div><div class=\"ms-section\"><h3>Connections</h3><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"55\"><strong>Confirmation Bias</strong></a> — the Six Hats is a structural mitigation: it enforces exploration of all perspectives, including the one that conflicts with your prior belief.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"10\"><strong>Pre-mortem</strong></a> — the Black Hat is the group thinking equivalent of the pre-mortem: explicitly exploring failure modes.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"91\"><strong>Framing</strong></a> — different hats are different frames; the Six Hats is a systematic multi-framing tool.</p></div><div class=\"ms-section\"><h3>References</h3><p>Created by Edward de Bono and introduced in his 1985 book. De Bono also originated the concept of lateral thinking.</p><ul><li><em>Six Thinking Hats</em> — Edward de Bono (1985)</li><li><em>Lateral Thinking</em> — Edward de Bono (1970)</li></ul></div>","file":"01-General-Thinking/de-bonos-six-thinking-hats.md","searchText":"de bono's six thinking hats separate modes of thinking to think better together edward de bono's six thinking hats is a parallel thinking framework that separates different modes of thinking into six distinct \"hats\" — each representing a single thinking mode that the group adopts simultaneously. white hat: facts and data only. red hat: emotions and intuition"},{"id":107,"name":"Divergent and Convergent Thinking","tagline":"The two fundamental cognitive modes of innovation — generating many varied possibilities without judgment, then evaluating and selecting among them — which must be applied in sequence, not simultaneously.","category":"General Thinking","color":"#3B82F6","preview":"Divergent thinking is the cognitive mode of generating many varied, unconventional possibilities without evaluation or judgment — expanding the solution space as broadly as possible. Convergent thinking is the cognitive mode of evaluating, filtering, and selecting among possibili","modal":"<div class=\"ms-section\"><h3>Definition</h3><p>Divergent thinking is the cognitive mode of generating many varied, unconventional possibilities without evaluation or judgment — expanding the solution space as broadly as possible. Convergent thinking is the cognitive mode of evaluating, filtering, and selecting among possibilities — narrowing toward the best solution. Both are essential to creative problem-solving and innovation; neither alone is sufficient. The critical insight, established by Alex Osborn and formalized in subsequent creativity research, is that the two modes are cognitively incompatible: attempting to evaluate while generating suppresses the unconventional ideas that most need protection in their early, fragile state. Effective innovation requires not just possessing both modes but applying them in the right sequence with a deliberate separation between them.</p></div><div class=\"ms-section\"><h3>Mental Model</h3><p>An experienced practitioner treats divergent and convergent phases as distinct activities requiring different protocols, mindsets, and often different people. In the divergent phase, judgment is suspended not because bad ideas are welcome but because the cost of killing a good unconventional idea early vastly exceeds the cost of reviewing one more bad idea later. The most valuable ideas are often the ones that first appear implausible — they are unconventional by definition, and evaluation-during-generation kills them before they can be developed. In the convergent phase, the logic reverses: disciplined criteria matter, evaluation is rigorous, and the goal is to identify what is genuinely best rather than what is merely comfortable. The failure mode that organizations most commonly exhibit is not failing to generate ideas, but applying convergent judgment in divergent settings — meetings where seniority, politics, or social discomfort silently eliminates unconventional options before they can be properly considered. The result is a search that looks thorough but explores only a small fraction of the available space. The practitioner's skill is in diagnosing which mode is needed at any moment and enforcing the protocol that protects it.</p></div><div class=\"ms-section\"><h3>Practitioner Heuristics</h3><ul>\n<li><strong>Declare the mode explicitly before any creative session.</strong> &quot;We are in divergent mode for the next 30 minutes — no evaluation, quantity over quality, the wilder the better&quot; removes ambiguity and gives social permission to generate unconventionally.</li>\n<li><strong>In divergent phase, enforce quantity targets, not quality targets.</strong> Ask for 30 ideas, not good ideas. Quantity produces variety; variety produces the outliers that become innovations. Quality filtering happens in convergent phase.</li>\n<li><strong>Physically or temporally separate the two phases.</strong> The same people, in the same meeting, rarely switch modes cleanly. Separate sessions, separate facilitators, or a significant break between phases produces better results than trying to toggle within a single meeting.</li>\n<li><strong>In convergent phase, evaluate against explicit criteria — not gut reaction.</strong> Gut reaction in convergent mode is often social preference in disguise. Defining criteria before seeing the options removes the availability of post-hoc rationalization.</li>\n<li><strong>Protect outliers through the first convergent pass.</strong> The most unconventional ideas should receive additional scrutiny before elimination, not less — because their value is hardest to see initially and their loss is the most irreversible.</li>\n</ul></div><div class=\"ms-section\"><h3>Common Failure Modes</h3><ul>\n<li><strong>Premature convergence — the dominant failure.</strong> Evaluation begins during generation, either explicitly (&quot;that won't work because...&quot;) or implicitly (people self-censor before speaking). The result is a solution space that looks large but is actually constrained to socially acceptable, conventionally plausible options.</li>\n<li><strong>Mistaking activity for divergence.</strong> Running a brainstorming session that generates 20 variations on the same basic idea. True divergent thinking produces variety across fundamentally different solution types, not incremental variations on one approach.</li>\n<li><strong>Applying divergent mindset to convergent decisions.</strong> Continuing to generate options when a decision must be made. Perpetual divergence produces paralysis and signals a failure of ownership.</li>\n<li><strong>Using consensus as the convergent mechanism.</strong> Convergence by group agreement tends to select the least-threatening option rather than the best option. Criteria-based convergence with a decision-maker produces better outcomes than convergence by committee.</li>\n<li><strong>Treating the first good idea as the convergent answer.</strong> Stopping the divergent phase when one promising idea appears, rather than completing the generation process and selecting from the full set.</li>\n</ul></div><div class=\"ms-section\"><h3>Worked Example</h3><p>Pixar's story development process is one of the most documented and successful applications of separated divergent and convergent thinking in practice. Their &quot;Braintrust&quot; sessions — attended by all senior creative directors — operate on an explicit divergent protocol: feedback is candid and specific, no idea is protected by seniority, and the director is not required to implement any suggestion. This creates genuine divergent safety. The convergent phase is entirely separate: the director processes the session offline and decides what to incorporate, using their own judgment and criteria. The separation is structural and non-negotiable. The result is that unconventional feedback reaches the director intact rather than filtered by social dynamics, and the director retains accountability for the converged decision. Pixar's consistent creative output over 25 years is in part a product of this protocol discipline.</p></div><div class=\"ms-section\"><h3>Connections</h3><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"110\"><strong>Design Thinking</strong></a> — the empathize-define-ideate-prototype-test process is built on alternating divergent (ideation) and convergent (prototyping, testing) phases; divergent/convergent thinking is the underlying cognitive model.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"13\"><strong>De Bono's Six Thinking Hats</strong></a> — the Six Hats method is a structured protocol for producing cognitive mode separation in a group setting, preventing the contamination of divergent by convergent thinking.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"106\"><strong>Analogical Reasoning</strong></a> — analogical reasoning is the most powerful technique for producing genuine divergence: importing solutions from distant domains breaks the attractor of conventional thinking.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"55\"><strong>Confirmation Bias</strong></a> — confirmation bias is the convergent mode applied where divergent mode is needed: the mind searches for confirmations rather than alternatives, collapsing the solution space prematurely.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"1\"><strong>Inversion</strong></a> — inversion is a structured divergent technique: it forces the generation of non-obvious possibilities by approaching the problem from the opposite direction.</p></div><div class=\"ms-section\"><h3>References</h3><p>Divergent thinking was identified and named by J.P. Guilford in his 1956 presidential address to the American Psychological Association. Convergent thinking as the complementary mode was developed in creativity research by Guilford and later by Edward de Bono.</p><ul><li><em>The Creative Mind: Myths and Mechanisms</em> — Margaret A. Boden (2004)</li><li><em>A Whack on the Side of the Head</em> — Roger von Oech (1983)</li></ul></div>","file":"01-General-Thinking/divergent-and-convergent-thinking.md","searchText":"divergent and convergent thinking the two fundamental cognitive modes of innovation — generating many varied possibilities without judgment, then evaluating and selecting among them — which must be applied in sequence, not simultaneously. divergent thinking is the cognitive mode of generating many varied, unconventional possibilities without evaluation or judgment — expanding the solution space as broadly as possible. convergent thinking is the cognitive mode of evaluating, filtering, and selecting among possibili"},{"id":0,"name":"First Principles","tagline":"Strip to fundamentals","category":"General Thinking","color":"#3B82F6","preview":"First principles thinking is the practice of breaking a problem down to its most basic, irreducible truths — the things you know to be true from evidence or logic — and then reasoning upward from there rather than from analogy, convention, or received wisdom. The phrase comes fro","modal":"<div class=\"ms-section\"><h3>Definition</h3><p>First principles thinking is the practice of breaking a problem down to its most basic, irreducible truths — the things you know to be true from evidence or logic — and then reasoning upward from there rather than from analogy, convention, or received wisdom. The phrase comes from Aristotle (&quot;the first basis from which a thing is known&quot;) and was popularized in modern practice by physicists and engineers who needed to escape the gravitational pull of industry assumptions.</p>\n<br>\n<p>The distinction that matters: reasoning by analogy asks &quot;what have people done before in situations like this?&quot; Reasoning from first principles asks &quot;what is actually true here, and what follows from that?&quot; The former is fast and usually good enough; the latter is expensive but occasionally reveals that everyone else has been building on a false premise.</p></div><div class=\"ms-section\"><h3>Mental Model</h3><p>Think of knowledge as a tree. Most people work with the leaves and branches — the conclusions, rules of thumb, and inherited practices at the edges. First principles thinking forces you to the trunk and roots: the load-bearing facts. When a branch breaks, people who only know branches are stuck. People who know the roots can regrow.</p>\n<br>\n<p>The practitioner's internal question is: <em>&quot;What would I believe about this if I had never seen anyone else's solution?&quot;</em></p></div><div class=\"ms-section\"><h3>Practitioner Heuristics</h3><ul>\n<li><strong>Ask &quot;why&quot; five times, then ask &quot;is that actually true?&quot;</strong> Each &quot;why&quot; peels a layer of assumption; the final question tests whether the foundation holds.</li>\n<li><strong>Separate physics from policy.</strong> Physical constraints (energy required, time to manufacture, information bandwidth) are first principles. Pricing norms, organizational structures, and industry practices are not — they are historical accidents masquerading as constraints.</li>\n<li><strong>List your assumptions explicitly before you reason.</strong> You cannot strip assumptions you haven't named. Write them down. Mark each one: <em>known fact</em>, <em>reasonable belief</em>, or <em>untested assumption</em>.</li>\n<li><strong>Rebuild from scratch on paper before touching reality.</strong> The point is to check whether the current solution is actually the best available, not immediately to act on that check.</li>\n<li><strong>Use it selectively.</strong> First principles thinking is expensive. Reserve it for problems where the stakes are high, the current approach is visibly failing, or you suspect a hidden assumption is load-bearing.</li>\n</ul></div><div class=\"ms-section\"><h3>Common Failure Modes</h3><ul>\n<li><strong>Reinventing the wheel badly.</strong> Discarding convention entirely, you rebuild something worse because convention embedded genuine accumulated wisdom you didn't notice. The fix: after reasoning from first principles, check your conclusion against what experienced practitioners know and account for the discrepancy.</li>\n<li><strong>False bedrock.</strong> Calling something a first principle when it is actually a belief. &quot;Customers want the cheapest option&quot; feels foundational but is an empirical claim requiring evidence.</li>\n<li><strong>Analysis paralysis.</strong> First principles reasoning can consume enormous time. Practitioners set a time-box: if you haven't found a materially better answer within the budget, ship the conventional solution.</li>\n</ul></div><div class=\"ms-section\"><h3>Worked Example</h3><p>SpaceX's origin story is the canonical case. Elon Musk wanted to buy rockets and found they cost $65M each. Instead of accepting that price as a constraint, he asked: what is a rocket actually made of? Aerospace-grade aluminium alloys, titanium, copper, carbon fiber. He priced the raw materials: roughly 2% of the finished rocket's cost. The gap between raw material cost and purchase price revealed that the constraint was not physics but manufacturing process and supply chain. This observation made vertical integration and reusable rockets conceivable in a way they would not have been had he accepted the $65M as a natural law.</p></div><div class=\"ms-section\"><h3>Connections</h3><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"1\"><strong>Inversion</strong></a> — first principles tells you what should be true; inversion tells you what would have to be true for the current answer to be wrong. Run both together.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"6\"><strong>Map-Territory</strong></a> — first principles is a method for cleaning the map. If your map contains inherited assumptions, it may not reflect the territory.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"5\"><strong>Circle of Competence</strong></a> — first principles reasoning in domains where you lack deep knowledge risks confident wrongness. Know where your bedrock is actually solid.</p></div><div class=\"ms-section\"><h3>References</h3><p>Attributed to Aristotle, who described first principles as the foundational axioms from which knowledge is derived. René Descartes systematized the method in philosophy; it was reinvigorated in engineering practice by figures such as Richard Feynman.</p><ul><li><em>Discourse on the Method</em> — René Descartes (1637)</li><li><em>The Feynman Lectures on Physics</em> — Richard P. Feynman, Robert B. Leighton & Matthew Sands (1963)</li><li><em>Poor Charlie's Almanack</em> — Charlie Munger, ed. Peter Kaufman (2005)</li></ul></div>","file":"01-General-Thinking/first-principles.md","searchText":"first principles strip to fundamentals first principles thinking is the practice of breaking a problem down to its most basic, irreducible truths — the things you know to be true from evidence or logic — and then reasoning upward from there rather than from analogy, convention, or received wisdom. the phrase comes fro"},{"id":4,"name":"Hanlon's Razor","tagline":"Attribute to incompetence before malice","category":"General Thinking","color":"#3B82F6","preview":"Hanlon's Razor: \"Never attribute to malice that which is adequately explained by stupidity.\" The practical version for organizational life softens \"stupidity\" to incompetence, miscommunication, or simple oversight. The razor is a guide for default attribution: when something goes","modal":"<div class=\"ms-section\"><h3>Definition</h3><p>Hanlon's Razor: <em>&quot;Never attribute to malice that which is adequately explained by stupidity.&quot;</em> The practical version for organizational life softens &quot;stupidity&quot; to incompetence, miscommunication, or simple oversight. The razor is a guide for default attribution: when something goes wrong and you don't know why, assume the most generous explanation consistent with the evidence before assuming intentional harm.</p>\n<br>\n<p>This is not naivety. It is a calibration tool. Malicious acts are rarer than incompetent or poorly-communicated ones; assuming malice by default produces false positives at high cost (destroyed relationships, misallocated energy, escalating conflict).</p></div><div class=\"ms-section\"><h3>Mental Model</h3><p>Imagine a spectrum from &quot;pure accident&quot; to &quot;pure malice.&quot; Human behavior clusters heavily at the accident/incompetence end and sparsely at the malice end, even in organizations with genuine misaligned incentives. Hanlon's Razor says: start at the left of the spectrum and require evidence to move right. The practitioner's discipline is to separate the question &quot;what caused this outcome?&quot; from the question &quot;how do I feel about the person involved?&quot;</p></div><div class=\"ms-section\"><h3>Practitioner Heuristics</h3><ul>\n<li><strong>Before escalating, ask: what is the most charitable explanation that fits all the facts?</strong> If it is &quot;they didn't know,&quot; address the information gap. If it is &quot;they forgot,&quot; build a process. Only if neither applies should you look for intent.</li>\n<li><strong>Treat &quot;they didn't tell me&quot; as a communication failure, not a cover-up.</strong> Most information asymmetries in organizations are structural, not deliberate.</li>\n<li><strong>Malice requires motive, means, and opportunity.</strong> Ask whether all three are genuinely present before concluding it.</li>\n<li><strong>Apply asymmetrically to yourself.</strong> You will naturally apply Hanlon's Razor to your own mistakes. Apply it equally to others.</li>\n<li><strong>When malice is confirmed, act decisively.</strong> Hanlon's Razor is a prior; strong evidence should update it. If the evidence actually points to intentional harm, don't hide behind the razor to avoid the discomfort of acting.</li>\n</ul></div><div class=\"ms-section\"><h3>Common Failure Modes</h3><ul>\n<li><strong>Weaponized charity.</strong> Repeatedly applying Hanlon's Razor to the same person despite a pattern of outcomes that require increasingly implausible incompetence explanations. At some point, systematic &quot;incompetence&quot; that always benefits one party is indistinguishable from intent.</li>\n<li><strong>Conflating the model with the response.</strong> Even if an outcome was caused by incompetence, not malice, you still need to address the incompetence. Hanlon's Razor affects attribution, not action.</li>\n<li><strong>Cultural blind spot.</strong> In some organizational cultures, assigning incompetence is actually more face-threatening than assigning malice. The razor needs to be calibrated for cultural context.</li>\n</ul></div><div class=\"ms-section\"><h3>Worked Example</h3><p>A senior engineer's code change ships without going through code review, breaking a critical integration. The instinctive read: they bypassed the process deliberately. Hanlon's Razor says: check first — did they know about the required review step? Did the CI gate fail silently? Was there a miscommunication about exceptions during the crunch period? In most real cases, one of these explanations holds. The response is then process-hardening, not disciplinary action. If investigation reveals the review was consciously bypassed despite being known policy, the evidence has moved you rightward on the spectrum and different action is warranted.</p></div><div class=\"ms-section\"><h3>Connections</h3><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"51\"><strong>Incentives</strong></a> — when trying to determine if an act was malicious, always map incentives first. Malice requires motive; misaligned incentives are the most common source of motive.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"55\"><strong>Confirmation Bias</strong></a> — once you decide someone acted with bad intent, you interpret subsequent ambiguous evidence as confirming it. Hanlon's Razor interrupts this.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"5\"><strong>Circle of Competence</strong></a> — your ability to distinguish malice from incompetence depends on how well you understand the domain. Misunderstanding technical complexity leads to false accusations of deliberate obfuscation.</p></div><div class=\"ms-section\"><h3>References</h3><p>Named after Robert J. Hanlon, who submitted the aphorism to a 1980 joke book. Variant forms appear in writings attributed to Napoleon Bonaparte and Johann Wolfgang von Goethe.</p><ul><li><em>The Art of Thinking Clearly</em> — Rolf Dobelli (2011)</li><li><em>Thinking, Fast and Slow</em> — Daniel Kahneman (2011)</li></ul></div>","file":"01-General-Thinking/hanlons-razor.md","searchText":"hanlon's razor attribute to incompetence before malice hanlon's razor: \"never attribute to malice that which is adequately explained by stupidity.\" the practical version for organizational life softens \"stupidity\" to incompetence, miscommunication, or simple oversight. the razor is a guide for default attribution: when something goes"},{"id":1,"name":"Inversion","tagline":"Flip the question","category":"General Thinking","color":"#3B82F6","preview":"Inversion is the practice of approaching a problem backwards — instead of asking \"how do I achieve X?\", asking \"what would guarantee I fail to achieve X, and how do I avoid that?\" The mathematician Carl Jacobi's instruction was \"invert, always invert\". Charlie Munger made it a ce","modal":"<div class=\"ms-section\"><h3>Definition</h3><p>Inversion is the practice of approaching a problem backwards — instead of asking &quot;how do I achieve X?&quot;, asking &quot;what would guarantee I fail to achieve X, and how do I avoid that?&quot; The mathematician Carl Jacobi's instruction was <em>&quot;invert, always invert&quot;</em>. Charlie Munger made it a central pillar of his thinking: to know how to build a happy life, first study what makes lives miserable and avoid those things.</p>\n<br>\n<p>Inversion doesn't replace forward thinking; it runs alongside it as a sanity check and a generator of non-obvious constraints.</p></div><div class=\"ms-section\"><h3>Mental Model</h3><p>The human mind is better at identifying failure than designing success — we have more experience with things breaking than with things working perfectly. Inversion exploits this asymmetry. By vividly imagining the worst outcome, you activate a different and often more rigorous mode of thinking. The practitioner holds two questions simultaneously: <em>&quot;What gets me there?&quot;</em> and <em>&quot;What definitely doesn't get me there?&quot;</em> The intersection is often the most actionable space.</p></div><div class=\"ms-section\"><h3>Practitioner Heuristics</h3><ul>\n<li><strong>Pre-mortem before launch.</strong> Before committing to a plan, imagine it is 12 months later and the project has failed catastrophically. Write the obituary. What killed it? Work backward to present-day preventable causes.</li>\n<li><strong>List the conditions for guaranteed failure, then treat them as hard constraints.</strong> If hiring the wrong person in the first key role would guarantee failure, then the hiring process becomes non-negotiable rather than optimisable.</li>\n<li><strong>Invert your goals, not just your plans.</strong> &quot;What would make this customer never buy from us again?&quot; is often more actionable than &quot;what would make them love us?&quot;</li>\n<li><strong>Use inversion to test robustness.</strong> If a plan only works when everything goes right, it isn't a plan — it's a hope. A good plan survives its own inversion: the failure modes are known and mitigated.</li>\n<li><strong>Apply to your own reasoning.</strong> &quot;What would have to be true for my current belief to be wrong?&quot; is the most uncomfortable and valuable form of inversion.</li>\n</ul></div><div class=\"ms-section\"><h3>Common Failure Modes</h3><ul>\n<li><strong>Stopping at identification.</strong> Listing failure modes without converting them into actionable mitigations. The pre-mortem becomes a ritual rather than a tool.</li>\n<li><strong>Negative framing bias.</strong> Inversion-heavy thinkers can become professionally pessimistic, always finding reasons not to act. Balance with explicit forward reasoning: after inverting, ask &quot;given this list of failure modes, what is the plan?&quot;</li>\n<li><strong>Trivial inversions.</strong> Asking &quot;how do I not fail?&quot; and generating only obvious answers (don't run out of money, don't lose key staff). Push past the obvious to second- and third-order failure conditions.</li>\n</ul></div><div class=\"ms-section\"><h3>Worked Example</h3><p>A team is designing a new onboarding flow for a SaaS product. Forward thinking generates ideas for what to include. Inversion reframes: &quot;What would guarantee a new user gives up within five minutes?&quot; Answers: confusion about what the product does, no clear first action, too many fields before any value is delivered, error messages with no guidance. Each item on the failure list becomes a design constraint. The resulting flow is often simpler and more robust than one designed purely by addition.</p></div><div class=\"ms-section\"><h3>Connections</h3><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"2\"><strong>Second-order Effects</strong></a> — inversion exposes first-order failure; second-order thinking asks what happens after the failure cascades.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"55\"><strong>Confirmation Bias</strong></a> — inversion is the structural antidote to confirmation bias: you are explicitly seeking disconfirmation.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"24\"><strong>Margin of Safety</strong></a> — inversion identifies what can go wrong; margin of safety quantifies how much buffer to hold against it.</p></div><div class=\"ms-section\"><h3>References</h3><p>Formalized as a mathematical strategy by Carl Jacobi (19th century), who advised \"man muss immer umkehren\" (always invert). Popularized as a general thinking tool by Charlie Munger.</p><ul><li><em>Poor Charlie's Almanack</em> — Charlie Munger, ed. Peter Kaufman (2005)</li><li><em>The Art of Thinking Clearly</em> — Rolf Dobelli (2011)</li></ul></div>","file":"01-General-Thinking/inversion.md","searchText":"inversion flip the question inversion is the practice of approaching a problem backwards — instead of asking \"how do i achieve x?\", asking \"what would guarantee i fail to achieve x, and how do i avoid that?\" the mathematician carl jacobi's instruction was \"invert, always invert\". charlie munger made it a ce"},{"id":14,"name":"Ladder of Inference","tagline":"Understand the gap between data and belief","category":"General Thinking","color":"#3B82F6","preview":"The Ladder of Inference, developed by Chris Argyris and popularized by Peter Senge in The Fifth Discipline, describes the mental steps between observable data and action. The rungs, from bottom to top: (1) Observable data and experiences; (2) Selected data (we filter what we noti","modal":"<div class=\"ms-section\"><h3>Definition</h3><p>The Ladder of Inference, developed by Chris Argyris and popularized by Peter Senge in <em>The Fifth Discipline</em>, describes the mental steps between observable data and action. The rungs, from bottom to top: (1) Observable data and experiences; (2) Selected data (we filter what we notice); (3) Interpreted data (we attach meaning); (4) Assumptions (we apply our assumptions); (5) Conclusions; (6) Beliefs (which become our mental models); (7) Actions (we take actions based on beliefs). The core insight: people routinely act on beliefs that are the result of a long chain of selection, interpretation, and assumption — and they are unaware of most of the chain. Misunderstandings, conflicts, and poor decisions often occur because two people are on very different rungs arguing as if they are both looking at the same data.</p></div><div class=\"ms-section\"><h3>Mental Model</h3><p>The ladder explains why smart people looking at the same situation reach opposite conclusions: they have climbed different ladders. Each rung is an inference — a mental step that is invisible to the person making it but determines everything above it. The practitioner's discipline is to &quot;walk back down the ladder&quot; — both in their own thinking and in dialog with others — to identify where the divergence began and whether the selection, interpretation, or assumption at that rung is well-founded.</p></div><div class=\"ms-section\"><h3>Practitioner Heuristics</h3><ul>\n<li><strong>When in conflict, go back to the data.</strong> &quot;What specifically did you observe?&quot; forces the conversation back to the bottom rung, where the gap between perspectives is most likely to be identified. Most conflicts that feel like value disagreements are actually disagreements about data selection or interpretation.</li>\n<li><strong>Name the rung you're on.</strong> &quot;I'm stating a belief here, not a fact&quot; or &quot;this is my interpretation, not what was said&quot; builds cognitive clarity and models epistemic humility for others.</li>\n<li><strong>Challenge your own selection filters.</strong> What data have you been noticing, and what have you been ignoring? The selection at rung 2 is often the most consequential and the least visible.</li>\n<li><strong>Ask &quot;what would I have to believe at each rung for this conclusion to be valid?&quot;</strong> Tracing the ladder upward from a specific conclusion reveals the assumptions at each rung that must be true. Challenging those assumptions challenges the conclusion.</li>\n<li><strong>Use in facilitated conversations.</strong> When a team is stuck in a conflict, a facilitator who walks both parties back down their respective ladders to observable data often reveals that the disagreement is about an inference made early in the chain, not about values or facts.</li>\n</ul></div><div class=\"ms-section\"><h3>Common Failure Modes</h3><ul>\n<li><strong>Reflexive loops.</strong> Beliefs at the top of the ladder influence what data we select at the bottom — confirmation bias is the reflexive loop of the ladder. The belief reinforces itself by selecting confirming data. This is the deepest failure mode and the hardest to interrupt.</li>\n<li><strong>Treating conclusions as data.</strong> Presenting conclusions (rung 5) or beliefs (rung 6) as if they were observations (rung 1). When this occurs, the chain of inference is hidden and cannot be examined.</li>\n<li><strong>Ladder-walking as delay tactic.</strong> In fast-moving operational contexts, going back to data for every disagreement is impractical. Know when the ladder analysis is worth the time investment (high-stakes, persistent conflict) vs. when to trust the inference and move on.</li>\n</ul></div><div class=\"ms-section\"><h3>Worked Example</h3><p>A manager concludes that an employee &quot;doesn't care about quality.&quot; Walking back down the ladder: (7) Action: the manager has been more closely supervizing this employee. (6) Belief: this employee doesn't care about quality. (5) Conclusion: this person will produce poor quality if not monitored. (4) Assumption: people who submit work without checking are careless about quality. (3) Interpretation: the employee submitted the report without re-reading it. (2) Selected data: the manager noticed errors in the last two reports. (1) Observable data: the last two reports had four formatting errors and one factual error. Walking back down reveals: the conclusion (&quot;doesn't care about quality&quot;) is an inference from two reports with specific types of errors — which could equally indicate unclear standards, a time-pressure spike, or a template problem. The managerial action (close supervision) addresses the conclusion; the actual data suggests a different intervention.</p></div><div class=\"ms-section\"><h3>Connections</h3><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"6\"><strong>Map-Territory</strong></a> — the ladder is a map of how maps (beliefs and conclusions) are built from territory (data). Errors in the climb produce maps that don't reflect territory.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"55\"><strong>Confirmation Bias</strong></a> — the reflexive loop of the ladder is confirmation bias operating structurally.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"9\"><strong>Socratic Thinking</strong></a> — Socratic questioning walks back down the ladder, questioning each inference.</p></div><div class=\"ms-section\"><h3>References</h3><p>Created by organizational theorist Chris Argyris in the 1970s; widely disseminated by Peter Senge, who included it in The Fifth Discipline.</p><ul><li><em>Overcoming Organizational Defenses</em> — Chris Argyris (1990)</li><li><em>The Fifth Discipline</em> — Peter M. Senge (1990)</li></ul></div>","file":"01-General-Thinking/ladder-of-inference.md","searchText":"ladder of inference understand the gap between data and belief the ladder of inference, developed by chris argyris and popularized by peter senge in the fifth discipline, describes the mental steps between observable data and action. the rungs, from bottom to top: (1) observable data and experiences; (2) selected data (we filter what we noti"},{"id":6,"name":"Map-Territory","tagline":"The model is not the reality","category":"General Thinking","color":"#3B82F6","preview":"The Map-Territory distinction, from Alfred Korzybski's 1931 formulation \"the map is not the territory,\" is the recognition that every model, framework, metric, belief, or mental representation is a simplified abstraction of reality — not reality itself. The map is useful precisel","modal":"<div class=\"ms-section\"><h3>Definition</h3><p>The Map-Territory distinction, from Alfred Korzybski's 1931 formulation <em>&quot;the map is not the territory,&quot;</em> is the recognition that every model, framework, metric, belief, or mental representation is a simplified abstraction of reality — not reality itself. The map is useful precisely because it simplifies; it becomes dangerous when we forget that it does so.</p>\n<br>\n<p>In practice: your financial model is not the business. The org chart is not how decisions actually get made. The customer persona is not the customer. The strategy deck is not the strategy. All of these are maps — useful approximations that omit details and introduce distortions.</p></div><div class=\"ms-section\"><h3>Mental Model</h3><p>A map has two types of error: things it gets wrong about the territory, and things it doesn't show at all. The practitioner's discipline is to maintain awareness of both. When a decision depends on the map being accurate, ask explicitly: &quot;What is this map leaving out? Where is it most likely to be wrong?&quot; The more the map has been optimized for one purpose (a financial model for investor presentations, say), the more cautious you should be about using it for a different purpose (operational decision-making).</p></div><div class=\"ms-section\"><h3>Practitioner Heuristics</h3><ul>\n<li><strong>Name your maps explicitly.</strong> When you're reasoning from a model or framework, say so. &quot;According to our unit economics model...&quot; is more honest and more useful than stating the model's outputs as facts.</li>\n<li><strong>Triangulate with multiple maps.</strong> If two different models — a bottoms-up and a tops-down revenue forecast — produce very different numbers, the gap is information. Investigate it rather than picking the one you prefer.</li>\n<li><strong>Ask &quot;what would I see in the territory if the map were wrong here?&quot;</strong> This converts map-awareness into an empirical check you can actually run.</li>\n<li><strong>Be suspicious of maps that are too tidy.</strong> Reality is messy. A model that fits perfectly may have been fitted to noise or may be omitting messy confounders.</li>\n<li><strong>Update maps aggressively.</strong> The value of a map comes from its accuracy. A map that hasn't been updated against the territory is actively misleading.</li>\n</ul></div><div class=\"ms-section\"><h3>Common Failure Modes</h3><ul>\n<li><strong>Metric fixation (Goodhart's Law).</strong> When a map measure (KPI, metric, score) becomes a target, people optimize for the measure rather than the underlying reality the measure was tracking. The map diverges from the territory.</li>\n<li><strong>Model lock-in.</strong> A model that was fit to past data may not reflect current territory. Organizations sometimes defend the model rather than updating it when reality diverges.</li>\n<li><strong>Confusing explanation for prediction.</strong> A model that explains past outcomes well may not predict future ones, especially if the territory has changed. Post-hoc explanatory models are particularly prone to this.</li>\n</ul></div><div class=\"ms-section\"><h3>Worked Example</h3><p>A retail chain builds an inventory optimization model that performs excellently in historical backtests and in the 18 months after deployment. Then a supply chain disruption creates conditions outside the model's training distribution. The model continues to recommend orders based on patterns that no longer hold. Managers who have internalized the model's outputs as &quot;the answer&quot; fail to override it until inventory is severely misallocated. The map (inventory model) had diverged significantly from the territory (actual supply/demand dynamics) and the team had stopped checking.</p></div><div class=\"ms-section\"><h3>Connections</h3><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"0\"><strong>First Principles</strong></a> — a method for building better maps from scratch.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"7\"><strong>Probabilistic Thinking</strong></a> — maps should carry explicit confidence levels; treating map outputs as certain is the core failure mode.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"19\"><strong>Emergence</strong></a> — emergent phenomena are definitionally hard to represent on maps because they arise from interactions the map does not capture.</p></div><div class=\"ms-section\"><h3>References</h3><p>Alfred Korzybski introduced the phrase \"the map is not the territory\" in a 1931 address to the American Mathematical Society, elaborated in his general semantics framework.</p><ul><li><em>Science and Sanity</em> — Alfred Korzybski (1933)</li><li><em>The Black Swan</em> — Nassim Nicholas Taleb (2007)</li></ul></div>","file":"01-General-Thinking/map-territory.md","searchText":"map-territory the model is not the reality the map-territory distinction, from alfred korzybski's 1931 formulation \"the map is not the territory,\" is the recognition that every model, framework, metric, belief, or mental representation is a simplified abstraction of reality — not reality itself. the map is useful precisel"},{"id":3,"name":"Occam's Razor","tagline":"Prefer simpler explanations","category":"General Thinking","color":"#3B82F6","preview":"Occam's Razor is the principle that, among competing explanations that fit the evidence equally well, the simpler one should be preferred. The medieval philosopher William of Ockham stated it as: \"entities should not be multiplied beyond necessity.\" It is not a claim that the wor","modal":"<div class=\"ms-section\"><h3>Definition</h3><p>Occam's Razor is the principle that, among competing explanations that fit the evidence equally well, the simpler one should be preferred. The medieval philosopher William of Ockham stated it as: <em>&quot;entities should not be multiplied beyond necessity.&quot;</em> It is not a claim that the world is simple — it is a decision rule about which hypothesis to work with in the absence of evidence that distinguishes them.</p>\n<br>\n<p>In practice, simplicity means fewer assumptions, fewer moving parts, and fewer special conditions that need to hold simultaneously for the explanation to be true.</p></div><div class=\"ms-section\"><h3>Mental Model</h3><p>Each additional assumption in an explanation is an additional point of failure. A theory with five independent assumptions is true only if all five hold; each assumption multiplies the uncertainty. Simple explanations have fewer attack surfaces. The practitioner's internal question is: <em>&quot;Have I added any explanatory component that is not doing actual work? What happens to the explanation if I remove it?&quot;</em></p></div><div class=\"ms-section\"><h3>Practitioner Heuristics</h3><ul>\n<li><strong>Count assumptions, not words.</strong> A long explanation can have few assumptions; a short one can have many hidden dependencies. Count the independent things that must be true.</li>\n<li><strong>&quot;What is the simplest explanation consistent with all the evidence?&quot;</strong> Not some of the evidence — all of it. Razor cuts excess but cannot ignore data.</li>\n<li><strong>Apply especially to your own motivated reasoning.</strong> Complex explanations most often appear when we are trying to explain away inconvenient evidence. The complexity is a tell.</li>\n<li><strong>Distinguish simplicity of explanation from simplicity of mechanism.</strong> The correct explanation of complex phenomena (DNA replication, market pricing) may be mechanistically intricate; what Occam requires is that you not add additional explanatory layers beyond what the evidence demands.</li>\n<li><strong>Use as a tiebreaker, not a trump card.</strong> If the simpler explanation fits the evidence 95% as well as the complex one, prefer the simpler. If the simpler one fits 60% as well, gather more evidence.</li>\n</ul></div><div class=\"ms-section\"><h3>Common Failure Modes</h3><ul>\n<li><strong>Einstein's misquote problem.</strong> &quot;Everything should be made as simple as possible, but not simpler.&quot; The failure mode is over-application: selecting an explanation that is so parsimonious it fails to account for genuine complexity in the data.</li>\n<li><strong>Confusing familiarity with simplicity.</strong> The explanation you've heard before feels simpler because it's familiar, not because it has fewer assumptions. Check the actual assumption count.</li>\n<li><strong>Using Razor to avoid investigation.</strong> &quot;The simple explanation is X, so I don't need to look further.&quot; Occam guides selection among explanations currently on the table; it does not eliminate the need to find better explanations.</li>\n</ul></div><div class=\"ms-section\"><h3>Worked Example</h3><p>A startup's north-star metric drops 15% over two weeks. The team generates three explanations: (1) a seasonal dip in user behavior, (2) a product change shipped on day one of the decline combined with a specific segment's particular sensitivity to that feature change, (3) a broader shift in competitive landscape causing users to explore alternatives. Occam's Razor says: test explanation 1 first — it requires only one assumption (seasonality exists) and is checkable against historical data. Only if seasonality doesn't account for the drop should you move to the two-assumption hypothesis, and so on.</p></div><div class=\"ms-section\"><h3>Connections</h3><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"0\"><strong>First Principles</strong></a> — both strip away unwarranted complexity; first principles rebuilds from the ground up, Occam prunes existing explanations.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"7\"><strong>Probabilistic Thinking</strong></a> — when explanations are roughly equally probable, Occam provides the tiebreaker.</p><p class=\"connection\">→ <a class=\"skill-link\" href=\"#\" data-id=\"55\"><strong>Confirmation Bias</strong></a> — complex explanations are often motivated; Occam is a check on that motivation.</p></div><div class=\"ms-section\"><h3>References</h3><p>William of Ockham (c. 1287–1347), English friar and logician. The principle — that entities should not be multiplied beyond necessity — was named and formalized in the 19th century.</p><ul><li><em>The Logic of Scientific Discovery</em> — Karl Popper (1934)</li><li><em>The Demon-Haunted World</em> — Carl Sagan (1996)</li></ul></div>","file":"01-General-Thinking/occams-razor.md","searchText":"occam's razor prefer simpler explanations occam's razor is the principle that, among competing explanations that fit the evidence equally well, the simpler one should be preferred. the medieval philosopher william of ockham stated it as: \"entities should not be multiplied beyond necessity.\" it is not a claim that the wor"},{"id":11,"name":"Post-mortem","tagline":"Learn structurally from what happened","category":"General Thinking","color":"#3B82F6","preview":"A post-mortem (also called an after-action review, retrospective, or incident review) is a structured examination of a completed project, incident, or period of work to extract learnable lessons. The goal is not to assign blame but to identify systemic causes — the conditions, de","modal":"<div class=\"ms-section\"><h3>Definition</h3><p>A post-mortem (also called an after-action review, retrospective, or incident review) is a structured examination of a completed project, incident, or period of work to extract learnable lessons. The goal is not to assign blame but to identify systemic causes — the conditions, decisions, and process failures that produced the outcome — and to convert those causes into improvements. Post-mortems done well are one of the highest-leverage learning investments available to teams and organizations.</p></div><div class=\"ms-section\"><h3>Mental Model</h3><p>Every outcome is an experiment whose results should update future behavior. Without post-mortems, experience produces familiarity but not learning — you have been through many situations, but you haven't analysed what produced them or what would have produced better outcomes. The post-mortem converts raw experience into structured knowledge. The practitioner's discipline: approach t
