<!DOCTYPE html>
<!-- Generated by scripts/build-situation-finder.mjs -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Situation Finder — Skills Framework</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0F172A;--surface:#1E293B;--surface2:#263245;--border:#334155;
  --text:#F1F5F9;--muted:#94A3B8;--accent:#3B82F6;--accent2:#60A5FA;
  --pill-bg:#334155;--pill-hover:#3B4F66;
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}

/* ── header ── */
header{background:var(--surface);border-bottom:1px solid var(--border);padding:.6rem 1.25rem;display:flex;align-items:center;gap:.9rem;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.logo{font-size:.8rem;font-weight:700;letter-spacing:.04em;color:var(--muted);white-space:nowrap}
.logo span{color:var(--text)}
#search{flex:1;min-width:200px;max-width:420px;padding:.4rem .8rem;background:var(--bg);border:1px solid var(--border);border-radius:999px;color:var(--text);font-size:.83rem;outline:none;transition:border-color .15s}
#search:focus{border-color:var(--accent)}
#search::placeholder{color:var(--muted)}
.nav-links{display:flex;gap:.5rem;margin-left:auto}
.nav-btn{font-size:.72rem;font-weight:600;color:var(--muted);text-decoration:none;padding:.28rem .7rem;border:1px solid var(--border);border-radius:999px;letter-spacing:.04em;transition:color .15s,border-color .15s;white-space:nowrap}
.nav-btn:hover{color:var(--text);border-color:var(--muted)}
.nav-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ── layout ── */
main{max-width:1200px;margin:0 auto;padding:1.5rem 1.25rem 3rem}
.intro{font-size:.82rem;color:var(--muted);margin-bottom:1.6rem;line-height:1.55;max-width:620px}
.intro strong{color:var(--text)}

/* ── sections ── */
.section{margin-bottom:2rem}
.section-label{font-size:.64rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:.75rem;padding-left:.1rem}

/* ── situation grid ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:.65rem}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.85rem 1rem;transition:border-color .15s}
.card:hover{border-color:#475569}
.card.hidden{display:none}
.situation{font-size:.82rem;font-weight:600;color:var(--text);margin-bottom:.6rem;line-height:1.4}
.skills{display:flex;flex-direction:column;gap:.35rem}

/* ── skill pills ── */
.pill{display:flex;flex-direction:column;padding:.42rem .65rem;background:var(--pill-bg);border-radius:7px;cursor:pointer;text-decoration:none;transition:background .12s,transform .1s;border:1px solid transparent}
.pill:hover{background:var(--pill-hover);border-color:var(--border);transform:translateX(2px)}
.pill-name{font-size:.77rem;font-weight:700;color:var(--accent2);line-height:1.2}
.pill-tag{font-size:.68rem;color:var(--muted);margin-top:.15rem;line-height:1.35}
.chain-pill{border-left:2px solid #B45309}
.chain-pill .pill-name{color:#FCD34D}

/* ── chain badge ── */
.chain-badge{font-size:.58rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:#B45309;color:#fff;border-radius:3px;padding:.06rem .3rem;margin-left:.35rem;vertical-align:middle}

/* ── empty state ── */
#empty{display:none;text-align:center;padding:3rem 1rem;color:var(--muted)}
#empty p{font-size:.85rem}

/* ── responsive ── */
@media(max-width:600px){
  .grid{grid-template-columns:1fr}
  .nav-links{display:none}
}
</style>
</head>
<body>

<header>
  <div class="logo"><span>Situation Finder</span> · Skills Framework</div>
  <input id="search" type="search" placeholder="Describe your situation…" autocomplete="off">
  <nav class="nav-links">
    <!--NAV--><!--/NAV-->
  </nav>
</header>

<main>
  <p class="intro">Describe what you're facing and the relevant skills appear. Or browse by situation below. <strong>Click any skill</strong> to open the full card.</p>

  <div id="sections"></div>
  <div id="empty"><p>No situations match — try different keywords, or <a href="deck.html" style="color:var(--accent)">search the full deck</a>.</p></div>
</main>

<script>
// ── Skill data ────────────────────────────────────────────────────────────────
// id, name, tagline (truncated for speed), chain flag
const S = (id, name, tag, chain) => ({id, name, tag, chain:!!chain});
const DECK = 'deck.html';
const link = s => s.chain ? `${DECK}?q=${encodeURIComponent(s.name)}` : `${DECK}?open=${s.id}`;

// ── Situation map ─────────────────────────────────────────────────────────────
const SECTIONS = __SITUATIONS_JSON__;

// ── Render ────────────────────────────────────────────────────────────────────
function buildSections(query) {
  const q = (query || '').toLowerCase().trim();
  const container = document.getElementById('sections');
  container.innerHTML = '';
  let anyVisible = false;

  SECTIONS.forEach(sec => {
    const matchingSits = sec.situations.filter(sit => {
      if (!q) return true;
      const haystack = (sit.label + ' ' + sit.q + ' ' + sit.skills.map(s => s.name + ' ' + s.tag).join(' ')).toLowerCase();
      return q.split(/\s+/).every(word => haystack.includes(word));
    });
    if (!matchingSits.length) return;
    anyVisible = true;

    const secEl = document.createElement('div');
    secEl.className = 'section';
    secEl.innerHTML = `<div class="section-label">${sec.label}</div>`;

    const grid = document.createElement('div');
    grid.className = 'grid';

    matchingSits.forEach(sit => {
      const card = document.createElement('div');
      card.className = 'card';

      const sitLabel = document.createElement('div');
      sitLabel.className = 'situation';
      sitLabel.textContent = sit.label;
      card.appendChild(sitLabel);

      const skillList = document.createElement('div');
      skillList.className = 'skills';
      sit.skills.forEach(sk => {
        const a = document.createElement('a');
        a.className = 'pill' + (sk.chain ? ' chain-pill' : '');
        a.href = link(sk);
        // For chains, open in same tab and search; for skills, open card directly
        a.innerHTML = `<span class="pill-name">${sk.name}${sk.chain ? '<span class="chain-badge">chain</span>' : ''}</span><span class="pill-tag">${sk.tag}</span>`;
        skillList.appendChild(a);
      });
      card.appendChild(skillList);
      grid.appendChild(card);
    });

    secEl.appendChild(grid);
    container.appendChild(secEl);
  });

  document.getElementById('empty').style.display = anyVisible ? 'none' : 'block';
}

// ── Search ────────────────────────────────────────────────────────────────────
let debounceTimer;
document.getElementById('search').addEventListener('input', e => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => buildSections(e.target.value), 120);
});

buildSections('');
</script>
<footer style="text-align:center;padding:1rem;font-size:.7rem;color:var(--muted);border-top:1px solid var(--border);">© 2026 J.L. Bonebakker · Focus2Flow B.V.</footer>
</body>
</html>
